<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3D 방탈출 프로토타입 - 기억의 연구실</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --ink: #e5f4ff;
      --muted: #9fb5c8;
      --accent: #38bdf8;
      --warm: #fbbf24;
      --danger: #fb7185;
      --ok: #34d399;
      --panel: rgba(8, 16, 31, .78);
      --glass: rgba(255, 255, 255, .09);
      --line: rgba(190, 230, 255, .28);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 8%, #19345b 0%, var(--bg) 52%, #030711 100%);
      color: var(--ink);
      user-select: none;
      touch-action: manipulation;
    }

    button, input { font: inherit; }
    button {
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      box-shadow: 0 10px 24px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.2);
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    button:active { transform: translateY(1px) scale(.99); }
    button:hover { border-color: rgba(125, 211, 252, .7); }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(56,189,248,.65); outline-offset: 3px; }

    #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; }

    .hud {
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 14px 8px;
      pointer-events: none;
    }
    .pill, .inventory {
      pointer-events: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 10px 12px;
      box-shadow: 0 12px 35px rgba(0,0,0,.32);
    }
    .title { font-weight: 900; letter-spacing: -.02em; }
    .subtitle { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .inventory { min-width: min(48vw, 360px); }
    .inventory b { color: var(--warm); }
    .items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; min-height: 27px; }
    .item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(56,189,248,.13);
      border: 1px solid rgba(56,189,248,.35);
      font-size: 12px;
    }

    .stage {
      position: relative;
      overflow: hidden;
      perspective: 900px;
      display: grid;
      place-items: center;
    }
    .vignette, .scanlines, .success-flare { pointer-events: none; position: absolute; inset: 0; z-index: 9; }
    .vignette { background: radial-gradient(circle at 50% 45%, transparent 0 50%, rgba(0,0,0,.45) 78%, rgba(0,0,0,.78) 100%); }
    .scanlines { opacity: .13; background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(255,255,255,.1) 6px); mix-blend-mode: overlay; }
    .success-flare { opacity: 0; background: radial-gradient(circle, rgba(52,211,153,.55), transparent 58%); transition: opacity .5s; }
    .success-flare.on { opacity: 1; }

    .room {
      position: relative;
      width: min(92vw, 960px);
      height: min(64vh, 560px);
      min-height: 390px;
      transform-style: preserve-3d;
      transform: rotateX(2deg) rotateY(var(--yaw, 0deg));
      transition: transform .42s cubic-bezier(.2,.75,.2,1);
    }
    .wall, .floor, .ceiling {
      position: absolute;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: inset 0 0 80px rgba(0,0,0,.45);
    }
    .back-wall {
      inset: 0;
      background:
        radial-gradient(circle at 50% 28%, rgba(56,189,248,.22), transparent 24%),
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(145deg, #17243a, #0c1628 62%, #16233a);
      background-size: auto, 74px 74px, 74px 74px, auto;
      transform: translateZ(-260px);
      border-radius: 18px;
    }
    .left-wall, .right-wall {
      top: 0;
      width: 520px;
      height: 100%;
      background: linear-gradient(130deg, #0e1a2d, #101f36 55%, #08111e);
    }
    .left-wall { left: 0; transform-origin: left center; transform: rotateY(90deg) translateX(-260px); }
    .right-wall { right: 0; transform-origin: right center; transform: rotateY(-90deg) translateX(260px); }
    .floor {
      left: 0; right: 0; bottom: -260px; height: 520px;
      transform-origin: top center; transform: rotateX(90deg);
      background:
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(#111827, #050914);
      background-size: 86px 86px, 86px 86px, auto;
      border-radius: 12px;
    }
    .ceiling {
      left: 0; right: 0; top: -260px; height: 520px;
      transform-origin: bottom center; transform: rotateX(-90deg);
      background: radial-gradient(circle at 50% 70%, rgba(251,191,36,.18), transparent 26%), linear-gradient(#08101d, #0f1c31);
    }

    .object {
      position: absolute;
      z-index: 4;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0,0,0,.75);
      background: var(--glass);
      backdrop-filter: blur(4px);
      transform-style: preserve-3d;
      transition: transform .18s, filter .18s, box-shadow .18s, opacity .2s;
    }
    .object:hover, .object.hot {
      filter: brightness(1.18) saturate(1.08);
      box-shadow: 0 0 0 2px rgba(56,189,248,.28), 0 0 34px rgba(56,189,248,.38);
    }
    .object small { display: block; color: #dbeafe; font-size: 12px; opacity: .88; margin-top: 4px; }

    .door {
      left: 392px; top: 92px; width: 176px; height: 312px;
      border-radius: 90px 90px 10px 10px;
      background:
        linear-gradient(90deg, transparent 45%, rgba(255,255,255,.16) 50%, transparent 55%),
        linear-gradient(#273b57, #132138);
      font-size: 48px;
    }
    .door.open { transform: translateZ(24px) rotateY(-16deg); box-shadow: 0 0 60px rgba(52,211,153,.55); }
    .door.open::after {
      content: ""; position: absolute; inset: 20px; border-radius: inherit;
      background: radial-gradient(circle, rgba(52,211,153,.72), rgba(56,189,248,.25) 45%, transparent 70%);
      z-index: -1;
    }
    .keypad { left: 585px; top: 194px; width: 82px; height: 128px; border-radius: 14px; background: linear-gradient(#1e293b, #0f172a); }
    .painting { left: 105px; top: 86px; width: 160px; height: 116px; border-radius: 8px; background: linear-gradient(135deg, #7c2d12, #fbbf24 45%, #0ea5e9 46%, #1e3a8a); transform: rotateZ(-1deg); }
    .painting.moved { transform: rotateZ(-13deg) translateY(18px); }
    .safe { left: 133px; top: 232px; width: 128px; height: 104px; border-radius: 18px; background: linear-gradient(145deg, #334155, #111827); }
    .desk { right: 90px; bottom: 88px; width: 232px; height: 120px; border-radius: 18px; background: linear-gradient(#7c4a24, #3f2412); }
    .desk::after { content: ""; position: absolute; left: 18px; right: 18px; top: 42px; height: 24px; border-radius: 9px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.12); }
    .books { right: 132px; top: 98px; width: 176px; height: 132px; border-radius: 12px; background: linear-gradient(90deg, #991b1b 0 22%, #1d4ed8 22% 45%, #166534 45% 68%, #a16207 68% 100%); }
    .clock { left: 408px; top: 28px; width: 112px; height: 76px; border-radius: 999px; background: radial-gradient(circle, #f8fafc 0 45%, #475569 47% 60%, #111827 61%); color: #0f172a; font-weight: 900; }
    .vent { right: 86px; top: 268px; width: 118px; height: 82px; border-radius: 10px; background: repeating-linear-gradient(0deg, #94a3b8 0 6px, #334155 7px 13px); }
    .lamp { left: 54px; bottom: 74px; width: 76px; height: 134px; border-radius: 999px 999px 16px 16px; background: linear-gradient(#fef3c7, #f59e0b 42%, #422006 43%); }
    .lamp.on { box-shadow: 0 0 70px rgba(251,191,36,.85); }

    .controls {
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      padding: 8px 14px max(14px, env(safe-area-inset-bottom));
      align-items: end;
    }
    .nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .nav button, .reset { min-height: 44px; padding: 10px 14px; }
    .hint {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 12px;
      color: var(--muted);
      background: var(--panel);
      backdrop-filter: blur(14px);
      line-height: 1.35;
      font-size: 13px;
      max-width: 520px;
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50; display: none; place-items: center;
      background: rgba(0,0,0,.52); backdrop-filter: blur(8px);
      padding: 18px;
    }
    .modal-backdrop.show { display: grid; }
    .modal {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(15,23,42,.96), rgba(3,7,18,.96));
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      padding: 20px;
    }
    .modal h2 { margin: 0 0 10px; font-size: 24px; }
    .modal p { color: #cbd5e1; line-height: 1.6; margin: 8px 0; }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 18px; }
    .modal-actions button { padding: 11px 14px; min-height: 44px; }
    .primary { background: linear-gradient(180deg, rgba(56,189,248,.4), rgba(14,116,144,.55)); }
    .success { background: linear-gradient(180deg, rgba(52,211,153,.4), rgba(21,128,61,.55)); }
    .danger { background: linear-gradient(180deg, rgba(251,113,133,.38), rgba(159,18,57,.45)); }

    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .keypad-grid button { min-height: 52px; font-size: 18px; }
    .code-display {
      width: 100%; padding: 14px; border-radius: 16px;
      border: 1px solid rgba(56,189,248,.35); background: rgba(15,23,42,.86); color: var(--ink);
      font-size: 28px; letter-spacing: .3em; text-align: center;
    }

    .toast {
      position: fixed; left: 50%; top: 88px; transform: translateX(-50%) translateY(-18px);
      z-index: 70; opacity: 0; pointer-events: none;
      max-width: min(92vw, 620px); padding: 12px 14px; border-radius: 16px;
      border: 1px solid var(--line); background: rgba(15,23,42,.92); color: var(--ink);
      box-shadow: 0 18px 50px rgba(0,0,0,.38); transition: opacity .2s, transform .2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .ending {
      position: fixed; inset: 0; z-index: 80; display: none; place-items: center; text-align: center;
      background: radial-gradient(circle, rgba(56,189,248,.35), rgba(3,7,18,.96) 62%);
      padding: 24px;
    }
    .ending.show { display: grid; animation: fadeIn .45s ease; }
    .ending-card { max-width: 680px; border: 1px solid var(--line); border-radius: 32px; padding: 28px; background: rgba(15,23,42,.84); box-shadow: 0 24px 80px rgba(0,0,0,.55); }
    .ending h1 { font-size: clamp(34px, 8vw, 76px); margin: 0 0 8px; }
    .ending p { color: #cbd5e1; line-height: 1.7; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .pulse { animation: pulse 1.2s ease-in-out infinite; }

    @media (max-width: 720px) {
      .hud { align-items: stretch; flex-direction: column; }
      .inventory { min-width: 0; }
      .room { width: 900px; height: 520px; transform: scale(.62) rotateX(2deg) rotateY(var(--yaw, 0deg)); }
      .controls { grid-template-columns: 1fr; }
      .hint { max-width: none; }
      .reset { justify-self: stretch; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="hud" aria-live="polite">
      <div class="pill">
        <span class="title">기억의 연구실</span>
        <span class="subtitle">3D 방탈출 프로토타입 · 클릭해서 단서를 찾으세요</span>
      </div>
      <div class="inventory">
        <b>가방</b>
        <div class="items" id="items"></div>
      </div>
    </header>

    <main class="stage" aria-label="3D 방탈출 방">
      <div class="room" id="room">
        <div class="wall back-wall"></div>
        <div class="wall left-wall"></div>
        <div class="wall right-wall"></div>
        <div class="floor"></div>
        <div class="ceiling"></div>

        <button class="object clock" data-action="clock" aria-label="시계 보기">03:15</button>
        <button class="object painting" id="painting" data-action="painting" aria-label="그림 조사">그림<small>비뚤어져 있다</small></button>
        <button class="object safe" data-action="safe" aria-label="금고 조사">금고<small id="safeLabel">닫힘</small></button>
        <button class="object door" id="door" data-action="door" aria-label="문 조사">🚪<small id="doorLabel">잠김</small></button>
        <button class="object keypad" data-action="keypad" aria-label="키패드 조사">🔢<small>입력</small></button>
        <button class="object desk" data-action="desk" aria-label="책상 조사">책상<small id="deskLabel">서랍이 있다</small></button>
        <button class="object books" data-action="books" aria-label="책장 조사">책장<small>색 순서</small></button>
        <button class="object vent" data-action="vent" aria-label="환풍구 조사">환풍구<small id="ventLabel">나사 고정</small></button>
        <button class="object lamp" id="lamp" data-action="lamp" aria-label="스탠드 조사">💡<small>꺼짐</small></button>
      </div>
      <div class="success-flare" id="flare"></div>
      <div class="vignette"></div>
      <div class="scanlines"></div>
    </main>

    <footer class="controls">
      <button class="reset danger" id="resetBtn">처음부터</button>
      <div class="hint" id="hint">목표: 문을 열고 연구실을 탈출하세요. 먼저 방 안의 물건들을 눌러보세요.</div>
      <div class="nav" aria-label="시점 조작">
        <button id="lookLeft">⬅ 왼쪽 보기</button>
        <button id="lookFront">정면</button>
        <button id="lookRight">오른쪽 보기 ➡</button>
      </div>
    </footer>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </section>
  </div>

  <div class="toast" id="toast" aria-live="assertive"></div>

  <div class="ending" id="ending">
    <div class="ending-card">
      <h1>탈출 성공</h1>
      <p>문 너머의 빛이 켜졌습니다. 이 프로토타입은 3D 시점, 오브젝트 조사, 인벤토리, 코드 입력, 단계별 해금 흐름을 테스트하기 위한 MVP입니다.</p>
      <button class="primary" id="playAgain">다시 플레이</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'escape3d.prototype.v01';
    const initialState = {
      yaw: 0,
      paintingMoved: false,
      safeOpen: false,
      lampOn: false,
      deskOpen: false,
      ventOpen: false,
      doorOpen: false,
      ending: false,
      code: '',
      items: []
    };

    let state = loadState();

    const itemNames = {
      keycard: '🪪 키카드',
      screwdriver: '🪛 드라이버',
      fuse: '⚡ 퓨즈',
      memo: '📝 메모'
    };

    const room = document.getElementById('room');
    const itemsEl = document.getElementById('items');
    const hintEl = document.getElementById('hint');
    const toastEl = document.getElementById('toast');
    const backdrop = document.getElementById('modalBackdrop');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalActions = document.getElementById('modalActions');
    const flare = document.getElementById('flare');
    const ending = document.getElementById('ending');

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved ? { ...initialState, ...saved } : { ...initialState };
      } catch (error) {
        return { ...initialState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function hasItem(item) {
      return state.items.includes(item);
    }

    function addItem(item) {
      if (!hasItem(item)) {
        state.items.push(item);
        toast(itemNames[item] + ' 획득');
        flash();
        saveState();
        render();
      }
    }

    function setHint(text) {
      hintEl.textContent = text;
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(toastEl.timer);
      toastEl.timer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    function flash() {
      flare.classList.add('on');
      setTimeout(() => flare.classList.remove('on'), 380);
    }

    function render() {
      room.style.setProperty('--yaw', state.yaw + 'deg');
      itemsEl.innerHTML = state.items.length
        ? state.items.map(item => `<span class="item">${itemNames[item]}</span>`).join('')
        : '<span class="item">비어 있음</span>';

      document.getElementById('painting').classList.toggle('moved', state.paintingMoved);
      document.getElementById('lamp').classList.toggle('on', state.lampOn);
      document.getElementById('door').classList.toggle('open', state.doorOpen);
      document.getElementById('safeLabel').textContent = state.safeOpen ? '열림' : '닫힘';
      document.getElementById('doorLabel').textContent = state.doorOpen ? '열림' : '잠김';
      document.getElementById('deskLabel').textContent = state.deskOpen ? '조사 완료' : '서랍이 있다';
      document.getElementById('ventLabel').textContent = state.ventOpen ? '열림' : '나사 고정';
      ending.classList.toggle('show', state.ending);
    }

    function showModal(title, bodyHtml, actions) {
      modalTitle.textContent = title;
      modalBody.innerHTML = bodyHtml;
      modalActions.innerHTML = '';
      actions.forEach(action => {
        const button = document.createElement('button');
        button.textContent = action.label;
        button.className = action.className || '';
        button.addEventListener('click', action.onClick);
        modalActions.appendChild(button);
      });
      backdrop.classList.add('show');
    }

    function closeModal() {
      backdrop.classList.remove('show');
    }

    function inspectClock() {
      showModal('벽시계', '<p>시계는 멈춰 있습니다. 바늘은 <b>3시 15분</b>을 가리킵니다.</p><p>숫자로 쓰면 <b>0315</b>입니다.</p>', [
        { label: '기억해두기', className: 'primary', onClick: () => { addItem('memo'); setHint('메모를 얻었습니다. 0315가 어딘가의 비밀번호일 수 있습니다.'); closeModal(); } },
        { label: '닫기', onClick: closeModal }
      ]);
    }

    function inspectPainting() {
      if (!state.paintingMoved) {
        showModal('비뚤어진 그림', '<p>그림 뒤쪽에서 카드 모서리가 살짝 보입니다.</p><p>그림을 밀면 떨어질 것 같습니다.</p>', [
          { label: '그림을 옆으로 밀기', className: 'primary', onClick: () => { state.paintingMoved = true; addItem('keycard'); setHint('키카드를 얻었습니다. 문 옆 키패드에 쓸 수 있을 것 같습니다.'); closeModal(); render(); saveState(); } },
          { label: '그냥 두기', onClick: closeModal }
        ]);
      } else {
        showModal('그림 뒤', '<p>이미 키카드를 챙겼습니다. 그림 뒤에는 작은 문구가 있습니다.</p><p><b>“빛을 켜면 숨은 것이 보인다.”</b></p>', [{ label: '닫기', onClick: closeModal }]);
      }
    }

    function inspectSafe() {
      if (state.safeOpen) {
        showModal('열린 금고', '<p>금고는 비어 있습니다. 안쪽에 “전원은 환기구 뒤”라고 적혀 있습니다.</p>', [{ label: '닫기', onClick: closeModal }]);
        return;
      }
      showModal('금고', '<p>네 자리 숫자를 입력하는 금고입니다. 시계의 시간이 떠오릅니다.</p><input class="code-display" id="safeCode" inputmode="numeric" maxlength="4" placeholder="----" />', [
        { label: '0315 입력', className: 'primary', onClick: () => openSafe('0315') },
        { label: '직접 확인', onClick: () => openSafe(document.getElementById('safeCode').value) },
        { label: '닫기', onClick: closeModal }
      ]);
      setTimeout(() => document.getElementById('safeCode')?.focus(), 50);
    }

    function openSafe(code) {
      if (code === '0315') {
        state.safeOpen = true;
        addItem('screwdriver');
        setHint('금고가 열리고 드라이버를 얻었습니다. 환풍구 나사를 풀 수 있습니다.');
        closeModal();
        render();
        saveState();
      } else {
        toast('금고가 열리지 않습니다');
      }
    }

    function inspectDesk() {
      if (!state.deskOpen) {
        showModal('책상 서랍', '<p>서랍 안에는 낡은 실험 노트가 있습니다.</p><p><b>빨강 → 파랑 → 초록 → 노랑</b>. 책 순서가 전원 색을 뜻하는 것 같습니다.</p>', [
          { label: '노트 챙기기', className: 'primary', onClick: () => { state.deskOpen = true; addItem('memo'); setHint('책 색 순서를 확인했습니다. 스탠드를 켜고 방을 다시 살펴보세요.'); closeModal(); render(); saveState(); } },
          { label: '닫기', onClick: closeModal }
        ]);
      } else {
        showModal('책상', '<p>서랍은 비어 있습니다. 노트에는 색 순서만 남아 있습니다.</p>', [{ label: '닫기', onClick: closeModal }]);
      }
    }

    function inspectBooks() {
      showModal('책장', '<p>책등 색이 왼쪽부터 <b>빨강, 파랑, 초록, 노랑</b>입니다.</p><p>책 사이에 작은 홈이 있지만 지금은 아무것도 없습니다.</p>', [
        { label: '닫기', onClick: () => { setHint('색 순서는 단서입니다. 아직 직접 입력할 곳은 없어 보입니다.'); closeModal(); } }
      ]);
    }

    function inspectVent() {
      if (!hasItem('screwdriver')) {
        showModal('환풍구', '<p>환풍구는 나사로 단단히 고정되어 있습니다.</p><p>도구가 필요합니다.</p>', [{ label: '닫기', onClick: closeModal }]);
        return;
      }
      if (!state.ventOpen) {
        showModal('환풍구', '<p>드라이버로 나사를 풀 수 있습니다. 안쪽에서 작은 퓨즈가 반짝입니다.</p>', [
          { label: '나사를 풀고 퓨즈 꺼내기', className: 'primary', onClick: () => { state.ventOpen = true; addItem('fuse'); setHint('퓨즈를 얻었습니다. 스탠드나 문 장치에 전원이 필요할 것 같습니다.'); closeModal(); render(); saveState(); } },
          { label: '닫기', onClick: closeModal }
        ]);
      } else {
        showModal('열린 환풍구', '<p>퓨즈를 이미 꺼냈습니다. 차가운 바람만 흐릅니다.</p>', [{ label: '닫기', onClick: closeModal }]);
      }
    }

    function inspectLamp() {
      if (!hasItem('fuse')) {
        showModal('꺼진 스탠드', '<p>전구는 멀쩡하지만 전원이 들어오지 않습니다.</p><p>어딘가에서 퓨즈를 찾아야 할 것 같습니다.</p>', [{ label: '닫기', onClick: closeModal }]);
        return;
      }
      if (!state.lampOn) {
        showModal('스탠드', '<p>퓨즈를 끼우면 스탠드가 켜질 것 같습니다.</p>', [
          { label: '퓨즈 끼우기', className: 'success', onClick: () => { state.lampOn = true; setHint('스탠드가 켜졌습니다. 문 옆 키패드가 활성화되었습니다.'); toast('전원이 복구되었습니다'); flash(); closeModal(); render(); saveState(); } },
          { label: '닫기', onClick: closeModal }
        ]);
      } else {
        showModal('켜진 스탠드', '<p>따뜻한 빛이 문 옆 키패드를 비춥니다. 이제 마지막 입력이 가능해 보입니다.</p>', [{ label: '닫기', onClick: closeModal }]);
      }
    }

    function inspectKeypad() {
      if (!hasItem('keycard')) {
        showModal('키패드', '<p>화면에 “CARD REQUIRED”라고 표시됩니다.</p><p>키카드가 필요합니다.</p>', [{ label: '닫기', onClick: closeModal }]);
        return;
      }
      if (!state.lampOn) {
        showModal('키패드', '<p>키카드는 인식됐지만 전원이 불안정합니다.</p><p>방 안의 전원을 복구해야 합니다.</p>', [{ label: '닫기', onClick: closeModal }]);
        return;
      }
      state.code = '';
      showModal('문 잠금 키패드', '<p>키카드가 인식되었습니다. 책 색 순서와 시계 단서를 합쳐 마지막 코드를 입력하세요.</p><input class="code-display" id="doorCode" readonly value="" aria-label="입력된 코드" /><div class="keypad-grid" id="pad"></div>', [
        { label: '지우기', onClick: () => { state.code = ''; updateDoorCode(); } },
        { label: '확인', className: 'success', onClick: submitDoorCode },
        { label: '닫기', onClick: closeModal }
      ]);
      const pad = document.getElementById('pad');
      ['1','2','3','4','5','6','7','8','9','0'].forEach(num => {
        const button = document.createElement('button');
        button.textContent = num;
        button.addEventListener('click', () => {
          if (state.code.length < 4) state.code += num;
          updateDoorCode();
        });
        pad.appendChild(button);
      });
      updateDoorCode();
    }

    function updateDoorCode() {
      const input = document.getElementById('doorCode');
      if (input) input.value = state.code.padEnd(4, '·');
    }

    function submitDoorCode() {
      if (state.code === '3154' || state.code === '0315') {
        state.doorOpen = true;
        saveState();
        render();
        setHint('문이 열렸습니다. 이제 문을 눌러 탈출하세요.');
        toast('잠금 해제');
        flash();
        closeModal();
      } else {
        toast('코드가 맞지 않습니다. 시계 0315를 떠올려보세요.');
      }
    }

    function inspectDoor() {
      if (!state.doorOpen) {
        showModal('잠긴 문', '<p>두꺼운 자동문입니다. 키카드, 전원, 코드가 모두 필요합니다.</p><p>문 옆 키패드를 먼저 해결하세요.</p>', [
          { label: '키패드 보기', className: 'primary', onClick: () => { closeModal(); inspectKeypad(); } },
          { label: '닫기', onClick: closeModal }
        ]);
      } else {
        showModal('열린 문', '<p>문틈 사이로 푸른 빛이 들어옵니다. 나갈 준비가 됐습니다.</p>', [
          { label: '방을 나가기', className: 'success', onClick: () => { state.ending = true; saveState(); closeModal(); render(); } },
          { label: '조금 더 둘러보기', onClick: closeModal }
        ]);
      }
    }

    function resetGame() {
      state = { ...initialState };
      localStorage.removeItem(STORAGE_KEY);
      setHint('목표: 문을 열고 연구실을 탈출하세요. 먼저 방 안의 물건들을 눌러보세요.');
      closeModal();
      render();
      toast('처음부터 다시 시작합니다');
    }

    function setYaw(yaw) {
      state.yaw = yaw;
      saveState();
      render();
    }

    document.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', () => {
        const action = el.dataset.action;
        const handlers = {
          clock: inspectClock,
          painting: inspectPainting,
          safe: inspectSafe,
          door: inspectDoor,
          keypad: inspectKeypad,
          desk: inspectDesk,
          books: inspectBooks,
          vent: inspectVent,
          lamp: inspectLamp
        };
        handlers[action]();
      });
    });

    document.getElementById('lookLeft').addEventListener('click', () => setYaw(12));
    document.getElementById('lookFront').addEventListener('click', () => setYaw(0));
    document.getElementById('lookRight').addEventListener('click', () => setYaw(-12));
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('playAgain').addEventListener('click', resetGame);
    backdrop.addEventListener('click', event => {
      if (event.target === backdrop) closeModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeModal();
      if (event.key === 'ArrowLeft') setYaw(12);
      if (event.key === 'ArrowRight') setYaw(-12);
      if (event.key === 'ArrowUp') setYaw(0);
    });

    render();
  </script>
</body>
</html>
