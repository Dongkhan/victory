<!doctype html>

<title>기억의 연구실 v0.3 - 작은 2공간 Doom 스타일 방탈출</title>
<style>
:root{color-scheme:dark;--ink:#eaf6ff;--muted:#9fb3c8;--accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--panel:rgba(5,10,20,.70);--line:rgba(174,222,255,.25)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020712;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#020712}.hud{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px 0;pointer-events:none}.panel{pointer-events:auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.34);border-radius:16px;padding:9px 11px}.title{font-weight:900}.sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}.inv{max-width:min(44vw,320px)}.items{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.item{font-size:12px;border:1px solid rgba(56,189,248,.34);background:rgba(56,189,248,.12);border-radius:999px;padding:4px 7px}.crosshair{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(234,246,255,.75);box-shadow:0 0 8px rgba(56,189,248,.9)}.crosshair:before{left:10px;top:0;width:2px;height:22px}.crosshair:after{left:0;top:10px;width:22px;height:2px}.hintBox{position:fixed;z-index:6;left:10px;top:94px;max-width:270px;pointer-events:auto;border:1px solid var(--line);border-radius:16px;background:rgba(5,10,20,.56);backdrop-filter:blur(10px);box-shadow:0 10px 28px rgba(0,0,0,.26);overflow:hidden}.hintTop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px;color:#cbd5e1;font-size:12px}.hintTop button{min-width:34px;min-height:30px}.hint{padding:0 9px 9px;color:#cbd5e1;line-height:1.35;font-size:12px}.hintBox.closed .hint{display:none}.bottom{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 10px max(10px,env(safe-area-inset-bottom));pointer-events:none}.movePad{pointer-events:auto;display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:7px;grid-template-areas:". up ." "left down right"}.lookPad{pointer-events:auto;display:grid;grid-template-columns:64px 96px 64px;gap:7px}.btn,button{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));color:var(--ink);box-shadow:0 10px 22px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.16);font:inherit;cursor:pointer}.btn{min-width:58px;min-height:58px;font-size:22px}.btn:active,button:active{transform:translateY(1px)}#up{grid-area:up}#down{grid-area:down}#left{grid-area:left}#right{grid-area:right}.lookPad button{min-height:58px;padding:8px 10px}.primary{background:linear-gradient(180deg,rgba(56,189,248,.42),rgba(14,116,144,.55))}.success{background:linear-gradient(180deg,rgba(52,211,153,.38),rgba(21,128,61,.50))}.danger{background:linear-gradient(180deg,rgba(251,113,133,.36),rgba(159,18,57,.46))}.toast{position:fixed;z-index:20;left:50%;top:82px;max-width:min(92vw,600px);transform:translateX(-50%) translateY(-14px);opacity:0;transition:.16s;padding:11px 13px;border:1px solid var(--line);background:rgba(15,23,42,.92);border-radius:15px;box-shadow:0 18px 48px rgba(0,0,0,.42);pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal-backdrop{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:18px}.modal-backdrop.show{display:grid}.modal{width:min(540px,100%);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(15,23,42,.97),rgba(3,7,18,.97));box-shadow:0 28px 90px rgba(0,0,0,.58);padding:20px}.modal h2{margin:0 0 10px}.modal p{color:#cbd5e1;line-height:1.6}.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}.modal-actions button{padding:11px 14px;min-height:44px}.code{width:100%;padding:14px;border-radius:16px;border:1px solid rgba(56,189,248,.35);background:rgba(15,23,42,.86);color:var(--ink);font-size:28px;letter-spacing:.28em;text-align:center}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.pad button{min-height:52px;font-size:18px}.ending{position:fixed;inset:0;z-index:40;display:none;place-items:center;text-align:center;background:radial-gradient(circle,rgba(56,189,248,.36),rgba(2,6,23,.97) 62%);padding:24px}.ending.show{display:grid}.ending-card{max-width:680px;border:1px solid var(--line);border-radius:30px;padding:28px;background:rgba(15,23,42,.86);box-shadow:0 26px 90px rgba(0,0,0,.6)}.ending h1{font-size:clamp(34px,8vw,76px);margin:0 0 8px}.ending p{color:#cbd5e1;line-height:1.7}@media(max-width:760px){.hud{gap:6px}.panel{padding:8px 9px}.sub{display:none}.inv{max-width:48vw}.hintBox{top:76px;max-width:220px}.bottom{align-items:flex-end}.lookPad{grid-template-columns:56px 86px 56px}.lookPad button,.btn{min-height:54px}.movePad{grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Doom 스타일 3D 방탈출 화면"></canvas><div class="crosshair" aria-hidden="true"></div>
<header class="hud"><div class="panel"><span class="title">기억의 연구실 v0.3</span><span class="sub">작은 2공간 · 세밀한 이동/회전 · E 또는 조사</span><button class="danger" id="reset" style="margin-top:7px;padding:6px 9px;min-height:32px;font-size:12px">처음부터</button></div><div class="panel inv"><b>가방</b><div class="items" id="items"></div></div></header>
<aside class="hintBox" id="hintBox"><div class="hintTop"><b>힌트</b><button id="hintToggle">접기</button></div><div class="hint" id="hint">정면을 가리지 않도록 설명창을 왼쪽에 작게 옮겼습니다. 중앙 조준점으로 물건을 보고 조사하세요.</div></aside>
<footer class="bottom"><div class="movePad"><button class="btn" id="up">▲</button><button class="btn" id="left">◀</button><button class="btn" id="down">▼</button><button class="btn" id="right">▶</button></div><div class="lookPad"><button id="turnL">↶</button><button class="primary" id="use">조사</button><button id="turnR">↷</button></div></footer>
<div class="toast" id="toast"></div><div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></section></div>
<div class="ending" id="ending"><div class="ending-card"><h1>탈출 성공</h1><p>v0.3은 큰 미로 대신 두 개의 작은 공간으로 나누고, 첫 방의 퍼즐을 풀면 두 번째 방으로 넘어가게 만든 버전입니다. 조작도 느리고 세밀하게 조정했습니다.</p><button class="primary" id="again">다시 플레이</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=11,H=9;
const BASE_MAP=['11111111111','10000010001','10203010001','10000070061','10000010001','11111110001','10000004001','10050000001','11111111111'].map(r=>r.split('').map(Number));
const objects={clock:{x:2.5,y:2.45,icon:'◷',name:'시계',color:'#f8fafc'},safe:{x:4.55,y:2.5,icon:'▣',name:'금고',color:'#94a3b8'},inner:{x:6.55,y:3.5,icon:'▯',name:'연결문',color:'#fbbf24'},desk:{x:8.35,y:6.5,icon:'▤',name:'작업대',color:'#a16207'},vent:{x:8.55,y:7.35,icon:'≋',name:'환풍구',color:'#cbd5e1'},lamp:{x:8.55,y:3.45,icon:'☀',name:'전원등',color:'#f59e0b'},keypad:{x:9.35,y:3.48,icon:'▦',name:'출구패널',color:'#38bdf8'},exit:{x:10.45,y:3.5,icon:'▯',name:'출구',color:'#34d399'}};
const STORAGE='escape3d.raycast.v03';
const initial={px:2.6,py:4.1,pa:-Math.PI/2,items:[],safeOpen:false,innerOpen:false,deskOpen:false,ventOpen:false,lampOn:false,exitOpen:false,ending:false,code:''};
let state=load(),keys={},depths=[],last=performance.now(),toastTimer;
const itemsEl=document.getElementById('items'),hintEl=document.getElementById('hint'),hintBox=document.getElementById('hintBox'),toastEl=document.getElementById('toast'),backdrop=document.getElementById('backdrop'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody'),modalActions=document.getElementById('modalActions'),endingEl=document.getElementById('ending');
const itemNames={keycard:'🪪 키카드',screwdriver:'🪛 드라이버',fuse:'⚡ 퓨즈',memo:'📝 메모'};
function load(){try{return{...initial,...JSON.parse(localStorage.getItem(STORAGE))}}catch(e){return{...initial}}}function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(innerWidth*dpr);canvas.height=Math.floor(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function has(i){return state.items.includes(i)}function addItem(i){if(!has(i)){state.items.push(i);toast(itemNames[i]+' 획득');save();renderHud()}}function renderHud(){itemsEl.innerHTML=state.items.length?state.items.map(i=>`<span class="item">${itemNames[i]}</span>`).join(''):'<span class="item">비어 있음</span>';endingEl.classList.toggle('show',state.ending)}function setHint(t){hintEl.textContent=t;hintBox.classList.remove('closed');document.getElementById('hintToggle').textContent='접기'}function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1600)}
function wallAt(x,y){if(x<0||y<0||x>=W||y>=H)return 1;let v=BASE_MAP[Math.floor(y)][Math.floor(x)];if(v===7&&state.innerOpen)return 0;if(v===6&&state.exitOpen)return 0;return v}function solid(x,y){return wallAt(x,y)>0}function move(a){const nx=state.px+Math.cos(state.pa)*a,ny=state.py+Math.sin(state.pa)*a;if(!solid(nx,state.py))state.px=nx;if(!solid(state.px,ny))state.py=ny;save()}function strafe(a){const nx=state.px+Math.cos(state.pa+Math.PI/2)*a,ny=state.py+Math.sin(state.pa+Math.PI/2)*a;if(!solid(nx,state.py))state.px=nx;if(!solid(state.px,ny))state.py=ny;save()}function turn(a){state.pa+=a;save()}function shade(hex,k){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgb(${Math.max(0,Math.min(255,r*k))},${Math.max(0,Math.min(255,g*k))},${Math.max(0,Math.min(255,b*k))})`}function wallColor(id,side,dist){const base={1:'#334155',2:'#7c2d12',3:'#475569',4:'#78350f',5:'#1e3a8a',6:'#064e3b',7:'#92400e'}[id]||'#334155';const k=Math.max(.30,1/(1+dist*.13))*(side?.80:1);return shade(base,k)}
function castRay(a){let sin=Math.sin(a),cos=Math.cos(a);for(let d=.02;d<12;d+=.02){const x=state.px+cos*d,y=state.py+sin*d,id=wallAt(x,y);if(id>0){const fx=x-Math.floor(x);return{d,id,side:fx<.04||fx>.96}}}return{d:12,id:0,side:false}}function draw3D(){const sw=innerWidth,sh=innerHeight;ctx.clearRect(0,0,sw,sh);let g=ctx.createLinearGradient(0,0,0,sh/2);g.addColorStop(0,'#07111f');g.addColorStop(1,state.lampOn?'#18334d':'#0b1424');ctx.fillStyle=g;ctx.fillRect(0,0,sw,sh/2);let f=ctx.createLinearGradient(0,sh/2,0,sh);f.addColorStop(0,state.lampOn?'#172033':'#101827');f.addColorStop(1,'#020617');ctx.fillStyle=f;ctx.fillRect(0,sh/2,sw,sh/2);const fov=Math.PI/3;depths=[];for(let x=0;x<sw;x+=2){const a=state.pa-fov/2+fov*x/sw,hit=castRay(a),dist=hit.d*Math.cos(a-state.pa),h=Math.min(sh*1.45,sh/(dist*.72)),y=(sh-h)/2;depths[Math.floor(x/2)]=dist;ctx.fillStyle=wallColor(hit.id,hit.side,dist);ctx.fillRect(x,y,2,h);if(hit.id===7&&!state.innerOpen||hit.id===6&&!state.exitOpen){ctx.fillStyle='rgba(251,191,36,.16)';ctx.fillRect(x,y+h*.18,2,h*.64)}}drawSprites(sw,sh,fov);drawMiniMap()}
function drawSprites(sw,sh,fov){Object.entries(objects).map(([id,o])=>{const dx=o.x-state.px,dy=o.y-state.py;let ang=Math.atan2(dy,dx)-state.pa;while(ang<-Math.PI)ang+=Math.PI*2;while(ang>Math.PI)ang-=Math.PI*2;return{id,o,dist:Math.hypot(dx,dy),ang}}).filter(s=>Math.abs(s.ang)<fov*.62&&s.dist>.22&&(s.id!=='inner'||!state.innerOpen)&&(s.id!=='exit'||!state.exitOpen)).sort((a,b)=>b.dist-a.dist).forEach(s=>{const sx=(.5+s.ang/fov)*sw,size=Math.min(155,sh/(s.dist*.9)),depth=depths[Math.max(0,Math.min(depths.length-1,Math.floor(sx/2)))]||99;if(s.dist>depth+.22)return;const y=sh/2-size*.65;ctx.globalAlpha=Math.max(.28,1-s.dist/9);ctx.fillStyle='rgba(2,6,23,.55)';ctx.beginPath();ctx.ellipse(sx,y+size*.92,size*.34,size*.10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=s.o.color;ctx.shadowColor=s.o.color;ctx.shadowBlur=16;ctx.font=`${Math.floor(size*.62)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.o.icon,sx,y+size*.45);ctx.shadowBlur=0;ctx.fillStyle='#eaf6ff';ctx.font=`${Math.max(12,Math.floor(size*.14))}px system-ui`;ctx.fillText(s.o.name,sx,y+size*.88);ctx.globalAlpha=1})}
function drawMiniMap(){const s=11,p=10;ctx.globalAlpha=.70;ctx.fillStyle='rgba(2,6,23,.58)';ctx.fillRect(p,p,W*s,H*s);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=wallAt(x+.1,y+.1);if(v){ctx.fillStyle=v===6?'#14532d':v===7?'#92400e':'#334155';ctx.fillRect(p+x*s,p+y*s,s-1,s-1)}}ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(p+state.px*s,p+state.py*s,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#38bdf8';ctx.beginPath();ctx.moveTo(p+state.px*s,p+state.py*s);ctx.lineTo(p+(state.px+Math.cos(state.pa)*.65)*s,p+(state.py+Math.sin(state.pa)*.65)*s);ctx.stroke();ctx.globalAlpha=1}
function nearestObject(){let best=null;for(const[id,o]of Object.entries(objects)){const dx=o.x-state.px,dy=o.y-state.py,dist=Math.hypot(dx,dy);if(dist>1.55)continue;let ang=Math.atan2(dy,dx)-state.pa;while(ang<-Math.PI)ang+=Math.PI*2;while(ang>Math.PI)ang-=Math.PI*2;if(Math.abs(ang)<.40&&(!best||dist<best.dist))best={id,o,dist}}return best}function use(){const t=nearestObject();if(!t){toast('중앙 조준점에 맞추고 조금 더 가까이 가세요');return}handlers[t.id]()}
function showModal(title,body,actions){modalTitle.textContent=title;modalBody.innerHTML=body;modalActions.innerHTML='';actions.forEach(a=>{const b=document.createElement('button');b.textContent=a.label;b.className=a.className||'';b.onclick=a.onClick;modalActions.appendChild(b)});backdrop.classList.add('show')}function closeModal(){backdrop.classList.remove('show')}function openSafe(code){if(code==='0315'){state.safeOpen=true;state.innerOpen=true;addItem('keycard');setHint('첫 방 해결: 연결문이 열렸습니다. 이제 두 번째 공간으로 이동하세요.');toast('연결문 열림');save();closeModal()}else toast('금고가 열리지 않습니다')}function submitExit(){if(state.code==='0315'||state.code==='3154'){state.exitOpen=true;setHint('출구가 열렸습니다. 초록 문 앞으로 가서 조사하세요.');toast('출구 잠금 해제');save();closeModal()}else toast('코드가 맞지 않습니다')}
function updateCode(){const el=document.getElementById('doorCode');if(el)el.value=state.code.padEnd(4,'·')}const handlers={clock(){addItem('memo');setHint('시계 단서: 03:15. 같은 방의 금고에 써보세요.');showModal('멈춘 시계','<p>바늘이 <b>03:15</b>에서 멈춰 있습니다. 금고 비밀번호는 <b>0315</b>로 보입니다.</p>',[{label:'닫기',onClick:closeModal}]);save()},safe(){if(state.safeOpen){showModal('열린 금고','<p>이미 열렸습니다. 안쪽 스위치가 첫 방과 두 번째 방 사이의 연결문을 열었습니다.</p>',[{label:'닫기',onClick:closeModal}]);return}showModal('첫 방 금고','<p>이 금고를 열면 옆 공간으로 넘어가는 연결문이 열릴 것 같습니다.</p><input class="code" id="safeCode" inputmode="numeric" maxlength="4" placeholder="----">',[{label:'0315 입력',className:'primary',onClick:()=>openSafe('0315')},{label:'직접 확인',onClick:()=>openSafe(document.getElementById('safeCode').value)},{label:'닫기',onClick:closeModal}])},inner(){if(state.innerOpen){toast('이미 열려 있습니다');return}setHint('첫 방의 시계와 금고를 해결하면 이 연결문이 열립니다.');showModal('연결문','<p>잠겨 있습니다. 첫 방 안에서 열 수 있는 장치가 필요합니다.</p>',[{label:'닫기',onClick:closeModal}])},desk(){state.deskOpen=true;addItem('screwdriver');setHint('두 번째 공간: 작업대에서 드라이버를 얻었습니다. 환풍구를 열어보세요.');showModal('작업대','<p>작은 드라이버가 놓여 있습니다.</p>',[{label:'닫기',onClick:closeModal}]);save()},vent(){if(!has('screwdriver')){showModal('환풍구','<p>나사가 단단합니다. 작업대에서 도구를 찾아야 합니다.</p>',[{label:'닫기',onClick:closeModal}]);return}if(!state.ventOpen){state.ventOpen=true;addItem('fuse');setHint('퓨즈를 얻었습니다. 전원등을 켜면 출구패널이 활성화됩니다.');showModal('환풍구','<p>나사를 풀고 안쪽 퓨즈를 꺼냈습니다.</p>',[{label:'닫기',onClick:closeModal}]);save()}else showModal('열린 환풍구','<p>안쪽은 비어 있습니다.</p>',[{label:'닫기',onClick:closeModal}])},lamp(){if(!has('fuse')){showModal('전원등','<p>퓨즈가 빠져 있어 켜지지 않습니다.</p>',[{label:'닫기',onClick:closeModal}]);return}state.lampOn=true;setHint('전원이 켜졌습니다. 출구패널에 키카드와 코드를 입력하세요.');toast('전원 복구');save();showModal('전원등','<p>방이 밝아지고 출구패널이 켜졌습니다.</p>',[{label:'닫기',onClick:closeModal}])},keypad(){if(!has('keycard')){showModal('출구패널','<p>첫 방 금고에서 얻은 키카드가 필요합니다.</p>',[{label:'닫기',onClick:closeModal}]);return}if(!state.lampOn){showModal('출구패널','<p>전원이 없어 반응하지 않습니다.</p>',[{label:'닫기',onClick:closeModal}]);return}state.code='';showModal('출구패널','<p>시계 숫자를 다시 입력하세요.</p><input class="code" id="doorCode" readonly><div class="pad" id="pad"></div>',[{label:'지우기',onClick:()=>{state.code='';updateCode()}},{label:'확인',className:'success',onClick:submitExit},{label:'닫기',onClick:closeModal}]);const pad=document.getElementById('pad');['1','2','3','4','5','6','7','8','9','0'].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(state.code.length<4)state.code+=n;updateCode()};pad.appendChild(b)});updateCode()},exit(){if(!state.exitOpen){setHint('출구패널을 먼저 해결해야 합니다.');showModal('잠긴 출구','<p>출구는 아직 잠겨 있습니다. 옆의 출구패널을 확인하세요.</p>',[{label:'닫기',onClick:closeModal}]);return}state.ending=true;save();renderHud()}};
function reset(){state={...initial};localStorage.removeItem(STORAGE);closeModal();renderHud();setHint('정면을 가리지 않도록 설명창을 왼쪽에 작게 옮겼습니다. 중앙 조준점으로 물건을 보고 조사하세요.');toast('처음부터 시작')}function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!backdrop.classList.contains('show')&&!state.ending){const sp=dt*1.45,rs=dt*1.45;if(keys.w||keys.ArrowUp)move(sp);if(keys.s||keys.ArrowDown)move(-sp);if(keys.a)strafe(-sp);if(keys.d)strafe(sp);if(keys.ArrowLeft)turn(-rs);if(keys.ArrowRight)turn(rs)}draw3D();requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='e'||e.key===' ')use();if(e.key==='Escape')closeModal()});document.addEventListener('keyup',e=>keys[e.key]=false);function hold(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}hold('up','w');hold('down','s');hold('left','a');hold('right','d');hold('turnL','ArrowLeft');hold('turnR','ArrowRight');document.getElementById('use').onclick=use;document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeModal()});document.getElementById('hintToggle').onclick=()=>{hintBox.classList.toggle('closed');document.getElementById('hintToggle').textContent=hintBox.classList.contains('closed')?'열기':'접기'};let dragging=false,lastX=0;canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragging){turn((e.clientX-lastX)*0.0035);lastX=e.clientX}});canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('dblclick',use);renderHud();requestAnimationFrame(frame);
</script>
