<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>기억의 연구실 v0.5 - 이미지 기반 3D 방탈출</title>
<style>
:root{color-scheme:dark;--ink:#f8fbff;--muted:#b9c7d8;--accent:#67e8f9;--gold:#facc15;--pink:#fb7185;--ok:#34d399;--violet:#a78bfa;--panel:rgba(7,13,28,.72);--line:rgba(224,242,254,.26)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(rgba(3,7,18,.72),rgba(3,7,18,.86)),url('../assets/lab-reference-room.jpg') center/cover fixed;color:var(--ink);user-select:none;touch-action:manipulation}button,input{font:inherit}button{border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.07));color:var(--ink);box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.22);cursor:pointer;transition:transform .15s ease,border-color .15s ease,filter .15s ease}button:hover{border-color:rgba(103,232,249,.75);filter:brightness(1.08)}button:active{transform:scale(.97) translateY(1px)}.primary{background:linear-gradient(180deg,#38bdf8,#2563eb);border-color:rgba(186,230,253,.65);font-weight:900}.danger{background:linear-gradient(180deg,rgba(251,113,133,.35),rgba(127,29,29,.25))}#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}.hud{z-index:20;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:max(10px,env(safe-area-inset-top)) 10px 0;pointer-events:none}.panel{pointer-events:auto;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(0,0,0,.35);padding:10px 12px}.title{font-weight:1000;letter-spacing:-.03em}.sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}.inv{max-width:min(46vw,350px)}.items{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin-top:7px}.item{display:inline-flex;gap:5px;align-items:center;border:1px solid rgba(103,232,249,.38);background:rgba(103,232,249,.13);border-radius:999px;padding:5px 8px;font-size:12px;animation:itemIn .25s ease}.roomWrap{position:relative;min-height:0;display:grid;place-items:center;perspective:900px;overflow:hidden}.room{position:relative;width:min(94vw,820px);height:min(62vh,540px);transform-style:preserve-3d;transform:rotateX(0deg) rotateY(var(--look,0deg));transition:transform .55s cubic-bezier(.2,.9,.2,1)}.room.flash{animation:roomFlash .65s ease}.wall{position:absolute;inset:0;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 90px rgba(255,255,255,.08)}.back{transform:translateZ(-160px);border-radius:30px;background:linear-gradient(rgba(3,7,18,.12),rgba(3,7,18,.34)),url('../assets/lab-reference-room.jpg') center/cover;box-shadow:inset 0 0 90px rgba(0,0,0,.32),0 24px 80px rgba(0,0,0,.48)}.floor{height:30%;top:70%;transform-origin:top;transform:rotateX(70deg);border-radius:0 0 34px 34px;background:linear-gradient(180deg,rgba(23,35,58,.22),rgba(10,16,32,.62));border:0;pointer-events:none}.ceiling{display:none}.leftWall,.rightWall{display:none}.rug{display:none}.door{position:absolute;left:48%;bottom:24%;width:11%;height:34%;border-radius:14px;background:rgba(103,232,249,.16);border:2px solid rgba(103,232,249,.38);box-shadow:0 0 32px rgba(103,232,249,.2),inset 0 0 18px rgba(255,255,255,.08)}.door.open{animation:doorOpen .9s ease forwards}.door:after{content:"";position:absolute;right:14%;top:50%;width:12px;height:12px;border-radius:50%;background:#facc15;box-shadow:0 0 18px #facc15}.roomTag{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.32);border:1px solid var(--line);font-size:12px;color:#dbeafe}.object{position:absolute;z-index:5;display:grid;place-items:center;gap:3px;width:76px;min-height:76px;padding:8px;border:1px solid rgba(255,255,255,.34);border-radius:50%;background:radial-gradient(circle,rgba(103,232,249,.34),rgba(15,23,42,.62) 58%,rgba(15,23,42,.18));box-shadow:0 12px 28px rgba(0,0,0,.42),0 0 34px var(--glow,rgba(103,232,249,.45)),inset 0 1px rgba(255,255,255,.25);animation:pulseFloat 2.2s ease-in-out infinite;overflow:hidden}.object:before{content:"";position:absolute;inset:-45%;background:linear-gradient(120deg,transparent 38%,rgba(255,255,255,.45),transparent 62%);transform:translateX(-70%) rotate(18deg);animation:shine 3.2s ease-in-out infinite}.object:after{content:"조사";position:absolute;right:7px;top:7px;font-size:10px;font-weight:900;color:#031525;background:var(--gold);border-radius:999px;padding:3px 6px;box-shadow:0 0 14px rgba(250,204,21,.55)}.object.done{opacity:.55;filter:saturate(.55)}.object.hidden{display:none}.object .icon{font-size:30px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}.object .name{font-size:10px;font-weight:900;text-shadow:0 1px 4px #000}.object.near{outline:3px solid rgba(250,204,21,.55)}.object.pop{animation:pop .45s cubic-bezier(.25,1.8,.35,1),pulseFloat 2.2s ease-in-out infinite}.clock{left:46%;top:18%;--glow:rgba(250,204,21,.55)}.safe{left:17%;top:43%;--glow:rgba(103,232,249,.6)}.desk{left:17%;top:58%;--glow:rgba(251,146,60,.48)}.vent{left:47%;top:72%;--glow:rgba(226,232,240,.42)}.lamp{right:21%;top:44%;--glow:rgba(103,232,249,.62)}.panelObj{right:13%;top:52%;--glow:rgba(167,139,250,.62)}.spark{position:fixed;z-index:80;width:14px;height:14px;border-radius:50%;pointer-events:none;background:var(--gold);box-shadow:0 0 18px var(--gold);animation:spark .75s ease-out forwards}.toast{position:fixed;z-index:70;left:50%;bottom:118px;transform:translateX(-50%) translateY(18px);max-width:min(92vw,560px);padding:12px 15px;border-radius:18px;background:rgba(7,13,28,.88);border:1px solid var(--line);box-shadow:0 18px 42px rgba(0,0,0,.4);opacity:0;transition:.25s ease;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.controls{z-index:25;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 10px max(10px,env(safe-area-inset-bottom));pointer-events:none}.controls>*{pointer-events:auto}.nav,.actions{display:flex;gap:8px;align-items:center}.nav button,.actions button{min-width:62px;min-height:48px;padding:10px 13px}.hint{max-width:390px;color:#dbeafe;line-height:1.35;font-size:13px}.modalBg,.ending{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(2,6,23,.72);backdrop-filter:blur(8px);padding:18px}.modalBg.show,.ending.show{display:grid}.modal,.endingCard{width:min(94vw,520px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(20,34,58,.96),rgba(8,13,27,.96));box-shadow:0 26px 80px rgba(0,0,0,.55);padding:22px}.modal h2,.ending h1{margin:0 0 10px}.modal p{color:#dbeafe;line-height:1.6}.modalActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.code{width:100%;font-size:30px;text-align:center;letter-spacing:.18em;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);padding:12px}@keyframes pulseFloat{0%,100%{transform:translateY(0) scale(1);filter:brightness(1)}50%{transform:translateY(-6px) scale(1.06);filter:brightness(1.18)}}@keyframes shine{0%,55%{transform:translateX(-78%) rotate(18deg)}78%,100%{transform:translateX(78%) rotate(18deg)}}@keyframes pop{0%{transform:scale(1)}55%{transform:scale(1.18) rotate(-2deg)}100%{transform:scale(1)}}@keyframes itemIn{from{transform:translateY(-6px) scale(.9);opacity:0}to{transform:none;opacity:1}}@keyframes roomFlash{0%{filter:brightness(1)}40%{filter:brightness(1.35) saturate(1.3)}100%{filter:brightness(1)}}@keyframes doorOpen{to{transform:perspective(500px) rotateY(-38deg);filter:brightness(1.25)}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}@media(max-width:680px){.room{width:96vw;height:55vh}.object{width:78px;min-height:82px;border-radius:20px}.object .icon{font-size:31px}.clock{left:8%;top:23%}.safe{left:37%;top:48%}.desk{left:10%;top:50%}.vent{left:45%;top:20%}.lamp{left:39%;top:48%}.panelObj{right:21%;top:37%}.hint{display:none}.nav button,.actions button{min-width:52px}.inv{max-width:48vw}.sub{font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="panel"><span class="title">기억의 연구실 v0.5</span><span class="sub">첨부 이미지 배경 · 좌우 방해선 제거 · 강조 상호작용</span><button class="danger" id="reset" style="margin-top:7px;padding:6px 9px;min-height:32px;font-size:12px">처음부터</button></div>
    <div class="panel inv"><b>가방</b><div class="items" id="items"></div></div>
  </header>
  <main class="roomWrap" aria-label="아늑한 3D 방탈출 화면">
    <section class="room" id="room">
      <div class="wall back"></div><div class="wall ceiling"></div><div class="wall floor"></div><div class="wall leftWall"></div><div class="wall rightWall"></div><div class="rug"></div><div class="roomTag" id="roomTag">첫 번째 작은 방</div><div class="door" id="door"></div>
      <button class="object clock" data-id="clock"><span class="icon">🪟</span><span class="name">커튼 단서</span></button>
      <button class="object safe" data-id="safe"><span class="icon">💻</span><span class="name">왼쪽 PC</span></button>
      <button class="object desk hidden" data-id="desk"><span class="icon">🗄️</span><span class="name">서랍장</span></button>
      <button class="object vent hidden" data-id="vent"><span class="icon">🔌</span><span class="name">케이블</span></button>
      <button class="object lamp hidden" data-id="lamp"><span class="icon">🖥️</span><span class="name">오른쪽 PC</span></button>
      <button class="object panelObj hidden" data-id="keypad"><span class="icon">🔷</span><span class="name">인증 화면</span></button>
    </section>
  </main>
  <footer class="controls">
    <div class="nav"><button id="lookL">왼쪽</button><button id="lookC">정면</button><button id="lookR">오른쪽</button></div>
    <div class="panel hint" id="hint">첨부 이미지의 어두운 연구실 분위기를 배경으로 적용했습니다. 좌우 사선 라인은 제거했고, 빛나는 핫스팟을 눌러 조사하세요.</div>
    <div class="actions"><button id="switchRoom">다음 공간</button><button class="primary" id="focusBtn">눈에 띄게</button></div>
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="modalBg" id="modalBg" role="dialog" aria-modal="true"><section class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modalActions" id="modalActions"></div></section></div>
<div class="ending" id="ending"><section class="endingCard"><h1>탈출 성공 🎉</h1><p>v0.5는 첨부한 연구실 이미지를 배경으로 활용하고, 시야를 방해하던 좌우 사선 벽 라인을 제거했습니다. 아이템은 이미지 위의 빛나는 핫스팟처럼 보이고 조사 순간에는 팝·플래시·스파크가 강조됩니다.</p><button class="primary" id="again">다시 플레이</button></section></div>
<script>
const STORAGE='escape3d.image.v05';
const initial={room:0,items:[],memo:false,safeOpen:false,doorOpen:false,deskOpen:false,ventOpen:false,lampOn:false,exitOpen:false,ending:false};
let state=load(),toastTimer;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const room=$('#room'),itemsEl=$('#items'),hintEl=$('#hint'),toastEl=$('#toast'),modalBg=$('#modalBg'),modalTitle=$('#modalTitle'),modalBody=$('#modalBody'),modalActions=$('#modalActions'),ending=$('#ending');
const names={memo:'📝 03:15 메모',keycard:'🪪 키카드',screwdriver:'🪛 드라이버',fuse:'⚡ 퓨즈'};
function load(){try{return{...initial,...JSON.parse(localStorage.getItem(STORAGE))}}catch(e){return{...initial}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function has(i){return state.items.includes(i)}
function addItem(i,el){if(has(i))return;state.items.push(i);save();render();burst(el||document.body,9);toast(names[i]+' 획득');}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1700)}
function hint(t){hintEl.textContent=t}
function render(){itemsEl.innerHTML=state.items.length?state.items.map(i=>`<span class="item">${names[i]}</span>`).join(''):'<span class="item">비어 있음</span>';$('#roomTag').textContent=state.room?'두 번째 작은 방':'첫 번째 작은 방';room.style.setProperty('--look',state.room?'7deg':'-7deg');$('#door').classList.toggle('open',state.doorOpen||state.exitOpen);ending.classList.toggle('show',state.ending);$$('.object').forEach(o=>o.classList.add('hidden'));
 if(state.room===0){show('clock',!state.memo);show('safe',true);$('.safe').classList.toggle('done',state.safeOpen)}else{show('desk',!state.deskOpen);show('vent',true);show('lamp',true);show('keypad',true);$('.vent').classList.toggle('done',state.ventOpen);$('.lamp').classList.toggle('done',state.lampOn);$('.panelObj').classList.toggle('done',state.exitOpen)} }
function show(id,on){const el=$(`[data-id="${id}"]`);if(on)el.classList.remove('hidden')}
function roomFlash(){room.classList.remove('flash');void room.offsetWidth;room.classList.add('flash')}
function pop(el){if(!el)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');roomFlash()}
function burst(el,count=7){const r=el.getBoundingClientRect();for(let i=0;i<count;i++){const s=document.createElement('i');s.className='spark';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*180-90)+'px');s.style.setProperty('--dy',(Math.random()*-150-35)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),780)}}
function modal(title,body,actions){modalTitle.textContent=title;modalBody.innerHTML=body;modalActions.innerHTML='';actions.forEach(a=>{const b=document.createElement('button');b.textContent=a.label;b.className=a.className||'';b.onclick=a.onClick;modalActions.appendChild(b)});modalBg.classList.add('show')}
function closeModal(){modalBg.classList.remove('show')}
function switchRoom(){if(state.room===0&&!state.doorOpen){hint('첫 방의 시계 단서로 금고를 열면 옆 공간으로 넘어갈 수 있어요.');toast('아직 연결문이 잠겨 있어요');return}state.room=state.room?0:1;save();render();roomFlash();toast(state.room?'두 번째 작은 방으로 이동':'첫 번째 방으로 돌아옴')}
function submitSafe(code,el){if(code==='0315'){state.safeOpen=true;state.doorOpen=true;addItem('keycard',el);hint('연결문이 활짝 열렸습니다. 아래의 “다음 공간” 버튼으로 두 번째 방에 들어가세요.');toast('연결문 열림 ✨');save();closeModal();render();return}toast('비밀번호가 맞지 않아요')}
const handlers={clock(el){pop(el);state.memo=true;addItem('memo',el);hint('시계가 03:15에서 멈춰 있습니다. 금고 비밀번호로 써보세요.');modal('멈춘 시계 🕰️','<p>유리 안쪽에서 금빛 숫자 <b>03:15</b>가 반짝입니다. 시계를 누르는 순간 작은 메모가 가방으로 날아갑니다.</p>',[{label:'닫기',onClick:closeModal}]);save();render()},safe(el){pop(el);if(state.safeOpen){modal('열린 금고 🔐','<p>금고 안의 스위치가 이미 연결문을 열었습니다.</p>',[{label:'닫기',onClick:closeModal}]);return}modal('빛나는 금고 🔐','<p>시계에서 본 네 자리 숫자를 넣어야 합니다.</p><input class="code" id="safeCode" inputmode="numeric" maxlength="4" placeholder="----">',[{label:'0315 입력',className:'primary',onClick:()=>submitSafe('0315',el)},{label:'직접 확인',onClick:()=>submitSafe($('#safeCode').value,el)},{label:'닫기',onClick:closeModal}])},desk(el){pop(el);state.deskOpen=true;addItem('screwdriver',el);hint('드라이버를 얻었습니다. 반짝이는 환풍구를 열어보세요.');modal('작업대 🧰','<p>작은 작업대 위에 예쁜 파란 드라이버가 놓여 있습니다. 클릭하자 가방으로 톡 튀어 들어갑니다.</p>',[{label:'닫기',onClick:closeModal}]);save();render()},vent(el){pop(el);if(!has('screwdriver')){modal('환풍구 🌀','<p>나사가 반짝이지만 손으로는 열리지 않습니다. 작업대 도구가 필요합니다.</p>',[{label:'닫기',onClick:closeModal}]);return}if(!state.ventOpen){state.ventOpen=true;addItem('fuse',el);hint('퓨즈를 얻었습니다. 노란 전원등에 끼워 방을 밝혀보세요.');modal('환풍구 열림 🌀','<p>드라이버로 나사를 돌리자 환풍구가 반짝이며 열리고, 안쪽에서 퓨즈가 튀어나옵니다.</p>',[{label:'닫기',onClick:closeModal}]);save();render()}else modal('빈 환풍구','<p>이미 퓨즈를 꺼냈습니다.</p>',[{label:'닫기',onClick:closeModal}])},lamp(el){pop(el);if(!has('fuse')){modal('전원등 💡','<p>등 안쪽에 퓨즈 자리가 비어 있습니다.</p>',[{label:'닫기',onClick:closeModal}]);return}state.lampOn=true;hint('전원이 켜졌습니다. 출구패널이 파랗게 켜졌어요.');toast('방 전체가 환해졌습니다');burst(el,14);save();render();modal('전원 복구 💡','<p>퓨즈가 딸깍 들어가며 방 전체가 밝아집니다. 출구패널이 활성화되었습니다.</p>',[{label:'닫기',onClick:closeModal}])},keypad(el){pop(el);if(!has('keycard')){modal('출구패널 🔷','<p>첫 방 금고에서 얻는 키카드가 필요합니다.</p>',[{label:'닫기',onClick:closeModal}]);return}if(!state.lampOn){modal('출구패널 🔷','<p>전원이 꺼져 있어 화면이 보이지 않습니다.</p>',[{label:'닫기',onClick:closeModal}]);return}modal('출구패널 🔷','<p>키카드가 인식되었습니다. 시계에서 얻은 코드를 다시 입력하세요.</p><input class="code" id="exitCode" inputmode="numeric" maxlength="4" placeholder="----">',[{label:'0315 입력',className:'primary',onClick:()=>openExit('0315',el)},{label:'직접 확인',onClick:()=>openExit($('#exitCode').value,el)},{label:'닫기',onClick:closeModal}])}};
function openExit(code,el){if(code==='0315'){state.exitOpen=true;state.ending=true;hint('출구가 열렸습니다. 성공!');burst(el,22);save();closeModal();render();roomFlash();return}toast('코드가 맞지 않아요')}
function reset(){state={...initial};localStorage.removeItem(STORAGE);closeModal();render();hint('첨부 이미지의 어두운 연구실 분위기를 배경으로 적용했습니다. 좌우 사선 라인은 제거했고, 빛나는 핫스팟을 눌러 조사하세요.');toast('처음부터 시작')}
$$('.object').forEach(el=>{el.addEventListener('click',()=>handlers[el.dataset.id](el));el.addEventListener('pointerenter',()=>el.classList.add('near'));el.addEventListener('pointerleave',()=>el.classList.remove('near'))});
$('#lookL').onclick=()=>room.style.setProperty('--look','-16deg');$('#lookC').onclick=()=>room.style.setProperty('--look',state.room?'7deg':'-7deg');$('#lookR').onclick=()=>room.style.setProperty('--look','16deg');$('#switchRoom').onclick=switchRoom;$('#focusBtn').onclick=()=>{$$('.object:not(.hidden)').forEach((o,i)=>setTimeout(()=>pop(o),i*120));hint('현재 방에서 조사할 수 있는 물건을 모두 한 번씩 강조했습니다.')};$('#reset').onclick=reset;$('#again').onclick=reset;modalBg.addEventListener('click',e=>{if(e.target===modalBg)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')$('#lookL').click();if(e.key==='ArrowRight')$('#lookR').click();if(e.key==='Enter')$('#focusBtn').click()});render();
</script>
</body>
</html>
