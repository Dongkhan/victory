<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>창 — 기억의 연구실 v0.7</title>
<style>
:root{color-scheme:dark;--bg:#050813;--ink:#eef7ff;--muted:#9fb2c9;--line:rgba(191,219,254,.2);--panel:rgba(8,13,27,.76);--cyan:#67e8f9;--gold:#fde68a;--warm:#fbbf24;--rose:#fb7185;--violet:#a78bfa;--green:#86efac;--shadow:rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 18% 20%,rgba(30,64,175,.38),transparent 34%),radial-gradient(circle at 78% 0%,rgba(88,28,135,.28),transparent 34%),linear-gradient(180deg,#020617,#0f172a 55%,#111827);color:var(--ink);user-select:none}button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.045));box-shadow:0 12px 24px var(--shadow),inset 0 1px rgba(255,255,255,.14);padding:10px 12px;cursor:pointer;transition:.16s transform,.16s border-color,.16s filter}button:hover{border-color:rgba(103,232,249,.75);filter:brightness(1.08)}button:active{transform:scale(.97) translateY(1px)}button.primary{background:linear-gradient(180deg,#38bdf8,#2563eb);font-weight:900}button.warm{background:linear-gradient(180deg,rgba(251,191,36,.55),rgba(180,83,9,.35))}button.ghost{box-shadow:none;background:rgba(255,255,255,.04)}button.bad{border-color:rgba(251,113,133,.38)}button.good{border-color:rgba(134,239,172,.55)}input{font:inherit;color:#111827;background:#f8fafc;border:0;border-radius:14px;padding:11px 12px;min-width:120px}.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}.hud{z-index:30;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 10px 0;pointer-events:none}.panel{pointer-events:auto;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 18px 40px rgba(0,0,0,.36);padding:10px 12px}.title{font-weight:1000;letter-spacing:-.04em}.sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}.progress{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.dot{width:24px;height:24px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px}.dot.on{background:rgba(103,232,249,.18);color:var(--cyan);border-color:rgba(103,232,249,.65)}.dot.done{background:rgba(134,239,172,.16);color:var(--green);border-color:rgba(134,239,172,.6)}.stats{max-width:min(48vw,390px);font-size:13px;color:var(--muted)}.stageWrap{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden}.room{position:relative;width:min(96vw,980px);height:min(68vh,620px);border:1px solid rgba(191,219,254,.18);border-radius:30px;background:linear-gradient(180deg,rgba(15,23,42,.62),rgba(3,7,18,.84));box-shadow:inset 0 0 90px rgba(0,0,0,.5),0 30px 80px rgba(0,0,0,.45);overflow:hidden;filter:brightness(var(--bright, .58)) saturate(var(--sat, .9));transition:filter .8s ease,background .8s ease}.room:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 0 8%,rgba(253,230,138,var(--beam,.0)) 8.8% 10.6%,transparent 12% 100%);mix-blend-mode:screen;pointer-events:none}.floor{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(180deg,transparent,rgba(15,23,42,.7));border-top:1px solid rgba(148,163,184,.12)}.window{position:absolute;right:7%;top:8%;width:170px;height:230px;border:8px solid rgba(148,163,184,.35);border-radius:12px;background:linear-gradient(90deg,rgba(2,6,23,.96) 0 46%,rgba(253,230,138,.18) 48% 51%,rgba(2,6,23,.96) 53%);box-shadow:0 0 30px rgba(253,230,138,.12)}.window.open{background:linear-gradient(90deg,rgba(2,6,23,.35),rgba(253,230,138,.72));box-shadow:0 0 140px rgba(253,230,138,.42)}.bed{position:absolute;left:5%;bottom:10%;width:260px;height:110px;border-radius:26px;background:linear-gradient(180deg,#334155,#111827);box-shadow:0 20px 30px rgba(0,0,0,.38)}.desk{position:absolute;right:18%;bottom:12%;width:260px;height:120px;border-radius:18px;background:linear-gradient(180deg,#334155,#1e293b);box-shadow:0 18px 32px rgba(0,0,0,.4)}.object{position:absolute;min-width:72px;min-height:52px;display:grid;place-items:center;gap:3px;text-align:center;font-weight:900}.object small{display:block;font-weight:700;color:var(--muted);font-size:11px}.mirror{left:26%;top:21%;transform:rotate(var(--mirror,0deg))}.cup{left:48%;top:48%;transform:rotate(var(--cup,0deg))}.frame{left:34%;top:62%;transform:rotate(var(--frame,0deg))}.switch{left:9%;top:31%}.trace{right:28%;top:28%;opacity:0;transform:scale(.94);transition:.5s}.trace.show{opacity:1;transform:scale(1);box-shadow:0 0 36px rgba(253,230,138,.7)}.note{left:38%;top:19%}.bowl{right:31%;bottom:18%}.phone{left:42%;bottom:18%}.voiceBox{right:8%;bottom:17%}.photo{left:18%;top:18%}.curtain{right:6%;top:7%;width:185px;height:245px;border-radius:16px}.hot{animation:pulse 1.7s ease-in-out infinite}.hidden{display:none!important}.glow{box-shadow:0 0 34px rgba(103,232,249,.55),inset 0 1px rgba(255,255,255,.22)}.cardLayer{position:absolute;inset:14px;display:grid;place-items:center;pointer-events:none}.puzzle{pointer-events:auto;width:min(92%,780px);max-height:92%;overflow:auto;border:1px solid var(--line);border-radius:24px;background:rgba(3,7,18,.78);backdrop-filter:blur(12px);padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.48)}.puzzle h2{margin:0 0 8px;font-size:22px}.puzzle p{color:var(--muted);line-height:1.55}.choices,.tiles,.tools,.fakeGrid{display:grid;gap:10px}.choices{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.choice{justify-content:flex-start;text-align:left}.choice.selected{background:rgba(103,232,249,.18);border-color:rgba(103,232,249,.8)}.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.tile{min-height:70px;text-align:left}.tile.picked{outline:2px solid var(--gold);transform:translateY(-2px)}.order{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip{padding:6px 9px;border:1px solid rgba(253,230,138,.45);border-radius:999px;background:rgba(253,230,138,.12);font-size:12px}.tools{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.voiceMeter{height:18px;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}.voiceMeter i{display:block;height:100%;width:var(--voice,35%);background:linear-gradient(90deg,#fb7185,#f97316);transition:.25s}.fakeGrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.log{min-height:42px;border-left:3px solid rgba(103,232,249,.6);padding:8px 10px;background:rgba(103,232,249,.08);border-radius:10px;color:#dbeafe}.footer{z-index:25;display:grid;grid-template-columns:1fr auto;gap:10px;padding:0 10px max(10px,env(safe-area-inset-bottom));align-items:end}.hint{min-height:58px;line-height:1.45;color:#dbeafe}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(18px);z-index:60;opacity:0;pointer-events:none;background:rgba(15,23,42,.92);border:1px solid var(--line);border-radius:999px;padding:11px 15px;box-shadow:0 14px 34px rgba(0,0,0,.44);transition:.22s}.toast.show{opacity:1;transform:translateX(-50%)}.ending{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:radial-gradient(circle at 52% 30%,rgba(253,230,138,.28),transparent 34%),rgba(2,6,23,.78);backdrop-filter:blur(10px)}.ending.show{display:grid}.endingCard{width:min(92vw,680px);border:1px solid rgba(253,230,138,.38);border-radius:28px;background:rgba(15,23,42,.88);padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.56)}.endingCard h1{font-size:34px;margin:0 0 8px}.endingCard p{color:#dbeafe;line-height:1.7}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 8px rgba(103,232,249,.35))}50%{filter:drop-shadow(0 0 22px rgba(103,232,249,.9))}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}.spark{position:fixed;z-index:75;width:8px;height:8px;border-radius:999px;background:var(--gold);pointer-events:none;animation:spark .75s ease-out forwards}@media(max-width:720px){.hud{align-items:stretch}.stats{max-width:48vw}.room{height:67vh}.footer{grid-template-columns:1fr}.actions{justify-content:stretch}.actions button{flex:1}.puzzle{padding:14px}.window{width:120px;height:180px}.desk{right:10%;width:210px}.bed{width:210px}.object{font-size:13px;min-width:62px}.choices,.tiles,.tools,.fakeGrid{grid-template-columns:1fr}}

/* v0.7 sensory upgrade */
.mood{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mood span{font-size:11px;color:#dbeafe;border:1px solid rgba(147,197,253,.25);background:rgba(59,130,246,.12);border-radius:999px;padding:3px 7px}.ambience{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:28px}.ambience i{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(253,230,138,.72);box-shadow:0 0 18px rgba(103,232,249,.75);animation:drift 8s linear infinite}.ambience i:nth-child(1){left:12%;top:70%;animation-duration:9s}.ambience i:nth-child(2){left:28%;top:58%;animation-delay:-2s}.ambience i:nth-child(3){left:52%;top:76%;animation-delay:-4s}.ambience i:nth-child(4){left:73%;top:61%;animation-delay:-1s}.ambience i:nth-child(5){left:88%;top:68%;animation-delay:-5s}.scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 42%,rgba(103,232,249,.08) 48%,transparent 55%);mix-blend-mode:screen;animation:scan 6.5s ease-in-out infinite;opacity:.55}.object.hot:not(.hidden),.object.warm:not(.hidden),.object.primary:not(.hidden){animation:focusPulse 2.3s ease-in-out infinite}.object:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.chapterSplash{position:fixed;left:50%;top:44%;z-index:80;transform:translate(-50%,-50%) scale(.94);opacity:0;pointer-events:none;border:1px solid rgba(253,230,138,.45);border-radius:26px;background:linear-gradient(180deg,rgba(15,23,42,.92),rgba(30,41,59,.82));box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(103,232,249,.18);padding:22px 28px;text-align:center;transition:.28s}.chapterSplash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.chapterSplash b{display:block;font-size:24px}.chapterSplash small{display:block;margin-top:8px;color:#bfdbfe}body[data-chapter="1"] .room{filter:hue-rotate(8deg) saturate(calc(var(--sat)*1.05)) brightness(var(--bright))}body[data-chapter="2"] .room{filter:hue-rotate(-18deg) saturate(calc(var(--sat)*1.08)) brightness(var(--bright))}body[data-chapter="3"] .room{filter:hue-rotate(24deg) saturate(calc(var(--sat)*.95)) brightness(var(--bright))}body[data-chapter="4"] .room{filter:hue-rotate(-36deg) saturate(calc(var(--sat)*1.18)) brightness(calc(var(--bright)*1.08))}@keyframes drift{0%{transform:translateY(40px) scale(.6);opacity:0}15%,70%{opacity:1}100%{transform:translateY(-180px) translateX(38px) scale(1.2);opacity:0}}@keyframes scan{0%,100%{transform:translateX(-46%);opacity:.12}45%,65%{opacity:.58}100%{transform:translateX(46%);opacity:.12}}@keyframes focusPulse{0%,100%{box-shadow:0 12px 24px var(--shadow),0 0 0 rgba(103,232,249,0)}50%{box-shadow:0 18px 34px rgba(0,0,0,.45),0 0 26px rgba(103,232,249,.32)}}@media (prefers-reduced-motion:reduce){.ambience i,.scan,.object.hot:not(.hidden),.object.warm:not(.hidden),.object.primary:not(.hidden){animation:none}.chapterSplash{transition:none}}

</style>
</head>
<body>
<div class="app">
<header class="hud">
  <div class="panel"><span class="title">『창』 — 기억의 연구실 v0.7</span><span class="sub">2D 인터랙티브 방탈출 · 감각 피드백 강화판</span><div class="progress" id="progress"></div><div class="mood" id="mood"></div></div>
  <div class="panel stats"><b id="chapterName"></b><span class="sub" id="hintStage">단서 단계 0 · 순수 실력 구간</span><button class="ghost" id="reset" style="margin-top:8px;padding:6px 9px;font-size:12px">처음부터</button></div>
</header>
<main class="stageWrap">
<section class="room" id="room">
  <div class="ambience" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="scan" aria-hidden="true"></div><div class="window" id="window"></div><div class="bed"></div><div class="desk"></div><div class="floor"></div>
  <button class="object switch bad" id="switchBtn">스위치<small>force</small></button>
  <button class="object mirror hot" id="mirrorBtn">거울<br><small id="mirrorVal">0°</small></button>
  <button class="object cup hot" id="cupBtn">유리컵<br><small id="cupVal">0°</small></button>
  <button class="object frame hot" id="frameBtn">액자<br><small id="frameVal">0°</small></button>
  <button class="object trace warm" id="traceBtn">희미한 흔적<small>빛이 닿아야 보임</small></button>
  <button class="object note hot hidden" id="noteBtn">엄마의 메모<small>덧칠됨</small></button>
  <button class="object bowl warm hidden" id="bowlBtn">식은 죽 그릇<small>작은 행동</small></button>
  <button class="object phone hot hidden" id="phoneBtn">흩어진 대화<small>9조각</small></button>
  <button class="object voiceBox bad hidden" id="voiceBtn">목소리<small>커진다</small></button>
  <button class="object photo warm hidden" id="photoBtn">사진<small>버리지 않기</small></button>
  <button class="object curtain primary hidden" id="curtainBtn">커튼 손잡이<small>그냥 열기</small></button>
  <div class="cardLayer" id="cardLayer"></div>
</section>
</main>
<footer class="footer">
  <div class="panel hint" id="hint">방은 어둡다. 전등 스위치는 보이지만, 커튼 틈의 한 줄기 빛이 더 정확해 보인다.</div>
  <div class="actions"><button id="waitBtn">방에 머물기</button><button class="primary" id="actBtn">현재 퍼즐 열기</button></div>
</footer>
</div>
<div class="toast" id="toast"></div>
<div class="chapterSplash" id="chapterSplash"></div>
<div class="ending" id="ending"><section class="endingCard"><h1>오늘은 한 번 열었다.</h1><p>목소리는 사라지지 않았다. 구석에서 아주 옅게, “또 닫힐 거야”라고 말한다. 그래도 손은 커튼을 잡았고, 창은 열렸다. 내일은 모른다. 오늘은 이만큼이면 된다.</p><button class="primary" id="again">다시 시작</button></section></div>
<script>
const STORAGE='memory.lab.window.v07';
const chapters=['닫힘','연민','우정','사랑','창'];
const initial={ch:0,angles:{mirror:0,cup:0,frame:0},hint:0,started:Date.now(),picked:[],order:[],voice:35,box:false,done:[false,false,false,false,false],warmth:0,ending:false,badges:[],pulse:0};
let state=load(),timer=null,toastTimer=null,holdTimer=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(STORAGE)||'{}'),started:Date.now()}}catch(e){return {...initial,started:Date.now()}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');navigator.vibrate?.(18);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function chime(kind='soft'){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),o=a.createOscillator(),g=a.createGain();o.type=kind==='clear'?'triangle':'sine';o.frequency.value=kind==='clear'?740:420;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.045,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.22);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.24)}catch(e){}}
function award(id,text){if(!state.badges)state.badges=[];if(state.badges.includes(id))return;state.badges.push(id);save();toast('기억 조각 획득 · '+text);chime('clear')}
function splash(text){const el=$('#chapterSplash');el.innerHTML='<b>'+text+'</b><small>방의 온도가 조금 바뀐다</small>';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1250)}
function burst(el,n=12){const r=el.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement('i');s.className='spark';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*190-95)+'px');s.style.setProperty('--dy',(Math.random()*-170-25)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),800)}}
function setHint(t){$('#hint').textContent=t}
function startChapter(ch){state.ch=ch;state.hint=0;state.started=Date.now();state.picked=[];state.order=[];save();render();}
function completeChapter(){state.done[state.ch]=true;award('ch'+state.ch,chapters[state.ch]);burst($('#room'),24);chime('clear');if(state.ch<4){splash('제'+(state.ch+2)+'장 — '+chapters[state.ch+1]);setTimeout(()=>startChapter(state.ch+1),520)}else{state.ending=true;save();render()}}
function render(){const ch=state.ch;document.body.dataset.chapter=ch;$('#progress').innerHTML=chapters.map((c,i)=>`<span class="dot ${state.done[i]?'done':''} ${i===ch?'on':''}">${i+1}</span>`).join('');$('#mood').innerHTML=`<span>온기 ${state.warmth}/4</span><span>기억 조각 ${(state.badges||[]).length}/5</span>`;$('#chapterName').textContent=`제${ch+1}장 — ${chapters[ch]}`;$('#hintStage').textContent=`단서 단계 ${state.hint} · ${hintLabel()}`;$('#ending').classList.toggle('show',!!state.ending);$('#room').style.setProperty('--bright',(.54+state.warmth*.08+state.hint*.045).toFixed(2));$('#room').style.setProperty('--sat',(.86+state.warmth*.035).toFixed(2));$('#room').style.setProperty('--beam', ch===0? .20+state.hint*.10 : ch===4? .72 : .10+state.warmth*.08);$('#window').classList.toggle('open',ch===4&&state.done[4]);['switchBtn','mirrorBtn','cupBtn','frameBtn','traceBtn','noteBtn','bowlBtn','phoneBtn','voiceBtn','photoBtn','curtainBtn'].forEach(id=>$('#'+id).classList.add('hidden'));if(ch===0){['switchBtn','mirrorBtn','cupBtn','frameBtn','traceBtn'].forEach(id=>$('#'+id).classList.remove('hidden'));$('#traceBtn').classList.toggle('show',lightSolved());}if(ch===1){['noteBtn','bowlBtn'].forEach(id=>$('#'+id).classList.remove('hidden'));}if(ch===2){$('#phoneBtn').classList.remove('hidden')}if(ch===3){['voiceBtn','photoBtn'].forEach(id=>$('#'+id).classList.remove('hidden'));$('#room').style.setProperty('--bright',Math.max(.38,.60-state.voice/180).toFixed(2));}if(ch===4){$('#curtainBtn').classList.remove('hidden');}['mirror','cup','frame'].forEach(k=>{const v=state.angles[k];$('#'+k+'Btn').style.setProperty('--'+k,v+'deg');$('#'+k+'Val').textContent=v+'°'});if(!$('#cardLayer').innerHTML) chapterHint();}
function hintLabel(){return ['순수 실력 구간','빛·소리가 아주 미세하게 변함','목소리가 역설적으로 단서를 흘림','방이 결정 단서를 드러냄'][state.hint]||'방이 기다린 만큼 깨어남'}
function chapterHint(){const h=[
 '스위치를 세게 눌러도 아무 일도 없다. 반사체의 각도를 바꿔 한 줄기 빛을 흔적으로 보내야 한다.',
 '비난처럼 보이는 글과 진짜 메모가 섞여 있다. 문체의 균열을 보고 원문 4개만 고르자.',
 '시간순 배열은 한 조각을 남긴다. 같은 조각을 다른 축으로 읽어야 한다.',
 '지우기·끄기·밀어내기는 전부 목소리를 키운다. 도구의 용도를 바꿔야 한다.',
 '방은 복잡한 가짜 단서로 가득하다. 마지막 퍼즐은 더 풀지 않는 것이다.'
];setHint(h[state.ch])}
function advanceHint(force=false){const elapsed=(Date.now()-state.started)/1000;let next=elapsed>=360?3:elapsed>=180?2:elapsed>=60?1:0;if(force) next=Math.min(3,state.hint+1);if(next>state.hint){state.hint=next;save();render();softHint()}else if(force){softHint()} }
function softHint(){const msg={0:['어둠에 눈이 적응하며 거울·컵·액자 가장자리가 또렷해진다.','목소리 글자가 아주 조금 흐려져, 진짜 메모의 호흡이 남는다.','남는 조각 하나가 시간표 밖에서 희미하게 깜빡인다.','지우개 버튼의 모서리가 상자처럼 접히는 착시가 보인다.','커튼 손잡이가 처음부터 같은 자리에 있었다는 사실이 도드라진다.'],1:['반사 경로는 거울 → 유리컵 → 액자 → 흔적 순서로 이어질 수 있다.','엄마의 문장은 명령보다 구체적인 생활 행동을 말한다.','보낸 말과 받은 말을 번갈아 놓으면 다른 리듬이 생긴다.','없애려 누를수록 커진다. 오래 누르면 모양이 바뀔지도 모른다.','가짜 단서들은 모두 “더 풀어야 한다”고 유혹한다.'],2:['결정 단서: 거울 45°, 유리컵 135°, 액자 90°. 한 줄기면 충분하다.','결정 단서: “죽”, “문 앞”, “먹지 않아도”, “그냥” 같은 생활 단어를 고른다.','결정 단서: 파란/초록 감정표식을 교차해 연결 순서로 놓는다.','결정 단서: 지우기를 길게 눌러 상자로 바꾸고, 목소리를 담는다.','결정 단서: 커튼을 잡고 연다.'],3:['결정 단서: 거울 45°, 유리컵 135°, 액자 90°.','진짜 문장 4개만 남기면 비난이 아니라 곁에 있겠다는 말이 된다.','시간이 아니라 연결의 축이다.','지우기 버튼을 길게 누르자.','그냥 연다.']}[state.hint]||[];setHint(msg[state.ch]||'방은 조용히 기다린다.');}
function rotate(k){state.angles[k]=(state.angles[k]+45)%180;save();render();if(lightSolved())setHint('빛이 여러 반사체를 지나 흔적 위에 정확히 놓였다. 완전히 열지 않아도, 한 줄기면 보인다.');}
function lightSolved(){return state.angles.mirror===45&&state.angles.cup===135&&state.angles.frame===90}
function openCurrent(){if(state.ch===0)openOptical();if(state.ch===1)openText();if(state.ch===2)openReorder();if(state.ch===3)openParadox();if(state.ch===4)openMeta();}
function card(html){$('#cardLayer').innerHTML=`<section class="puzzle">${html}</section>`}
function closeCard(){ $('#cardLayer').innerHTML=''; }
function openOptical(){card(`<h2>빛 옮기기</h2><p>전등은 고장났다. 반사체를 눌러 각도를 45°씩 바꾸고, 빛을 흔적으로 보내라.</p><div class="log">현재: 거울 ${state.angles.mirror}° → 유리컵 ${state.angles.cup}° → 액자 ${state.angles.frame}°</div><p><button class="primary" onclick="checkOptical()">흔적 확인</button> <button onclick="closeCard()">닫기</button></p></section>`)}
function checkOptical(){if(lightSolved()){state.warmth=Math.max(state.warmth,1);save();closeCard();setHint('첫 흔적이 빛 아래 드러났다. “조금의 빛으로도 보인다.” 흔적을 주웠다.');toast('작은 생활음이 돌아온다');award('light','한 줄기 빛');completeChapter()}else{toast('빛이 아직 비껴간다');setHint('억지로 밝히는 스위치가 아니라, 이미 들어온 한 줄기를 다루는 문제다.')}}
const trueMemo=['죽은 문 앞에 둘게.','먹지 않아도 괜찮아.','그냥 옆에 있을게.','불 켜기 싫으면 안 켜도 돼.'];
const memoLines=['네가 이러니 모두 힘들어해.','죽은 문 앞에 둘게.','먹지 않아도 괜찮아.','왜 아직도 그대로니.','그냥 옆에 있을게.','빨리 괜찮아져야지.','불 켜기 싫으면 안 켜도 돼.','이 정도도 못 하면 안 돼.'];
function openText(){state.picked=[];card(`<h2>진짜 글자 가려내기</h2><p>목소리가 엄마의 필체를 흉내냈다. 원문 4개만 고르자.</p><div class="choices">${memoLines.map((m,i)=>`<button class="choice" onclick="toggleMemo(${i},this)">${m}</button>`).join('')}</div><p><button class="primary" onclick="checkMemo()">분리하기</button> <button onclick="closeCard()">닫기</button></p>`)}
function toggleMemo(i,el){if(state.picked.includes(i)){state.picked=state.picked.filter(x=>x!==i);el.classList.remove('selected')}else{state.picked.push(i);el.classList.add('selected')}}
function checkMemo(){const chosen=state.picked.map(i=>memoLines[i]).sort();const ans=[...trueMemo].sort();if(chosen.length===4&&chosen.every((v,i)=>v===ans[i])){state.warmth=Math.max(state.warmth,2);save();closeCard();setHint('비난이 아니었다. 식은 죽 그릇을 치우는 작은 행동만 남았다.');toast('조명 색이 조금 따뜻해졌다');award('memo','진짜 문장');}else{state.picked=[];toast('텍스트가 조용히 다시 엉킨다');setHint('틀려도 비난하지 않는다. 진짜 문장은 평가보다 생활의 곁을 말한다.');openText();}}
function clearBowl(){if(state.ch!==1)return;setHint('그릇을 치웠다. 먹지 않아도 괜찮다. 방의 온도가 한 단계 올라간다.');completeChapter()}
const msgs=[['A','나 오늘 네 생각났어.'],['B','답 안 해도 돼.'],['A','예전 사진 봤거든.'],['B','그냥 점 하나만 보내도 살아있구나 할게.'],['A','부담 주려는 건 아니고.'],['B','가끔 생각난다는 말은 요구가 아니야.'],['A','네가 늦어도 나는 여기 있을게.'],['B','언제든 아주 작게 와도 돼.'],['A','그럼 나는 기다리는 쪽에 있을게.']];
const correctOrder=[0,1,4,5,2,3,6,7,8];
function openReorder(){state.order=[];card(`<h2>같은 조각, 다른 의미</h2><p>시간순으로 맞추면 “나를 떠나는 대화”처럼 읽히고 마지막 조각이 남는다. 숨은 축을 찾아 9개를 다시 놓자.</p><div class="order" id="order"></div><div class="tiles">${msgs.map((m,i)=>`<button class="tile" onclick="pickTile(${i},this)"><b>${m[0]}</b> ${m[1]}</button>`).join('')}</div><p><button class="bad" onclick="timeOrderFail()">시간순 자동 배열</button> <button class="primary" onclick="checkOrder()">재구성 확인</button> <button onclick="closeCard()">닫기</button></p>`)}
function pickTile(i,el){if(state.order.includes(i))return;state.order.push(i);el.classList.add('picked');$('#order').innerHTML=state.order.map(x=>`<span class="chip">${msgs[x][1].slice(0,9)}…</span>`).join('')}
function timeOrderFail(){toast('마지막 조각이 남는다');setHint('시간순은 force다. 이 대화의 축은 떠나감이 아니라 주고받는 연결이다.');}
function checkOrder(){if(state.order.length===9&&state.order.every((v,i)=>v===correctOrder[i])){state.warmth=Math.max(state.warmth,3);save();closeCard();setHint('“가끔 생각난다”는 요구가 아니라 연결의 신호였다. 완벽한 답장 대신 점 하나를 보냈다.');toast('창에 가느다란 빛이 생긴다');award('dot','점 하나의 답장');completeChapter()}else{toast('배열이 아직 한 축에 갇혀 있다');setHint('보낸 것과 받은 것, 부담과 허락이 번갈아 연결되는 리듬을 찾아보자.')}}
function openParadox(){card(`<h2>없앨 수 없는 것</h2><p>목소리: “네 잘못이야.” 제거 도구만 보인다. 하지만 제거는 모두 실패한다.</p><div class="voiceMeter"><i style="--voice:${state.voice}%"></i></div><div class="tools"><button class="bad" onclick="removeVoice('지우기')" id="eraseTool">지우기<br><small>길게 누르면?</small></button><button class="bad" onclick="removeVoice('끄기')">끄기</button><button class="bad" onclick="removeVoice('밀어내기')">밀어내기</button><button class="good ${state.box?'':'hidden'}" onclick="containVoice()">상자에 담아 곁에 두기</button></div><p><button onclick="closeCard()">닫기</button></p><div class="log">${state.box?'지우기 도구가 접혀 작은 상자가 되었다.':'지우기 버튼을 길게 눌러 보자.'}</div>`);const e=$('#eraseTool');e.onpointerdown=()=>{holdTimer=setTimeout(()=>{state.box=true;save();toast('도구가 상자로 접혔다');openParadox()},850)};e.onpointerup=()=>clearTimeout(holdTimer);e.onpointerleave=()=>clearTimeout(holdTimer)}
function removeVoice(name){state.voice=Math.min(96,state.voice+14);save();toast(name+' 실패 — 목소리가 더 커진다');setHint('없애려는 힘은 오히려 목소리를 키운다. 도구의 용도를 바꾸는 길이 있다.');openParadox()}
function containVoice(){state.voice=18;state.warmth=Math.max(state.warmth,4);save();closeCard();setHint('목소리를 없애지 않고 상자에 담아 곁에 두었다. 정적. 이제 사진을 버리지 말고 서랍에 넣자.');toast('방이 잠시 멈춘다');award('box','곁에 둔 상자')}
function drawerPhoto(){if(state.ch!==3)return;if(state.voice>20){setHint('아직 사진을 만지기 어렵다. 먼저 목소리를 없애려 하지 말고 담아두자.');toast('손이 멈칫한다');return}setHint('사진을 버리지 않고 서랍에 넣었다. 커튼 쪽으로 처음 한 걸음 다가간다.');completeChapter()}
function openMeta(){card(`<h2>창 앞의 가짜 단서</h2><p>방은 일부러 복잡한 단서를 흩뿌린다. 하지만 이 장에서 필요한 것은 조합도 추리도 아니다.</p><div class="fakeGrid"><button onclick="fake()">거울 재계산</button><button onclick="fake()">숨은 암호</button><button onclick="fake()">상자 조합</button><button onclick="fake()">문체 분석</button></div><p><button class="primary" onclick="openCurtain()">커튼을 잡고 연다</button> <button onclick="closeCard()">닫기</button></p>`)}
function fake(){toast('이번엔 풀 것이 없다');setHint('과잉사고가 마지막 force다. 손잡이는 1장부터 그대로 있었다.');}
function openCurtain(){award('curtain','그냥 열기');state.done[4]=true;state.ending=true;save();closeCard();burst($('#curtainBtn'),36);chime('clear');render();}
$('#mirrorBtn').onclick=()=>rotate('mirror');$('#cupBtn').onclick=()=>rotate('cup');$('#frameBtn').onclick=()=>rotate('frame');$('#switchBtn').onclick=()=>{toast('딸깍. 그러나 아무 일도 없다');setHint('스위치를 누르는 것은 force다. 방은 이미 들어온 빛을 허락하길 기다린다.');};$('#traceBtn').onclick=()=>lightSolved()?checkOptical():toast('아직 어둡다');$('#noteBtn').onclick=openText;$('#bowlBtn').onclick=clearBowl;$('#phoneBtn').onclick=openReorder;$('#voiceBtn').onclick=openParadox;$('#photoBtn').onclick=drawerPhoto;$('#curtainBtn').onclick=openCurtain;$('#actBtn').onclick=openCurrent;$('#waitBtn').onclick=()=>advanceHint(true);$('#reset').onclick=()=>{localStorage.removeItem(STORAGE);state={...initial,started:Date.now()};closeCard();render();chapterHint();toast('처음부터 시작')};$('#again').onclick=$('#reset').onclick;timer=setInterval(()=>advanceHint(false),5000);render();chapterHint();
</script>
</body>
</html>
