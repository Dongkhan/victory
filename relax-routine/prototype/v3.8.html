   border,\n    labelK\n  }) => React.createElement(\"div\", {\n    key: labelK,\n    style: {\n      display: 'flex',\n      alignItems: 'center',\n      gap: '6px'\n    }\n  }, React.createElement(\"div\", {\n    style: {\n      width: '14px',\n      height: '14px',\n      background: bg,\n      border,\n      borderRadius: D.r\n    }\n  }), React.createElement(\"span\", {\n    style: {\n      ...S.caption,\n      fontSize: '12px'\n    }\n  }, t(labelK))))))));\n}\nconst ARTICLES = [{\n  id: 'breathing-anxiety',\n  cat: 'relax',\n  tag: {\n    ko: '이완 기법',\n    en: 'Relaxation'\n  },\n  title: {\n    ko: '복식호흡이 불안 관리에 도움 되는 이유',\n    en: 'Why diaphragmatic breathing eases anxiety'\n  },\n  sub: {\n    ko: '횡격막 호흡과 미주신경 · 3분',\n    en: 'Diaphragm and the vagus nerve · 3 min'\n  },\n  readMin: 3,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['횡격막 호흡 → 미주신경 활성화 → 부교감신경 우세', \"불안 감소 Cohen's d=1.44 (JAD 2026 6주 RCT)\", '권장: 하루 5분, 4-7-8 또는 4-6 비율로'],\n    en: ['Diaphragmatic breathing → vagus-nerve activation → parasympathetic dominance', \"Anxiety reduction Cohen's d=1.44 (JAD 2026, 6-week RCT)\", 'Recommended: 5 min/day, with 4-7-8 or 4-6 ratios']\n  },\n  sections: {\n    ko: [{\n      h: '왜 호흡이 감정과 연결되는가',\n      body: '호흡은 자율신경계의 유일한 수의적(隨意的) 진입점입니다. 느린 날숨은 미주신경을 자극하여 부교감신경을 활성화시키고, 심박을 늦추며 혈압을 낮춥니다. Criswell(1995)은 이 과정을 \"수동적 의지(passive volition)\"의 작동 예시로 설명합니다. 강제로 이완하려 애쓰지 않고 호흡의 리듬을 허용하는 것만으로 자율신경 균형이 회복됩니다.'\n    }, {\n      h: '4-7-8 기법의 과학적 근거',\n      body: '들숨 4초, 정지 7초, 날숨 8초의 비율은 날숨을 들숨의 2배로 만들어 부교감 우세 상태를 유도합니다. 날숨이 길어질수록 심박이 느려지고(호흡성 부정맥), HRV가 증가합니다. 공황·급성 불안 시 즉각적 진정에 도움이 보고되고 있습니다.'\n    }, {\n      h: '언제 쓰면 좋은가',\n      body: '수면 전, 긴장된 회의 직전, 공황감이 시작될 때가 대표적입니다. 1회 3~4 사이클(2~3분)만으로도 즉각적 도움이 있으며, 하루 1~2회 규칙적으로 시행하면 기저 자율신경 균형이 변화합니다.'\n    }, {\n      h: '주의사항',\n      body: '호흡을 과도하게 깊이 하면 과호흡(hyperventilation)이 유발되어 오히려 어지럼·저림을 경험할 수 있습니다. 편안한 범위에서 천천히 시행하세요. 천식·심혈관 질환이 있다면 의사와 상의 후 시행하는 것이 안전합니다.'\n    }],\n    en: [{\n      h: 'Why breathing is tied to emotion',\n      body: 'Breathing is the only voluntary entry point into the autonomic nervous system. Slow exhalation stimulates the vagus nerve, shifting toward parasympathetic dominance, slowing the heart, and lowering blood pressure. Criswell (1995) describes this as a working example of \"passive volition\" — autonomic balance returns simply by allowing the rhythm of breath, not by forcing relaxation.'\n    }, {\n      h: 'The science behind 4-7-8',\n      body: 'A 4-second inhale, 7-second hold, and 8-second exhale makes exhalation roughly twice as long as inhalation, inducing a parasympathetic-dominant state. As exhalation lengthens, the heart slows (respiratory sinus arrhythmia) and HRV rises. Immediate calming effects have been reported during panic and acute anxiety.'\n    }, {\n      h: 'When to use it',\n      body: 'Before sleep, just before a tense meeting, or at the first signs of panic. Three to four cycles (2–3 minutes) often produces an immediate effect, and 1–2 daily rounds tends to improve baseline autonomic balance.'\n    }, {\n      h: 'Caveats',\n      body: 'Breathing too deeply can trigger hyperventilation and cause dizziness or tingling. Keep it gentle. Anyone with asthma or cardiovascular disease should consult a doctor before practicing.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Criswell E. Biofeedback and Somatics: Toward Personal Evolution. Freeperson Press, 1995'\n  }, {\n    type: 'book',\n    ref: 'Green E, Green A. Beyond Biofeedback. Delacorte Press, 1977'\n  }, {\n    type: 'journal',\n    ref: \"Journal of Affective Disorders 2026 · Conscious Connected Breathwork RCT (Cohen's d=1.44)\"\n  }]\n}, {\n  id: 'pmr-history',\n  cat: 'relax',\n  tag: {\n    ko: 'PMR',\n    en: 'PMR'\n  },\n  title: {\n    ko: '점진적 근이완(PMR)의 역사와 근거',\n    en: 'Progressive muscle relaxation (PMR): history and evidence'\n  },\n  sub: {\n    ko: 'Jacobson 1938부터 현대 메타분석까지 · 4분',\n    en: 'From Jacobson 1938 to modern meta-analyses · 4 min'\n  },\n  readMin: 4,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['Edmund Jacobson(1938)이 체계화한 근육군 순차적 긴장-이완 기법', '근육 긴장을 먼저 의식화해야 이완을 체감할 수 있다는 원리', '메타분석 Level 1 근거: 불안 SMD -1.11, 수면 SMD -1.74'],\n    en: ['Sequential tense-and-release across muscle groups, formalized by Edmund Jacobson (1938)', 'You feel relaxation only after first making the tension conscious', 'Meta-analysis Level 1 evidence: anxiety SMD −1.11, sleep SMD −1.74']\n  },\n  sections: {\n    ko: [{\n      h: 'Jacobson의 핵심 발견',\n      body: '미국 생리학자 Edmund Jacobson은 1920년대 연구에서, 사람은 자신의 근육이 긴장되어 있다는 사실을 의식하지 못한 채 불안을 경험한다는 것을 발견했습니다. 그는 근육을 먼저 의도적으로 긴장시키고 난 뒤 풀어주면, 긴장-이완의 대비가 분명해져서 이완을 훨씬 깊이 학습할 수 있다고 보았습니다. 1938년 『Progressive Relaxation』에서 이 원리를 집대성했습니다.'\n    }, {\n      h: '왜 긴장부터 만드는가',\n      body: '만성적으로 긴장한 사람은 \"이완한 상태\"의 감각 자체를 잃어버립니다. 긴장을 의도적으로 과장하면 대조적으로 이완이 훨씬 선명하게 자각됩니다. 이 대비 학습이 반복되면 일상에서도 긴장 상태를 빠르게 감지하고 풀어주는 능력이 길러집니다. 이는 Criswell이 말한 \"소마틱 인식(somatic awareness)\"의 기초입니다.'\n    }, {\n      h: '현대 임상 근거',\n      body: \"수많은 RCT와 메타분석에서 PMR은 불안 장애·수면 장애·긴장성 두통·고혈압 보조 치료로 Level 1 근거를 확보했습니다. 효과 크기(Cohen's d 또는 SMD)는 불안에서 -1.11, 수면에서 -1.74로 임상적으로 유의미한 수준입니다. 전문가 치료와 병행해 보조적으로 활용할 수 있습니다.\"\n    }, {\n      h: '실천 팁',\n      body: '조용하고 방해받지 않는 공간에서 10~15분, 주 3회 이상 시행이 권장됩니다. 근육을 긴장할 때 통증이 생길 정도로 무리하지 말고, 5초 정도 편안하게 긴장을 유지한 뒤 10~20초 이완하세요. 통증이 있는 부위는 건너뛰어도 됩니다.'\n    }],\n    en: [{\n      h: \"Jacobson's core insight\",\n      body: 'In the 1920s, the American physiologist Edmund Jacobson discovered that people often experience anxiety without realizing their muscles are tense. He argued that intentionally tensing a muscle first, then releasing it, sharpens the contrast and makes relaxation far easier to learn. He systematized this in his 1938 book Progressive Relaxation.'\n    }, {\n      h: 'Why tense first?',\n      body: \"Chronically tense people lose the very sense of what 'relaxed' feels like. Deliberately exaggerating tension makes the subsequent release vividly perceptible. Repeated practice trains the ability to detect and release tension in everyday life — the basis of what Criswell called somatic awareness.\"\n    }, {\n      h: 'Modern clinical evidence',\n      body: \"Across many RCTs and meta-analyses, PMR has Level 1 evidence as adjunctive treatment for anxiety disorders, sleep disorders, tension headache, and hypertension. Effect sizes (Cohen's d or SMD) reach −1.11 for anxiety and −1.74 for sleep — clinically meaningful magnitudes. Side effects are minimal, so PMR can complement or sometimes replace pharmacotherapy.\"\n    }, {\n      h: 'Practical tips',\n      body: 'Practice 10–15 minutes in a quiet, undisturbed space, at least 3 times per week. Avoid tensing to the point of pain — hold tension comfortably for ~5 s, then release for 10–20 s. You can skip painful regions.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Criswell E. Biofeedback and Somatics: Toward Personal Evolution. Freeperson Press, 1995'\n  }, {\n    type: 'book',\n    ref: \"Sadock BJ, Sadock VA, Ruiz P. Kaplan & Sadock's Comprehensive Textbook of Psychiatry, 10th ed. Wolters Kluwer, 2017 (Ch24 CAM Psychiatry)\"\n  }, {\n    type: 'journal',\n    ref: 'Jacobson E. Progressive Relaxation. University of Chicago Press, 1938'\n  }]\n}, {\n  id: 'bodyscan-embodiment',\n  cat: 'relax',\n  tag: {\n    ko: '바디스캔',\n    en: 'Body Scan'\n  },\n  title: {\n    ko: '바디스캔: 감정 대신 몸으로 돌아가기',\n    en: 'Body scan: returning to the body instead of the emotion'\n  },\n  sub: {\n    ko: 'MBCT 8주 프로그램의 2주차 핵심 · 3분',\n    en: 'Core practice of MBCT week 2 · 3 min'\n  },\n  readMin: 3,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['MBCT(Teasdale·Williams·Segal, 2014)의 Week 2 핵심 수련', '\"생각으로 아는 것\"과 \"알아차림으로 아는 것\"을 구분하는 훈련', '감정 어휘를 쓰지 않고도 자기조절 가능한 경로'],\n    en: [\"MBCT's (Teasdale, Williams, Segal, 2014) week-2 core practice\", 'Trains the distinction between \"knowing by thought\" and \"knowing by awareness\"', 'A self-regulation route that does not require emotion vocabulary']\n  },\n  sections: {\n    ko: [{\n      h: '하기(Doing) 모드에서 있기(Being) 모드로',\n      body: 'Teasdale 등은 우울·불안에 취약한 사람이 대부분의 시간을 \"하기 모드\"로 살아간다고 지적합니다. 이 모드는 목표 달성에는 유용하지만, 감정 경험에 적용되면 \"왜 이렇게 느끼는가\"를 반복적으로 분석하는 반추(rumination)로 이어집니다. 바디스캔은 이 모드를 잠시 멈추고, 몸에서 실제로 일어나고 있는 감각으로 돌아오는 연습입니다.'\n    }, {\n      h: '부위별 순차 관찰의 원리',\n      body: '머리에서 발끝까지 9개 부위를 순서대로 관찰하는 동안, 사용자는 \"무엇을 느껴야 하는가\"가 아니라 \"지금 이 부위에 무엇이 있는가\"를 묻게 됩니다. 긴장·따뜻함·저림·무감각 — 어떤 것이든 판단하지 않고 그대로 관찰합니다. 반복되면 감각과 감정 사이의 연결 고리가 조금씩 복원됩니다.'\n    }, {\n      h: '알렉시티미아에 특히 유용한 이유',\n      body: '감정 어휘가 부족한 사람에게 \"지금 슬픈가요? 불안한가요?\"라는 질문은 답하기 어렵습니다. 그러나 \"어깨가 무거운가요?\", \"가슴이 답답한가요?\"라는 신체 중심 질문은 응답 가능합니다. Luminet 등(2018)은 바디스캔·마음챙김을 알렉시티미아 관리에 유용한 대표적 기법으로 기술합니다.'\n    }],\n    en: [{\n      h: 'From \"doing\" mode to \"being\" mode',\n      body: 'Teasdale and colleagues note that people prone to depression or anxiety spend most of their time in \"doing\" mode. While this mode is useful for goals, applied to emotion it becomes the rumination of \"why do I feel this way?\" Body scan briefly suspends that mode and returns to sensations as they actually are.'\n    }, {\n      h: 'How sequential region-by-region observation works',\n      body: 'As you move through nine regions from head to toe, you stop asking \"what should I feel?\" and start asking \"what is here right now?\" Tension, warmth, tingling, numbness — observe without judging. With repetition, the link between sensation and emotion gradually recovers.'\n    }, {\n      h: 'Why it especially helps with alexithymia',\n      body: 'For people with limited emotion vocabulary, \"Are you sad? Anxious?\" is hard to answer. But \"Are your shoulders heavy? Is your chest tight?\" can be answered. Luminet et al. (2018) describes body scan and mindfulness as core techniques for alexithymia.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Teasdale J, Williams M, Segal Z. The Mindful Way Workbook: An 8-Week Program to Free Yourself from Depression and Emotional Distress. Guilford Press, 2014'\n  }, {\n    type: 'book',\n    ref: 'Luminet O, Bagby RM, Taylor GJ (eds). Alexithymia: Advances in Research, Theory, and Clinical Practice. Cambridge University Press, 2018'\n  }, {\n    type: 'journal',\n    ref: 'Segal ZV, Williams JMG, Teasdale JD. Mindfulness-Based Cognitive Therapy for Depression, 2nd ed. Guilford Press, 2013'\n  }]\n}, {\n  id: 'autogenic-training',\n  cat: 'relax',\n  tag: {\n    ko: '자율훈련',\n    en: 'Autogenic'\n  },\n  title: {\n    ko: '자율훈련법: 수동적 의지의 과학',\n    en: 'Autogenic training: the science of passive volition'\n  },\n  sub: {\n    ko: 'Schultz 1932부터 바이오피드백 통합까지 · 3분',\n    en: 'From Schultz 1932 to biofeedback integration · 3 min'\n  },\n  readMin: 3,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['독일 신경과 의사 Johannes Schultz가 1932년에 체계화한 자기암시 기법', '6단계 공식(무거움·따뜻함·심장·호흡·복부·이마)을 반복', 'Menninger의 Green 부부가 바이오피드백과 결합 (Autogenic Feedback Training)'],\n    en: ['A self-suggestion method formalized by the German neurologist Johannes Schultz in 1932', 'Repeats six standard formulas (heaviness, warmth, heart, breath, solar plexus, forehead)', 'Combined with biofeedback by the Greens at Menninger (Autogenic Feedback Training)']\n  },\n  sections: {\n    ko: [{\n      h: '자율훈련법이란 무엇인가',\n      body: '자율훈련법(Autogenic Training)은 Johannes Schultz가 최면 유도 연구에서 도출한 자기암시 기반 이완법입니다. 최면과 달리 외부 가이드 없이 혼자 수행할 수 있으며, 각 단계마다 정해진 문구(예: \"팔과 다리가 무겁다\")를 편안한 자세에서 속으로 반복합니다. 수 주~수 개월 반복하면 자율신경 반응이 자동화됩니다.'\n    }, {\n      h: '수동적 의지(Passive Volition)의 역할',\n      body: 'Green 부부(1977)는 이 기법의 핵심이 \"수동적 의지\"라고 설명합니다. 원하는 상태를 \"강제로 만들려\"하지 않고, 이미지와 문구를 통해 \"일어나도록 허용\"하는 태도입니다. \"팔이 무거워져라\"가 아니라 \"팔이 무겁다고 느낀다\"의 방식. 능동적 노력은 교감신경을 자극하여 오히려 이완을 방해합니다.'\n    }, {\n      h: '임상 적용',\n      body: '편두통, 레이노 현상, 고혈압, 수면 장애, 불안 장애에서 결과가 보고되었고, 특히 혈관·말초 온도 조절에 강점이 있습니다. Green 부부는 이를 피부온도 바이오피드백과 결합하여 \"Autogenic Feedback Training\"을 개발했습니다. 현재는 단독 사용도 가능하고, 호흡·PMR과 결합하여 종합 이완 프로그램으로 활용됩니다.'\n    }],\n    en: [{\n      h: 'What is autogenic training?',\n      body: 'Autogenic training is a self-suggestion-based relaxation method derived by Johannes Schultz from his hypnosis research. Unlike hypnosis it is self-administered. At each stage, you silently repeat a fixed phrase (e.g., \"My arms and legs feel heavy\") in a comfortable posture. With weeks to months of practice, autonomic responses become automatic.'\n    }, {\n      h: 'The role of passive volition',\n      body: 'The Greens (1977) describe the core mechanism as \"passive volition\" — not forcing the desired state, but allowing it to arise through imagery and phrasing. Not \"my arm shall be heavy\" but \"I notice that my arm is heavy.\" Active effort engages the sympathetic system and actually blocks relaxation.'\n    }, {\n      h: 'Clinical applications',\n      body: 'Reported benefits include migraine, Raynaud phenomenon, hypertension, sleep disorders, and anxiety — with particular strength in vascular and peripheral temperature regulation. The Greens combined it with skin-temperature biofeedback to create Autogenic Feedback Training. It is used alone and in combination with breath and PMR as a complete relaxation program.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Green E, Green A. Beyond Biofeedback. Delacorte Press, 1977 (Ch3 Autogenic Feedback Training)'\n  }, {\n    type: 'book',\n    ref: 'Criswell E. Biofeedback and Somatics: Toward Personal Evolution. Freeperson Press, 1995'\n  }, {\n    type: 'journal',\n    ref: 'Schultz JH. Das autogene Training: konzentrative Selbstentspannung. Georg Thieme Verlag, Leipzig, 1932'\n  }]\n}, {\n  id: 'alexithymia-intro',\n  cat: 'alex',\n  tag: {\n    ko: '알렉시티미아',\n    en: 'Alexithymia'\n  },\n  title: {\n    ko: '감정을 느끼기 어려운 이유: 알렉시티미아',\n    en: 'When emotions are hard to feel: alexithymia'\n  },\n  sub: {\n    ko: '\"감정에 대한 말이 없는\" 상태 · 4분',\n    en: '\"No words for feeling\" · 4 min'\n  },\n  readMin: 4,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['그리스어 어원: a(없음) + lexis(말) + thymos(감정)', '일반 인구의 10~13%, 우울·불안·신체화 장애에서 더 흔함', '결핍이면서 발달적 — 애착·외상에 의해 형성되는 특질'],\n    en: ['Greek roots: a (no) + lexis (word) + thymos (emotion)', '10–13% of the general population; more common in depression, anxiety, and somatization', 'A deficit that is also developmental — shaped by attachment and trauma']\n  },\n  sections: {\n    ko: [{\n      h: '무엇이 문제인가',\n      body: 'Sifneos(1972)는 신체 증상을 반복하는 환자들에게서 세 가지 공통점을 관찰했습니다: 감정을 식별하기 어려움(DIF), 감정을 말로 표현하기 어려움(DDF), 상상 대신 외부 사실에 집중하는 사고(EOT). 이를 \"알렉시티미아\"로 명명했습니다. 환자는 슬픔·불안·분노 대신 피로·두통·가슴 답답함 같은 신체 증상으로 정서적 고통을 표현합니다.'\n    }, {\n      h: '평가와 측정',\n      body: '표준 도구는 Toronto Alexithymia Scale-20(TAS-20)입니다. 20개 문항, 세 하위척도(DIF·DDF·EOT)로 구성됩니다. 절단점은 61점 이상이 알렉시티미아, 52~60이 경계. 신뢰도는 α = 0.81 수준으로 안정적입니다. Relax Routine은 이를 참고하여 단축판 PAQ-S 6문항으로 초기 분기를 실시합니다.'\n    }, {\n      h: '왜 감정이 어려운가',\n      body: '뇌영상 연구에서는 편도체와 전측 대상피질(ACC)의 연결 감소, 섬엽(insula) 활성 이상이 관찰됩니다. 섬엽은 내수용 감각(interoception) — 심박·호흡·내장 감각 — 의 처리를 담당합니다. 이 신호가 감정 인식의 1차 재료이므로, 섬엽 이상은 감정 식별 능력 저하로 이어집니다. 애착 불안정·어린 시절 외상도 중요한 형성 요인입니다.'\n    }, {\n      h: '관리의 방향',\n      body: '전통적 대화치료는 감정을 언어화하는 능력을 전제로 하므로 알렉시티미아 환자에서 효과가 제한적입니다. Luminet 등(2018)은 치료 조정 원칙으로 ① 감정 교육(labeling) 포함, ② 신체 감각에서 감정으로 올라가는 방향의 훈련, ③ 마음챙김·바디스캔 병용, ④ 긴 치료 기간을 제안합니다. Relax Routine의 Track B 경로는 이 원칙을 반영합니다.'\n    }],\n    en: [{\n      h: 'What is the problem?',\n      body: \"Sifneos (1972) observed three commonalities in patients with recurrent physical symptoms: difficulty identifying feelings (DIF), difficulty describing feelings (DDF), and externally oriented thinking (EOT) — focusing on facts rather than imagination. He called this 'alexithymia.' Such patients express emotional pain through somatic symptoms — fatigue, headache, chest tightness — rather than as sadness, anxiety, or anger.\"\n    }, {\n      h: 'Assessment',\n      body: 'The standard instrument is the Toronto Alexithymia Scale-20 (TAS-20): 20 items, three subscales (DIF, DDF, EOT). Cut-offs: ≥ 61 = alexithymia, 52–60 = borderline. Internal consistency α ≈ 0.81. Relax Routine uses the shorter PAQ-S (6 items) to triage at onboarding.'\n    }, {\n      h: 'Why emotion is hard',\n      body: 'Neuroimaging shows reduced connectivity between the amygdala and the anterior cingulate cortex (ACC), and atypical insula activity. The insula integrates interoceptive signals — heartbeat, breath, gut — that form the raw material of emotion. When the insula is atypical, identifying emotion suffers. Insecure attachment and childhood trauma are also formative factors.'\n    }, {\n      h: 'Therapeutic direction',\n      body: 'Traditional talk therapy assumes emotion-language ability and is therefore limited in alexithymia. Luminet et al. (2018) propose adapting therapy by (1) including emotion education (labeling), (2) training upward from bodily sensation to emotion, (3) combining with mindfulness and body scan, (4) extending treatment duration. The Relax Routine Track B route follows these principles.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Luminet O, Bagby RM, Taylor GJ (eds). Alexithymia: Advances in Research, Theory, and Clinical Practice. Cambridge University Press, 2018'\n  }, {\n    type: 'journal',\n    ref: 'Sifneos PE. The prevalence of \"alexithymic\" characteristics in psychosomatic patients. Psychother Psychosom 1973;22:255-262'\n  }, {\n    type: 'journal',\n    ref: 'Bagby RM, Parker JDA, Taylor GJ. The twenty-item Toronto Alexithymia Scale-I. Item selection and cross-validation of the factor structure. J Psychosom Res 1994;38:23-32'\n  }]\n}, {\n  id: 'interoception',\n  cat: 'alex',\n  tag: {\n    ko: '내수용 감각',\n    en: 'Interoception'\n  },\n  title: {\n    ko: '몸의 신호 읽기: 내수용 감각과 감정',\n    en: 'Reading body signals: interoception and emotion'\n  },\n  sub: {\n    ko: '감정의 1차 재료는 신체 감각 · 3분',\n    en: 'Body sensation as the raw material of emotion · 3 min'\n  },\n  readMin: 3,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['내수용 감각(interoception) = 심박·호흡·내장 등 신체 내부 상태에 대한 자각', '섬엽(insula)이 중추 — 이 신호가 감정의 1차 재료', '알렉시티미아는 내수용 감각 감소와 동반'],\n    en: ['Interoception = awareness of internal body states (heart, breath, gut)', 'The insula is its hub — these signals are the raw material of emotion', 'Alexithymia tends to co-occur with reduced interoception']\n  },\n  sections: {\n    ko: [{\n      h: '몸에서 감정으로 올라가는 경로',\n      body: '현대 정서 연구에 따르면, 우리가 \"두려움\"을 느끼는 것은 먼저 심장이 뛰고 근육이 긴장한 상태를 뇌가 해석하기 때문입니다. 내수용 감각 — 심박·호흡·내장·피부의 감각 — 은 이 해석의 원재료입니다. 이 신호가 약하거나 잘못 해석되면 감정 경험 자체가 흐려집니다.'\n    }, {\n      h: '섬엽의 역할',\n      body: '섬엽(insular cortex)은 내수용 신호를 통합하여 \"내가 지금 어떤 상태인가\"에 대한 추상적 표상을 만듭니다. Friston의 활성 추론(active inference) 이론은 뇌가 이 내수용 예측 오차를 최소화하는 방향으로 행동·감정을 생성한다고 설명합니다. 즉, 정확한 내수용 감각이 정확한 감정 인식의 전제입니다.'\n    }, {\n      h: '훈련으로 변화할 수 있는가',\n      body: '예. 바디스캔·심박 감지 훈련·호흡 감지 훈련이 내수용 감각을 향상시킨다는 근거가 축적되고 있습니다. Relax Routine의 Track B 프로그램은 감정 단어를 쓰기 전에 2주간 신체 감각 인식만 훈련하는 단계를 별도로 마련했습니다. \"어깨에 무엇이 있는가?\", \"가슴이 어떤가?\"의 질문은 알렉시티미아 환자가 응답 가능한 출발점입니다.'\n    }],\n    en: [{\n      h: 'From body up to emotion',\n      body: 'Modern affective science holds that we feel \"fear\" because the brain interprets a state of racing heart and tense muscles. Interoception — sensations of heart, breath, gut, and skin — is the raw material of that interpretation. When the signal is weak or misread, the emotional experience itself blurs.'\n    }, {\n      h: 'The role of the insula',\n      body: 'The insular cortex integrates interoceptive signals into an abstract representation of \"how I am right now.\" Friston\\'s active-inference theory describes the brain as generating behavior and emotion in the direction that minimizes interoceptive prediction error. Accurate interoception, then, is a precondition for accurate emotion recognition.'\n    }, {\n      h: 'Can it be trained?',\n      body: 'Yes. Evidence is accumulating that body-scan, heartbeat-detection, and breath-detection training improve interoception. The Relax Routine Track B program reserves the first two weeks for body-sensation training before any emotion vocabulary is introduced. Questions like \"What is in your shoulder?\" or \"How is your chest?\" are an answerable starting point for people with alexithymia.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Luminet O, Bagby RM, Taylor GJ (eds). Alexithymia: Advances in Research, Theory, and Clinical Practice. Cambridge University Press, 2018 (Ch13-16 Neurobiology)'\n  }, {\n    type: 'journal',\n    ref: 'Friston K. The free-energy principle: a unified brain theory? Nat Rev Neurosci 2010;11:127-138'\n  }, {\n    type: 'journal',\n    ref: 'Seth AK, Friston KJ. Active interoceptive inference and the emotional brain. Phil Trans R Soc B 2016;371:20160007'\n  }, {\n    type: 'book',\n    ref: 'Teasdale J, Williams M, Segal Z. The Mindful Way Workbook. Guilford Press, 2014'\n  }]\n}, {\n  id: 'hrv-basics',\n  cat: 'hrv',\n  tag: {\n    ko: 'HRV',\n    en: 'HRV'\n  },\n  title: {\n    ko: 'HRV란 무엇인가',\n    en: 'What is HRV?'\n  },\n  sub: {\n    ko: '심박변이도와 자율신경계 · 3분',\n    en: 'Heart-rate variability and the autonomic nervous system · 3 min'\n  },\n  readMin: 3,\n  updated: '2026-04-24',\n  tldr: {\n    ko: ['HRV(Heart Rate Variability) = 심박 사이 간격의 미세한 변동성', '높은 HRV는 자율신경의 유연성(교감-부교감 균형)을 의미', '호흡·PMR·자율훈련법 모두 HRV 향상과 연관'],\n    en: ['HRV (heart rate variability) = subtle variation between heartbeats', 'Higher HRV reflects autonomic flexibility (sympathetic–parasympathetic balance)', 'Breathing, PMR, and autogenic training are all associated with improved HRV']\n  },\n  sections: {\n    ko: [{\n      h: 'HRV는 \"흔들림\"이 좋다는 지표',\n      body: '일반적 직관과 달리, 심박이 완벽하게 규칙적인 것은 건강의 신호가 아닙니다. 건강한 심장은 호흡·감정·자세에 따라 끊임없이 박동 간격을 미세 조정합니다. HRV(Heart Rate Variability)는 이 변동성의 크기이며, 높을수록 자율신경계가 상황에 유연하게 반응하고 있다는 것을 의미합니다.'\n    }, {\n      h: '어떻게 측정하는가',\n      body: 'ECG(심전도)에서 R파 간격(RR interval)을 측정하여 SDNN, RMSSD 등의 지표로 계산합니다. 최근에는 스마트워치의 광학 심박 센서(PPG)로도 근사 측정이 가능해졌지만, 임상 진단용 정밀 측정과는 차이가 있습니다. Relax Routine은 현재 버전에서 HRV 실시간 측정을 제공하지 않으며, 교육 목적의 설명만 다룹니다.'\n    }, {\n      h: '이완 기법과 HRV',\n      body: 'Criswell(1995)과 Green 부부(1977)의 바이오피드백 문헌은 호흡·PMR·자율훈련법 모두 HRV 향상과 연관됨을 보고합니다. 특히 분당 6회(들숨 5초·날숨 5초) 수준의 \"공명 주파수 호흡\"은 HRV를 즉각적으로 증가시킵니다. 장기 연습은 기저 HRV도 끌어올릴 수 있습니다.'\n    }],\n    en: [{\n      h: 'HRV — variability is the goal',\n      body: \"Contrary to intuition, a perfectly regular heartbeat is not a sign of health. A healthy heart constantly adjusts the interval between beats in response to breath, emotion, and posture. HRV measures that variability — the higher it is, the more flexibly the autonomic system is responding.\"\n    }, {\n      h: 'How is HRV measured?',\n      body: 'On ECG, the R-R interval is measured and metrics like SDNN and RMSSD are derived. Smartwatch optical PPG sensors now give reasonable estimates, though they differ from clinical-grade measurement. Relax Routine does not yet provide live HRV measurement — this article is educational only.'\n    }, {\n      h: 'Relaxation techniques and HRV',\n      body: 'Criswell (1995) and the Greens (1977) both report that breathing, PMR, and autogenic training are associated with improved HRV. \"Resonance-frequency breathing\" at about 6 breaths/min (5 s in / 5 s out) raises HRV immediately. Long-term practice can also raise baseline HRV.'\n    }]\n  },\n  sources: [{\n    type: 'book',\n    ref: 'Criswell E. Biofeedback and Somatics: Toward Personal Evolution. Freeperson Press, 1995'\n  }, {\n    type: 'book',\n    ref: 'Green E, Green A. Beyond Biofeedback. Delacorte Press, 1977'\n  }, {\n    type: 'journal',\n    ref: 'Lehrer PM, Vaschillo E, Vaschillo B. Resonant frequency biofeedback training to increase cardiac variability: rationale and manual for training. Appl Psychophysiol Biofeedback 2000;25:177-191'\n  }, {\n    type: 'journal',\n    ref: 'Shaffer F, Ginsberg JP. An Overview of Heart Rate Variability Metrics and Norms. Front Public Health 2017;5:258'\n  }]\n}, {\n  id: 'phq-gad',\n  cat: 'progress',\n  tag: {\n    ko: '평가 척도',\n    en: 'Scales'\n  },\n  title: {\n    ko: 'PHQ-9 / GAD-7 / PSS-10 이해하기',\n    en: 'Understanding PHQ-9 / GAD-7 / PSS-10'\n  },\n  sub: {\n    ko: '세 가지 자가 측정의 의미와 한계 · 4분',\n    en: 'Three self-report measures: meaning and limits · 4 min'\n  },\n  readMin: 4,\n  updated: '2026-04-27',\n  tldr: {\n    ko: ['PHQ-9: 우울(9문항) · GAD-7: 불안(7문항) · PSS-10: 지각된 스트레스(10문항)', '임상 평가가 아닌 체크인 점수 — 변화의 방향을 보는 도구', 'PHQ-9 문항 9(자살사고)는 반드시 주의 깊게 모니터링'],\n    en: ['PHQ-9: depression (9 items) · GAD-7: anxiety (7 items) · PSS-10: perceived stress (10 items)', 'Check-in scores, not clinical diagnoses — tools for direction of change', 'PHQ-9 item 9 (suicidal ideation) must always be monitored carefully']\n  },\n  sections: {\n    ko: [{\n      h: '왜 매주 측정하는가',\n      body: 'PHQ-9(Kroenke et al., 2001)와 GAD-7(Spitzer et al., 2006)은 1차 진료·정신건강 영역에서 가장 널리 쓰이는 자가 보고 척도입니다. 주 1회 반복 측정하면 치료 반응을 객관화할 수 있고, 악화 시 조기 개입 기회를 확보할 수 있습니다. Relax Routine은 8주 프로그램 동안 주간 PHQ-9/GAD-7 측정과 함께 월 1회 PSS-10 측정을 권장합니다.'\n    }, {\n      h: '세 척도가 보는 다른 영역',\n      body: 'PHQ-9는 우울 증상, GAD-7은 일반화 불안 증상을 봅니다. PSS-10(Perceived Stress Scale, Cohen & Williamson 1988)은 \"지난 한 달 동안 자신의 삶을 얼마나 통제 불가능·예측 불가능·과부하로 느꼈는가\"를 측정합니다. 즉 증상이 아닌 스트레스 지각 수준에 초점이 있고, 임상 진단이 없는 일반 인구·직장인·번아웃 군에서도 폭넓게 쓰입니다. 한국어판은 이정은(2012)이 검증했습니다.'\n    }, {\n      h: '점수 해석',\n      body: 'PHQ-9(0~27점): 0~4 최소, 5~9 경미, 10~14 중등도, 15~19 중등도-중증, 20~27 중증. GAD-7(0~21점): 0~4 최소, 5~9 경미, 10~14 중등도, 15~21 중증. PSS-10(0~40점): 0~13 낮은 스트레스, 14~26 중등도, 27 이상 높은 스트레스 (Cohen 표준 절단점). 이 구간은 참고용이며 임상 평가는 전문의 면담이 필요합니다. 중요한 것은 절대 점수보다 \"시간에 따른 변화의 방향\"입니다.'\n    }, {\n      h: '자살사고 문항의 의미',\n      body: 'PHQ-9 문항 9 — \"자신이 죽는 것이 더 낫다고 생각하거나 어떤 식으로든 자신을 해치려 한다고 생각함\" — 에 1점 이상이 체크되면 즉각적 주의가 필요합니다. 빈도가 낮더라도 위험 평가가 필요합니다. Relax Routine은 이 응답이 감지되면 자동으로 위기 대응 화면을 호출하여 DH Mind Clinic 연락처와 자살예방상담전화 109를 안내합니다. PSS-10에는 자살사고 문항이 없으므로 PSS-10 단독으로는 위기 트리거가 발동하지 않으며, PHQ-9·GAD-7과 함께 해석합니다.'\n    }, {\n      h: '안내',\n      body: '자가 보고 척도는 대답하는 사람의 통찰·솔직함에 의존합니다. 알렉시티미아가 있으면 실제 증상이 과소 보고될 수 있습니다. 또한 주간 점수가 변화했다고 해서 관해된 것은 아니며, 기능 회복·삶의 질 등 다른 지표와 함께 해석해야 합니다.'\n    }],\n    en: [{\n      h: 'Why measure weekly?',\n      body: 'PHQ-9 (Kroenke et al., 2001) and GAD-7 (Spitzer et al., 2006) are the most widely used self-report scales in primary care and mental health. Weekly repetition makes treatment response objective and creates earlier opportunities to intervene when things worsen. Relax Routine recommends weekly PHQ-9/GAD-7 plus monthly PSS-10 over the 8-week program.'\n    }, {\n      h: 'Three scales, three different domains',\n      body: 'PHQ-9 measures depression symptoms; GAD-7 measures generalized anxiety symptoms; PSS-10 (Cohen & Williamson 1988) measures the degree to which the past month felt uncontrollable, unpredictable, and overloading. PSS-10 focuses on perceived stress rather than diagnosable symptoms and is widely used in general, working, and burnout populations even without a diagnosis. The Korean version was validated by Lee (2012).'\n    }, {\n      h: 'Score interpretation',\n      body: 'PHQ-9 (0–27): 0–4 minimal, 5–9 mild, 10–14 moderate, 15–19 moderately severe, 20–27 severe. GAD-7 (0–21): 0–4 minimal, 5–9 mild, 10–14 moderate, 15–21 severe. PSS-10 (0–40): 0–13 low, 14–26 moderate, 27+ high (Cohen standard cut-offs). These bands are reference only — diagnosis requires a clinician interview. What matters most is the direction of change over time, not the absolute score.'\n    }, {\n      h: 'About the suicidal-ideation item',\n      body: 'PHQ-9 item 9 — \"Thoughts that you would be better off dead or of hurting yourself in some way\" — at any score ≥ 1 demands immediate attention, even at low frequency. When this is detected, Relax Routine automatically opens the crisis screen and shows DH Mind Clinic contact information and the 109 suicide prevention line. PSS-10 has no suicidal-ideation item, so it never triggers crisis on its own; interpret PSS-10 alongside PHQ-9 and GAD-7.'\n    }, {\n      h: 'Limits',\n      body: 'Self-report depends on the respondent\\'s insight and candor. People with alexithymia may under-report actual symptoms. Improving weekly scores does not by itself mean remission — interpret with functional recovery, quality of life, and other indicators.'\n    }]\n  },\n  sources: [{\n    type: 'journal',\n    ref: 'Kroenke K, Spitzer RL, Williams JB. The PHQ-9: Validity of a Brief Depression Severity Measure. J Gen Intern Med 2001;16:606-613'\n  }, {\n    type: 'journal',\n    ref: 'Spitzer RL, Kroenke K, Williams JB, Löwe B. A brief measure for assessing generalized anxiety disorder: the GAD-7. Arch Intern Med 2006;166:1092-1097'\n  }, {\n    type: 'journal',\n    ref: 'Cohen S, Kamarck T, Mermelstein R. A global measure of perceived stress. J Health Soc Behav 1983;24:385-396'\n  }, {\n    type: 'journal',\n    ref: 'Cohen S, Williamson G. Perceived stress in a probability sample of the United States. In: Spacapan S, Oskamp S (eds). The Social Psychology of Health. Sage, 1988:31-67 (PSS-10 derivation)'\n  }, {\n    type: 'journal',\n    ref: 'Lee EH. Review of the psychometric evidence of the Perceived Stress Scale. Asian Nurs Res 2012;6(4):121-127 (한국어판 검증)'\n  }, {\n    type: 'book',\n    ref: 'Luminet O, Bagby RM, Taylor GJ (eds). Alexithymia: Advances in Research, Theory, and Clinical Practice. Cambridge University Press, 2018 (Ch9 Depression, anxiety, and alexithymia)'\n  }]\n}, {\n  id: 'workplace-stress',\n  cat: 'progress',\n  tag: {\n    ko: '직장 스트레스',\n    en: 'Workplace stress'\n  },\n  title: {\n    ko: '직장 스트레스·번아웃과 디지털 이완',\n    en: 'Workplace stress, burnout, and digital relaxation'\n  },\n  sub: {\n    ko: '아직 진단되지 않은 스트레스군에 대한 근거 · 3분',\n    en: 'Evidence for the as-yet-undiagnosed stressed population · 3 min'\n  },\n  readMin: 3,\n  updated: '2026-04-27',\n  tldr: {\n    ko: ['직장 스트레스·번아웃은 임상 진단군에 들어가기 전 단계 — 일반 PRO 척도(PSS-10)로 추적', '근거: 분산형(decentralized) RCT가 직장 스트레스 성인에서 번아웃·불안 감소·QoL 향상을 보고 (JMIR 2025)', '저강도·관리·조기 가이드 포지션 — 임상 평가·약물 조정·진료를 대체하지 않음'],\n    en: ['Workplace stress and burnout precede clinical diagnosis — track with a general PRO scale (PSS-10)', 'Evidence: a decentralized RCT in working adults found reduced burnout and anxiety with improved QoL (JMIR 2025)', 'A low-intensity, preventive, early-intervention positioning — does not replace clinical diagnosis or pharmacotherapy']\n  },\n  sections: {\n    ko: [{\n      h: '아직 진단되지 않은 사람을 위한 도구',\n      body: '우울·불안 진단 기준에는 못 미치지만 일상에서 통제 불가능감·과부하감을 자주 느끼는 직장인은 매우 흔합니다. 이 단계에서 가장 적합한 자가 측정은 PSS-10(Perceived Stress Scale, Cohen & Williamson 1988)입니다. PSS-10은 \"지난 한 달 동안 얼마나 자주 ____ 라고 느꼈는가\" 형식이라 진단이 없어도 자연스럽게 응답할 수 있고, 한국어판이 검증되어 있습니다(이정은 2012).'\n    }, {\n      h: '디지털 이완은 도움이 되는가',\n      body: '2025년 분산형 무작위대조시험(JMIR Mental Health 2025;e70722)이 직장 스트레스를 경험하는 성인을 대상으로 디지털 개입을 평가하여 번아웃·불안의 유의한 감소와 기능·건강 관련 삶의 질 향상을 보고했습니다. 분산형 RCT는 참가자가 자택에서 원격으로 등록·참여하는 설계로, 출퇴근·육아 등 시간 제약이 큰 직장인 집단을 모집하기에 적합합니다. 이는 Relax Routine의 1차 타깃 인구(아직 진단되지 않은 스트레스·번아웃군)에 대한 외부 근거 한 축입니다.'\n    }, {\n      h: '어디까지 자가 사용할 수 있는가',\n      body: 'Relax Routine은 저강도·관리·조기 가이드·자가 사용 웰니스 가이드입니다. 임상 평가·약물 조정·심리치료·진료를 대체하지 않습니다. PHQ-9가 15점 이상으로 지속되거나 PHQ-9 문항 9(자살사고)에 응답이 있다면 즉시 정신건강의학과 진료를 권장합니다. PSS-10이 27점 이상으로 지속되더라도 PHQ-9·GAD-7과 함께 해석하여 임상 의뢰 여부를 판단합니다.'\n    }, {\n      h: '실천 팁',\n      body: '디지털 이완 세션은 짧고 자주가 핵심입니다. PMR 메타분석(31 RCT, N=2,277)은 단독 10~30분, 호흡·음악과 병합 시 15~37분, 주 3~5회 시행이 권장 용량으로 보고합니다. 직장에서는 점심시간·업무 전환 시점에 5분 복식호흡, 퇴근 후 10분 PMR이 현실적인 시작점입니다. PSS-10 점수의 절대값보다 한 달 단위 변화 방향을 살피세요.'\n    }],\n    en: [{\n      h: 'A tool for the as-yet-undiagnosed',\n      body: 'Workers who do not meet criteria for depression or anxiety but routinely feel out of control and overloaded are very common. PSS-10 (Cohen & Williamson 1988) is the natural self-measure for this stage: its \"How often have you felt ____ in the past month?\" framing answers naturally without diagnosis, and a Korean validation exists (Lee, 2012).'\n    }, {\n      h: 'Does digital relaxation work?',\n      body: 'A 2025 decentralized randomized controlled trial (JMIR Mental Health 2025;e70722) evaluating a digital intervention in adults experiencing workplace stress reported significant reductions in burnout and anxiety with improvements in functional and health-related quality of life. Decentralized RCTs (remote home enrollment) are well-suited to time-constrained working populations. This is one external evidence axis for the Relax Routine primary target — the as-yet-undiagnosed stress/burnout population.'\n    }, {\n      h: 'How far should self-use go?',\n      body: 'Relax Routine is a low-intensity, preventive, early-intervention, self-use digital relaxation companion. It does not replace clinical diagnosis, medication changes, emergency response, or psychotherapy. If PHQ-9 stays ≥ 15, or PHQ-9 item 9 (suicidal ideation) is endorsed, seek psychiatric care immediately. Even if PSS-10 stays ≥ 27, interpret it alongside PHQ-9 and GAD-7 to decide clinical referral.'\n    }, {\n      h: 'Practical tips',\n      body: 'Short and frequent matters. The 2026 PMR meta-analysis (31 RCTs, N=2,277) reports recommended doses of 10–30 minutes alone, or 15–37 minutes combined with breath/music, 3–5 times per week. At work, a 5-minute diaphragmatic breath at lunch or task switch and a 10-minute PMR after work are realistic starting points. Watch the monthly direction of PSS-10, not its absolute value.'\n    }]\n  },\n  sources: [{\n    type: 'journal',\n    ref: 'Decentralized RCT — digital intervention for workplace stress and burnout: burnout/anxiety reduction and quality-of-life improvement. JMIR 2025;e70722. URL: jmir.org/2025/1/e70722'\n  }, {\n    type: 'journal',\n    ref: 'Cohen S, Williamson G. Perceived stress in a probability sample of the United States. In: Spacapan S, Oskamp S (eds). The Social Psychology of Health. Sage, 1988:31-67'\n  }, {\n    type: 'journal',\n    ref: 'Lee EH. Review of the psychometric evidence of the Perceived Stress Scale. Asian Nurs Res 2012;6(4):121-127'\n  }, {\n    type: 'journal',\n    ref: '2026 PMR meta-analysis (31 RCTs, N=2,277): anxiety SMD −1.11, sleep SMD −1.74, PSQI −3.79; PMR + breath/music outperforms PMR alone; 3–5 sessions/week recommended.'\n  }]\n}];\nfunction LearnScreen({\n  onOpenArticle\n}) {\n  const {\n    t,\n    lang\n  } = useT();\n  return React.createElement(\"div\", {\n    style: S.screen\n  }, React.createElement(\"div\", {\n    style: S.topBar\n  }, React.createElement(\"span\", {\n    style: S.topTitle\n  }, t('scr_learn'))), React.createElement(\"div\", {\n    style: {\n      ...S.scroll,\n      paddingBottom: 'calc(88px + env(safe-area-inset-bottom, 0px))'\n    }\n  }, React.createElement(\"p\", {\n    style: {\n      ...S.caption,\n      padding: '14px 0'\n    }\n  }, t('learn_intro')), React.createElement(\"div\", {\n    style: S.divider\n  }), ARTICLES.map((a, i) => {\n    const catColor = D.cat[a.cat]?.dark ?? D.black;\n    return React.createElement(\"div\", {\n      key: a.id\n    }, React.createElement(\"button\", {\n      onClick: () => onOpenArticle(a.id),\n      style: {\n        width: '100%',\n        background: 'none',\n        border: 'none',\n        cursor: 'pointer',\n        textAlign: 'left'\n      }\n    }, React.createElement(\"div\", {\n      style: {\n        padding: '14px 0 14px 12px',\n        borderLeft: `3px solid ${catColor}`\n      }\n    }, React.createElement(\"span\", {\n      style: {\n        display: 'inline-block',\n        border: `1px solid ${catColor}`,\n        borderRadius: D.r,\n        padding: '2px 8px',\n        fontFamily: D.font,\n        fontSize: '11px',\n        fontWeight: '600',\n        letterSpacing: '0.5px',\n        color: catColor,\n        marginBottom: '8px'\n      }\n    }, a.tag[lang] || a.tag.ko), React.createElement(\"p\", {\n      style: {\n        fontFamil <script id="relax-routine-progress-bridge">
(function(){
  const STORAGE_KEY='relax-routine-v33-mobile-state';
  const routineMap=['복식호흡','PMR','바디스캔','자율훈련','오늘 시작'];
  function read(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(_){return {}}}
  function write(next){localStorage.setItem(STORAGE_KEY,JSON.stringify({...read(),...next,updatedAt:new Date().toISOString()}));}
  function calculateRelaxStreak(dates){const set=new Set((dates||[]).map(String)); let streak=0; const d=new Date(); while(set.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)){streak++; d.setDate(d.getDate()-1);} return streak;}
  function calculateSessionCompletionRate(completed){return Math.min(100,Math.round(((completed||[]).length/4)*100));}
  window.recordRoutineProgress=function recordRoutineProgress(label){
    const prev=read(); const completed=Array.from(new Set([...(prev.completedRoutines||[]),label]));
    const progress=Math.min(100,Math.round(completed.length/4*100));
    const today=new Date(); const dateKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`; const completedDates=Array.from(new Set([...(prev.completedDates||[]),dateKey]));
    write({progress,completedRoutines:completed,completedDates,lastRoutineLabel:label,lastSession:label,routineHistory:[...(prev.routineHistory||[]),{label,at:new Date().toISOString()}].slice(-50)});
    const el=document.getElementById('relax-mobile-shell-status'); if(el) el.textContent=`진도 저장 ${progress}% · 연속 수행 ${calculateRelaxStreak(completedDates)}일 · 세션 완료율 ${calculateSessionCompletionRate(completed)}% · ${label}`;
  };
  document.addEventListener('click',function(e){
    const btn=e.target.closest('button'); if(!btn || btn.id==='relax-start-today-v15')return; if(window.__relaxSuppressNextRoutineRecord){window.__relaxSuppressNextRoutineRecord=false;return;}
    const text=(btn.innerText||btn.textContent||'').trim();
    const st=read(); if(st.sessionStartedOnly&&st.activeSession)return;
    const hit=routineMap.find(x=>text.includes(x));
    if(hit) window.recordRoutineProgress(text.replace(/\s+/g,' ').slice(0,48));
  },true);
})();
</script>

<script id="relax-mobile-scroll-fix-v22">
(function(){
  // v2.2 hotfix: minor mobile layout patch only. Do not bump version.
  // Some Android/in-app browsers keep #root overflow hidden while the rendered
  // app screen is taller than the phone frame, so bottom-tab screens cannot be
  // pulled upward. Make the active React shell itself the scroll container and
  // reserve space above the fixed bottom navigation.
  const STYLE_ID='relax-mobile-scroll-fix-v22-style';
  function ensureStyle(){
    if(document.getElementById(STYLE_ID)) return;
    const style=document.createElement('style');
    style.id=STYLE_ID;
    style.textContent=`
      #root[data-relax-scroll-fix-v22="true"] > *{
        overflow-y:auto!important;
        overflow-x:hidden!important;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-y:contain;
        touch-action:pan-y;
        scrollbar-width:none;
      }
      #root[data-relax-scroll-fix-v22="true"] > *::-webkit-scrollbar{display:none;}
    `;
    document.head.appendChild(style);
  }
  function hasBottomNav(){
    const txt=(document.getElementById('root')?.innerText||'').replace(/\s+/g,' ');
    return ['홈','세션','지도','배경','설정'].every(word=>txt.includes(word));
  }
  function applyScrollFix(){
    const root=document.getElementById('root');
    const shell=root?.firstElementChild;
    if(!root || !shell) return;
    const needsScroll = shell.scrollHeight > root.clientHeight + 2 || root.scrollHeight > root.clientHeight + 2 || hasBottomNav();
    if(!needsScroll) return;
    ensureStyle();
    root.dataset.relaxScrollFixV22='true';
    root.style.overflow='hidden';
    shell.style.overflowY='auto';
    shell.style.overflowX='hidden';
    shell.style.webkitOverflowScrolling='touch';
    shell.style.touchAction='pan-y';
    shell.style.overscrollBehaviorY='contain';
    shell.style.minHeight='0';
    shell.style.paddingBottom='calc(104px + env(safe-area-inset-bottom, 0px))';
    shell.dataset.relaxScrollContainerV22='true';
  }
  function install(){
    applyScrollFix();
    setTimeout(applyScrollFix,250);
    setTimeout(applyScrollFix,900);
    setTimeout(applyScrollFix,1800);
    new MutationObserver(applyScrollFix).observe(document.documentElement,{childList:true,subtree:true,characterData:false});
    window.addEventListener('resize',applyScrollFix,{passive:true});
    window.addEventListener('orientationchange',()=>setTimeout(applyScrollFix,250),{passive:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',install,{once:true}); else install();
})();
</script>

})();

<script id="rr-v3-hardening-approved">

  function syncScreen(){document.body.dataset.screen=document.documentElement.dataset.route||location.hash.replace('#','')||'home';document.body.dataset.modal=document.querySelector('#rr-pmr-v3.open')?'pmr-v3':'';}
  function markExplicitPmrLaunchers(){document.querySelectorAll('button,a,[role="button"]').forEach(el=>{const t=(el.textContent||'').replace(/\s+/g,' ');if(/^\s*(▶\s*)?PMR/.test(t)||/점진적 근육이완 3\.[01] 실행/.test(el.getAttribute('aria-label')||'')){el.dataset.action='start-pmr';el.dataset.rrModule='pmr-v3';}})}
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const modal=document.querySelector('#rr-pmr-v3.open');const close=modal?.querySelector('[aria-label*="닫"],button'); if(modal&&close) close.click();}});
  const mo=new MutationObserver(()=>{enforceButtonTypes();markExplicitPmrLaunchers();syncScreen();});
  if(document.body)mo.observe(document.body,{subtree:true,childList:true});
  ['DOMContentLoaded','load','hashchange'].forEach(ev=>addEventListener(ev,()=>{enforceButtonTypes();markExplicitPmrLaunchers();syncScreen();}));

      #rr-pmr-v3.sleep .rr-pmr-bodymap{background:radial-gradient(circle at 50% 44%,rgba(214,255,120,.2),rgba(50,64,92,.28) 42%,rgba(0,0,0,.05) 78%,transparent 100%)}

      #rr-pmr-v3 .rr-pmr-orb.tension{animation:rrPmrBalloonGrow 5s cubic-bezier(.18,.82,.28,1) forwards;background:radial-gradient(circle at 35% 28%,rgba(255,250,221,.98) 0,rgba(238,172,76,.9) 46%,rgba(194,112,32,.76) 78%,rgba(194,112,32,.20) 100%);box-shadow:0 0 0 28px rgba(238,172,76,.13),0 0 92px rgba(238,172,76,.45),inset -22px -26px 52px rgba(98,52,12,.16);}

<script id="rr-completion-polish-v33">
(function(){
  const READY='rr-v33-ready';
  function inject(){
    if(document.getElementById('rr-v33-polish-style')) return;
    const style=document.createElement('style');
    style.id='rr-v33-polish-style';
    style.textContent=`
      .rr-v33-finish-card{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:999998;width:min(390px,calc(100vw - 24px));padding:14px 14px 12px;border-radius:22px;background:rgba(24,36,20,.94);color:#fff;box-shadow:0 18px 40px rgba(19,36,18,.24);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
      .rr-v33-finish-card b{display:block;font-size:15px;margin-bottom:4px}.rr-v33-finish-card p{margin:0;color:rgba(255,255,255,.78);font-size:13px;line-height:1.45}.rr-v33-finish-card .rr-v33-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.rr-v33-finish-card button{min-height:44px;border:0;border-radius:15px;font-weight:900}.rr-v33-finish-card .primary{background:#b9e761;color:#16240d}.rr-v33-finish-card .ghost{background:rgba(255,255,255,.12);color:#fff}
      .rr-v33-pmr-hint{margin:8px 0 0;padding:10px 12px;border-radius:16px;background:rgba(185,231,97,.16);color:#24351f;font:13px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
      @media (prefers-reduced-motion:reduce){.rr-v33-finish-card{transition:none!important}}
    `;
    document.head.appendChild(style);
  }
  function showFinishCard(){
    inject();
    if(document.getElementById('rr-v33-finish-card')) return;
    const card=document.createElement('section');
    card.id='rr-v33-finish-card';
    card.className='rr-v33-finish-card';
    card.setAttribute('role','status');
    card.innerHTML='<b>오늘 한 번만 끝내기</b><p>완료 저장 후 더 이어가기보다 종료 경험을 남기는 것이 우선입니다.</p><div class="rr-v33-actions"><button type="button" class="primary" data-rr-v33-finish>완료 저장</button><button type="button" class="ghost" data-rr-v33-dismiss>조금 더 보기</button></div>';
    document.body.appendChild(card);
  }
  function addPmrHint(){
    return;
    inject();
    const text=document.body.innerText||'';
    if(!/PMR|점진적 근육이완|긴장/.test(text)) return;
    const host=[...document.querySelectorAll('section,article,.card,div')].find(el=>/PMR|점진적 근육이완/.test(el.textContent||'') && !el.querySelector?.('.rr-v33-pmr-hint'));
    if(host){
      const hint=document.createElement('div');
      hint.className='rr-v33-pmr-hint';
      hint.textContent='긴장을 5초 유지하면 원이 커지고, 10초 이완하면 원이 줄어듭니다. 힘은 70%까지만 쓰고 통증이 있으면 즉시 멈춥니다.';
      host.appendChild(hint);
    }
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-rr-v33-dismiss]')){document.getElementById('rr-v33-finish-card')?.remove();return;}
    if(e.target.closest('[data-rr-v33-finish]')){window.__RelaxProgressBridge?.markComplete?.('오늘 이완');document.getElementById('rr-v33-finish-card')?.remove();return;}
    const btn=e.target.closest('button,a');
    const label=(btn?.innerText||btn?.textContent||'').trim();
    if(/완료|마침|끝내기/.test(label)) setTimeout(showFinishCard,150);
  },true);
  function markReady(){document.body.dataset.version='3.3';document.body.dataset.rrUiPolish=READY;}
  new MutationObserver(()=>{markReady();addPmrHint();}).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',()=>{markReady();setTimeout(addPmrHint,400);});
  setTimeout(markReady,600);
  setInterval(markReady,1000);
})();
</script>
