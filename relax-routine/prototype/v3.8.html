      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    }

    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

        s.textContent = await r.text();

      }

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    void('Bundle unpack error:', err);
  }

ical_note: {\n    ko: 'CLINICAL NOTE',\n    en: 'CLINICAL NOTE'\n  },\n  dh_intro: {\n    ko: 'Relax Routine은 디지털 웰니스 파트너입니다.',\n    en: 'Relax Routine is your digital therapeutic partner.'\n  },\n  reset_btn: {\n    ko: '모든 데이터 초기화',\n    en: 'Reset all data'\n  },\n  chart_empty_state: {\n    ko: '측정을 시작하면 이 자리에 변화 그래프가 그려집니다.',\n    en: 'Once you start measuring, your trend chart will appear here.'\n  },\n  reset_confirm: {\n    ko: '정말로 모든 데이터를 초기화하시겠어요?\\n진도, 측정 기록, 설정이 모두 삭제됩니다.\\n되돌릴 수 없습니다.',\n    en: 'Reset all data?\\nProgress, scale scores, and settings will be erased.\\nThis cannot be undone.'\n  },\n  reset_warn: {\n    ko: '되돌릴 수 없습니다',\n    en: 'This cannot be undone'\n  },\n  sec_notif: {\n    ko: '알림',\n    en: 'Notifications'\n  },\n  sec_clinic: {\n    ko: '임상 정보',\n    en: 'Clinical'\n  },\n  sec_other: {\n    ko: '기타',\n    en: 'Other'\n  },\n  set_notif_session: {\n    ko: '세션 알림',\n    en: 'Session Reminders'\n  },\n  set_notif_weekly: {\n    ko: '주간 리포트',\n    en: 'Weekly Report'\n  },\n  set_clinic_info: {\n    ko: 'DH Mind Clinic 안내',\n    en: 'About DH Mind Clinic'\n  },\n  set_privacy: {\n    ko: '개인정보 처리방침',\n    en: 'Privacy Policy'\n  },\n  set_language: {\n    ko: '언어 설정',\n    en: 'Language'\n  },\n  set_app_info: {\n    ko: '앱 정보',\n    en: 'About'\n  },\n  set_logout: {\n    ko: '초기화',\n    en: 'Reset all data'\n  },\n  set_program: {\n    ko: '프로그램',\n    en: 'Program'\n  },\n  set_data: {\n    ko: '데이터',\n    en: 'Data'\n  },\n  set_about: {\n    ko: '정보',\n    en: 'About'\n  },\n  ns_when_h: {\n    ko: '발송 시점',\n    en: 'When'\n  },\n  ns_when_b: {\n    ko: '하루 1회, 사용자가 지정한 시간에 발송됩니다 (기본 21:00). 8주 프로그램 진행 단계에 따라 권장 세션이 달라집니다.',\n    en: 'Once daily at your chosen time (default 21:00). The recommended session adapts to your stage in the 8-week program.'\n  },\n  ns_what_h: {\n    ko: '내용',\n    en: 'Content'\n  },\n  ns_what_b: {\n    ko: '\"오늘은 1분 호흡으로 잠시 쉬어볼까요?\" 형태로 그날의 권장 기법과 소요 시간만 안내합니다. 임상적 평가나 검사 정보는 알림에 포함되지 않습니다.',\n    en: '\"How about a 1-minute breathing pause today?\" — only the suggested technique and duration. No clinical assessment or diagnostic info is sent in the push.'\n  },\n  ns_evid_h: {\n    ko: '근거',\n    en: 'Evidence'\n  },\n  ns_evid_b: {\n    ko: '디지털 정신건강 개입에서는 사용자가 직접 정한 규칙적인 알림이 꾸준한 사용에 도움이 될 수 있습니다.',\n    en: 'User-selected, consistent reminders can support steady use of digital mental-health interventions.'\n  },\n  nw_when_h: {\n    ko: '발송 요일',\n    en: 'When'\n  },\n  nw_when_b: {\n    ko: '매주 일요일 저녁 — 한 주의 세션 완료율, 증상 추이, 다음 주 권장 세션을 요약합니다.',\n    en: 'Sunday evenings — a summary of completion rate, symptom trends, and the next week\\u2019s recommended sessions.'\n  },\n  nw_struct_h: {\n    ko: '구성',\n    en: 'Structure'\n  },\n  nw_struct_b: {\n    ko: '1) 세션 완료 일수 / 2) PHQ-9·GAD-7 변화량 / 3) 가장 자주 측정한 신체 신호 / 4) 다음 주차 모듈 안내.',\n    en: '1) Days completed · 2) PHQ-9 / GAD-7 deltas · 3) Most-tracked body signal · 4) Next week\\u2019s module preview.'\n  },\n  nw_review_h: {\n    ko: '담당의 검토',\n    en: 'Clinical review'\n  },\n  nw_review_b: {\n    ko: '주간 리포트는 개인의 변화 추적용이며, 외부에 공유되지 않습니다. 별도 동의 시에만 담당의에게 비식별 요약이 전달됩니다.',\n    en: 'The weekly report is for personal tracking and is not shared externally. With explicit consent, a de-identified summary may be forwarded to your clinician.'\n  },\n  ci_org_h: {\n    ko: '제공 기관',\n    en: 'Provider'\n  },\n  ci_org_b: {\n    ko: 'DH Mind Clinic — 정신건강의학과 전문의가 설계한 Relax Routine의 임상 거버넌스 파트너입니다.',\n    en: 'DH Mind Clinic — Relax Routine\\u2019s clinical governance partner, designed by board-certified psychiatrists.'\n  },\n  ci_advis_h: {\n    ko: '임상 자문',\n    en: 'Clinical advisory'\n  },\n  ci_advis_b: {\n    ko: '8주 프로그램 구조, PAQ-S/PHQ-9/GAD-7 측정 프로토콜, 위기 에스컬레이션 경로(3종)는 모두 임상의 검토를 거쳐 결정됩니다.',\n    en: 'The 8-week curriculum, PAQ-S / PHQ-9 / GAD-7 protocol, and the three crisis-escalation paths are all clinically reviewed.'\n  },\n  ci_limit_h: {\n    ko: '안내',\n    en: 'Limits'\n  },\n  ci_limit_b: {\n    ko: 'Relax Routine은 일상 이완 루틴을 함께 만드는 웰니스 앱입니다. 의료기기가 아니며, 진단·치료·응급 대응·정신과 진료를 대체하지 않습니다. 도움이 필요할 땐 전문가와 상담하시는 게 좋아요.',\n    en: 'Relax Routine is a digital wellness companion, not a medical device. It does not replace diagnosis, treatment, emergency response, or psychiatric care.'\n  },\n  ci_contact_h: {\n    ko: '문의',\n    en: 'Contact'\n  },\n  ci_contact_b: {\n    ko: '(추후 추가)',\n    en: '(To be added)'\n  },\n  pr_anon_h: {\n    ko: '익명 모드 원칙',\n    en: 'Anonymous by default'\n  },\n  pr_anon_b: {\n    ko: 'Relax Routine은 기본값이 익명입니다. 이름·전화번호·생년월일 등 직접 식별정보를 수집하지 않습니다. 기기에 임시 ID(UUID)만 생성됩니다.',\n    en: 'Relax Routine is anonymous by default. No name, phone number, or date of birth is collected — only a per-device UUID.'\n  },\n  pr_collect_h: {\n    ko: '수집하는 정보',\n    en: 'What we collect'\n  },\n  pr_collect_b: {\n    ko: '세션 완료 기록 · 측정 척도 점수 · 신체 신호 체크인 · 액센트 색상 등 환경 설정. 모두 기기 내부에 저장됩니다.',\n    en: 'Session completions · scale scores · body-signal check-ins · UI preferences. All stored locally on your device.'\n  },\n  pr_store_h: {\n    ko: '저장과 전송',\n    en: 'Storage & transmission'\n  },\n  pr_store_b: {\n    ko: '세션 기록·척도 점수·신체 신호 체크인은 기본적으로 기기 내부에 저장되며 서버로 전송되지 않습니다. 단, 앱 접속 과정에서 호스팅·폰트·기본 웹 서비스 제공을 위한 기술적 접속 정보가 처리될 수 있습니다.',\n    en: 'Session records, scale scores, and body-signal check-ins are stored on-device by default and are not sent to a server. Technical access data may be processed by hosting, font, and basic web-service providers.'\n  },\n  pr_retain_h: {\n    ko: '보유 기간',\n    en: 'Retention'\n  },\n  pr_retain_b: {\n    ko: '사용자는 언제든 설정에서 기기 내 데이터를 초기화할 수 있습니다. 자동 삭제 정책은 정식 출시 전 별도 고지됩니다.',\n    en: 'Users can reset on-device data at any time in Settings. Any auto-delete policy will be announced before production release.'\n  },\n  pr_third_h: {\n    ko: '제3자 제공',\n    en: 'Third parties'\n  },\n  pr_third_b: {\n    ko: '광고·마케팅 목적의 제3자 제공은 일체 없습니다.',\n    en: 'No data is shared with third parties for advertising or marketing purposes.'\n  },\n  pr_law_h: {\n    ko: '근거 법령',\n    en: 'Legal basis'\n  },\n  pr_law_b: {\n    ko: '개인정보 보호법 등 관련 법령에 맞추어 운영될 예정이며, 정식 출시 전 별도 개인정보 처리방침을 고지합니다.',\n    en: 'The service will be operated in accordance with applicable privacy laws, and a separate production privacy policy will be provided before launch.'\n  },\n  lo_anon_h: {\n    ko: '익명 모드 안내',\n    en: 'Anonymous mode'\n  },\n  lo_anon_b: {\n    ko: 'Relax Routine은 계정이 없습니다. \"초기화\"는 기기 내부의 익명 ID와 모든 로컬 데이터를 지우는 작업입니다.',\n    en: 'Relax Routine has no accounts. \"Reset\" clears the on-device anonymous ID and all local data.'\n  },\n  lo_warn_h: {\n    ko: '주의',\n    en: 'Warning'\n  },\n  lo_warn_b: {\n    ko: '초기화하면 이번 8주 프로그램의 진도, 측정 기록, 신체 신호 데이터가 모두 삭제됩니다. 복구할 수 없습니다.',\n    en: 'Resetting deletes this 8-week program\\u2019s progress, scale scores, and body-signal data. This cannot be undone.'\n  },\n  lo_alt_h: {\n    ko: '대안',\n    en: 'Alternative'\n  },\n  lo_alt_b: {\n    ko: '데이터를 보존하면서 잠시 쉬고 싶다면, 알림만 끄고 앱을 그대로 두세요. 다시 열면 진도가 그대로 이어집니다.',\n    en: 'If you just need a break, turn off notifications and leave the app alone — your progress will resume when you return.'\n  },\n  designed_by: {\n    ko: '정신건강의학과 전문의가 설계한',\n    en: 'Designed by a board-certified psychiatrist'\n  },\n  sn_master_h: {\n    ko: '알림 켜기',\n    en: 'Enable reminders'\n  },\n  sn_preview_h: {\n    ko: '미리보기 모드',\n    en: 'Preview mode'\n  },\n  sn_preview_b: {\n    ko: '현재는 미리보기 모드입니다. 정식 출시 시 알림 권한을 허용하면 선택한 시간·요일 설정을 사용할 수 있습니다.',\n    en: 'This is preview mode. In the production build, the selected time and days can be used after notification permission is granted.'\n  },\n  sn_master_b: {\n    ko: '오늘의 권장 세션을 시간에 맞춰 알려드립니다',\n    en: \"We'll nudge you for today's recommended session at your chosen time\"\n  },\n  sn_time_label: {\n    ko: '알림 시간',\n    en: 'Reminder time'\n  },\n  sn_daily: {\n    ko: '매일',\n    en: 'Daily'\n  },\n  sn_time_evid: {\n    ko: '일정한 알림 시간은 디지털 정신건강 개입을 꾸준히 사용하는 데 도움이 될 수 있습니다.',\n    en: 'Consistent reminder times can support steady use of digital mental-health interventions.'\n  },\n  sn_pre_label: {\n    ko: '사전 알림',\n    en: 'Heads-up'\n  },\n  sn_pre_none: {\n    ko: '없음',\n    en: 'Off'\n  },\n  sn_pre_min: {\n    ko: '분 전',\n    en: 'min before'\n  },\n  sn_dow: {\n    ko: '요일',\n    en: 'Days'\n  },\n  sn_dow_short: {\n    ko: ['일', '월', '화', '수', '목', '금', '토'],\n    en: ['S', 'M', 'T', 'W', 'T', 'F', 'S']\n  },\n  sn_preview: {\n    ko: '알림 미리보기',\n    en: 'Notification preview'\n  },\n  sn_pv_app: {\n    ko: 'Relax Routine · 지금',\n    en: 'Relax Routine · now'\n  },\n  sn_pv_title: {\n    ko: '오늘의 세션이 준비됐어요',\n    en: \"Today's session is ready\"\n  },\n  sn_pv_body: {\n    ko: '1분 호흡으로 잠시 쉬어가세요.',\n    en: 'Take a 1-minute breathing pause.'\n  },\n  sn_safe: {\n    ko: '알림 내용에는 측정 점수나 임상 정보가 노출되지 않습니다.',\n    en: 'No scores or diagnostic info appear in notifications'\n  },\n  wr_period: {\n    ko: '주간 리포트',\n    en: 'Weekly Report'\n  },\n  wr_empty_title: {\n    ko: '아직 표시할 데이터가 없습니다',\n    en: 'No data to display yet'\n  },\n  wr_empty_body: {\n    ko: '세션을 완료하고 PHQ-9·GAD-7 측정을 시작하면, 매주 일요일 변화 요약과 신체 신호 인사이트가 이 자리에 표시됩니다.',\n    en: 'Once you complete sessions and begin PHQ-9 / GAD-7 measurements, a weekly summary and body-signal insight will appear here every Sunday.'\n  },\n  wr_headline: {\n    ko: '이번 주, 몸이 먼저 가벼워졌어요',\n    en: 'This week, your body felt lighter first'\n  },\n  wr_lede: {\n    ko: '지난 4주 중 가장 꾸준한 한 주였습니다. 호흡 세션 후 어깨 긴장이 평균 30% 감소했어요.',\n    en: 'Your most consistent week in the last four. Shoulder tension dropped 30% on average after breathing sessions.'\n  },\n  wr_m_sessions: {\n    ko: '세션',\n    en: 'Sessions'\n  },\n  wr_m_phq: {\n    ko: 'PHQ-9',\n    en: 'PHQ-9'\n  },\n  wr_m_gad: {\n    ko: 'GAD-7',\n    en: 'GAD-7'\n  },\n  wr_m_days: {\n    ko: '일',\n    en: 'days'\n  },\n  wr_m_pts: {\n    ko: '점',\n    en: 'pts'\n  },\n  wr_cal: {\n    ko: '이번 주 세션',\n    en: 'This week\\u2019s sessions'\n  },\n  wr_top: {\n    ko: '가장 많이 한 기법',\n    en: 'Most-used techniques'\n  },\n  wr_t_breath: {\n    ko: '복식호흡',\n    en: 'Diaphragmatic'\n  },\n  wr_t_pmr: {\n    ko: 'PMR',\n    en: 'PMR'\n  },\n  wr_t_body: {\n    ko: '바디스캔',\n    en: 'Body scan'\n  },\n  wr_count: {\n    ko: '회',\n    en: ' sessions'\n  },\n  wr_signal: {\n    ko: '신체 신호 인사이트',\n    en: 'Body signal insight'\n  },\n  wr_signal_b1a: {\n    ko: '이번 주 가장 자주 보고된 신호는 ',\n    en: 'Your most-reported signal this week was '\n  },\n  wr_signal_b1b: {\n    ko: '어깨 긴장',\n    en: 'shoulder tension'\n  },\n  wr_signal_b1c: {\n    ko: '입니다 (5/7일).',\n    en: ' (5 of 7 days).'\n  },\n  wr_signal_b2: {\n    ko: '오후 4–6시에 집중되어 나타났습니다. 다음 주는 이 시간대에 1분 PMR을 시도해보세요.',\n    en: 'It clustered between 4–6 PM. Try a 1-minute PMR at that time next week.'\n  },\n  wr_next: {\n    ko: '다음 주 권장',\n    en: 'Next week'\n  },\n  wr_next_b1a: {\n    ko: '5주차 — 자율훈련 도입.',\n    en: 'Week 5 — Autogenic training.'\n  },\n  wr_next_b1b: {\n    ko: ' 무거움·따뜻함 공식으로 자율신경 조절을 직접 연습합니다.',\n    en: ' Practice direct autonomic regulation through heaviness and warmth formulas.'\n  },\n  wr_foot: {\n    ko: '이 리포트는 익명 모드로 생성되었으며 외부에 공유되지 않습니다.',\n    en: 'This report was generated in anonymous mode and is never shared externally.'\n  },\n  wr_dow_sun: {\n    ko: '일',\n    en: 'S'\n  },\n  wr_dow_mon: {\n    ko: '월',\n    en: 'M'\n  },\n  wr_dow_tue: {\n    ko: '화',\n    en: 'T'\n  },\n  wr_dow_wed: {\n    ko: '수',\n    en: 'W'\n  },\n  wr_dow_thu: {\n    ko: '목',\n    en: 'T'\n  },\n  wr_dow_fri: {\n    ko: '금',\n    en: 'F'\n  },\n  wr_dow_sat: {\n    ko: '토',\n    en: 'S'\n  },\n  ai_version: {\n    ko: 'prototype v2.4 · Build 2026.05 · Lime',\n    en: 'prototype v2.4 · Build 2026.05 · Lime'\n  },\n  ai_s1_h: {\n    ko: '무엇을 하는 앱인가요',\n    en: 'What this app does'\n  },\n  ai_s1_b: {\n    ko: '가벼운 스트레스와 긴장 완화를 위한 자가 이완 연습 도구입니다. PAQ-S 기반 Track A/B/C로 분기하는 8주 프로그램과 4가지 이완 기법(복식호흡·PMR·바디스캔·자율훈련)을 제공합니다. 증상이 심하거나 일상 기능 저하가 지속되면 전문가 진료가 필요합니다.',\n    en: 'A self-guided relaxation practice tool for mild stress and tension relief. It offers an 8-week PAQ-S-based Track A/B/C program with four relaxation techniques: diaphragmatic breathing, PMR, body scan, and autogenic training. Severe or persistent impairment requires professional care.'\n  },\n  ai_s2_h: {\n    ko: '임상 거버넌스',\n    en: 'Clinical governance'\n  },\n  ai_s2_b: {\n    ko: 'DH Mind Clinic의 정신건강의학과 전문의가 프로그램 구조와 측정 프로토콜을 설계·검토합니다.',\n    en: 'Psychiatrists at DH Mind Clinic design and review the program structure and measurement protocols.'\n  },\n  ai_s3_h: {\n    ko: '측정 척도',\n    en: 'Measurement scales'\n  },\n  ai_s3_b: {\n    ko: 'PHQ-9 © Pfizer Inc. (공공 도메인) · GAD-7 © Pfizer Inc. (공공 도메인) · PAQ-S © Preece et al. 2020 (CC BY 4.0) · PSS-10 © Cohen & Williamson 1988 (한국어판 검증: Lee 2012)',\n    en: 'PHQ-9 © Pfizer Inc. (public domain) · GAD-7 © Pfizer Inc. (public domain) · PAQ-S © Preece et al. 2020 (CC BY 4.0) · PSS-10 © Cohen & Williamson 1988 (Korean validation: Lee 2012)'\n  },\n  ai_s4_h: {\n    ko: '오픈소스',\n    en: 'Open source'\n  },\n  ai_s4_b: {\n    ko: 'Pretendard (Open Font License) · React 18.3.1 (MIT) · 본 앱은 외부 분석 SDK를 포함하지 않습니다.',\n    en: 'Pretendard (Open Font License) · React 18.3.1 (MIT) · This app contains no third-party analytics SDKs.'\n  },\n  ai_s6_h: {\n    ko: '문의',\n    en: 'Contact'\n  },\n  ai_s6_b: {\n    ko: '(추후 추가)',\n    en: '(To be added)'\n  },\n  ai_foot: {\n    ko: '© 2026 DH Mind Clinic · 한국 서울',\n    en: '© 2026 DH Mind Clinic · Seoul, Korea'\n  },\n  ci_eyebrow: {\n    ko: 'RELAX ROUTINE',\n    en: 'RELAX ROUTINE'\n  },\n  ci_hero_title: {\n    ko: '8주 동안 연습하는 이완 루틴',\n    en: 'An 8-week relaxation routine for everyday practice'\n  },\n  ci_lead_a: {\n    ko: 'Relax Routine은 ',\n    en: 'Relax Routine is '\n  },\n  ci_lead_b: {\n    ko: 'DH Mind Clinic의 임상 검토를 바탕으로 만든 디지털 웰니스 도구',\n    en: 'a digital wellness tool clinically reviewed by DH Mind Clinic'\n  },\n  ci_lead_c: {\n    ko: '입니다. 병원 진료를 대체하지 않고, 일상에서 이완 연습을 돕습니다.',\n    en: '. It does not replace clinical care; it supports everyday relaxation practice.'\n  },\n  ci_diff: {\n    ko: '무엇이 다른가요',\n    en: 'What\\u2019s different'\n  },\n  ci_d1_h: {\n    ko: '시간',\n    en: 'Time'\n  },\n  ci_d1_b: {\n    ko: '진료 밖 시간 → 매일 1–10분 이완 연습',\n    en: 'Outside the clinic → 1–10 min of daily practice'\n  },\n  ci_d2_h: {\n    ko: '장소',\n    en: 'Place'\n  },\n  ci_d2_b: {\n    ko: '병원 대기실 → 침대·소파·출퇴근길 어디든',\n    en: 'Waiting rooms → bed, couch, your commute — anywhere'\n  },\n  ci_d3_h: {\n    ko: '익명',\n    en: 'Anonymity'\n  },\n  ci_d3_b: {\n    ko: '이름 없이 시작, 기록은 기본적으로 기기 안에만',\n    en: 'No name required; records stay on your device by default'\n  },\n  ci_d4_h: {\n    ko: '근거',\n    en: 'Evidence'\n  },\n  ci_d4_b: {\n    ko: 'PHQ-9·GAD-7·PAQ-S로 변화를 스스로 확인',\n    en: 'Self-monitor change with PHQ-9, GAD-7, and PAQ-S'\n  },\n  ci_team_h: {\n    ko: '누가 만드나요',\n    en: 'Who builds it'\n  },\n  ci_team_b1: {\n    ko: '정신건강의학과 전문의·디자이너·엔지니어가 함께 만든 팀입니다.',\n    en: 'Psychiatrists, designers, and engineers — built together.'\n  },\n  ci_team_b2: {\n    ko: '8주 프로그램의 주요 안내는 임상의 검토를 거칩니다. 자살사고·자해충동·급박한 위험이 있을 때는 앱 사용을 중단하고 109, 1577-0199, 119 또는 가까운 응급실을 이용하도록 안내합니다.',\n    en: 'Core program guidance is clinically reviewed. If suicidal thoughts, self-harm urges, or imminent danger are present, the app instructs users to stop using it and contact local crisis resources or emergency care.'\n  },\n  ci_limit_h: {\n    ko: '이런 것은 못해요',\n    en: 'WHAT IT DOESN\\u2019T DO'\n  },\n  ci_limit_b: {\n    ko: '진단·약물 조정·응급 대응·진료를 제공하지 않습니다. 증상이 심하거나 일상 기능 저하가 지속되면 정신건강의학과 외래 진료를 권장합니다.',\n    en: 'It does not provide diagnosis, medication changes, emergency response, or clinical care. If symptoms are severe or functioning remains impaired, please seek professional care.'\n  },\n  ci_contact: {\n    ko: '앱 사용 문의 보내기',\n    en: 'Contact support'\n  },\n  ci_contact_sub: {\n    ko: '(추후 추가)',\n    en: '(To be added)'\n  },\n  splash_eyebrow: {\n    ko: 'DH MIND CLINIC',\n    en: 'DH MIND CLINIC'\n  },\n  splash_subtitle1: {\n    ko: '정신건강의학과 전문의가 설계한',\n    en: 'Designed by a board-certified psychiatrist'\n  },\n  splash_subtitle2: {\n    ko: '근거 기반 이완 습관 루틴',\n    en: 'Evidence-based relaxation habits'\n  },\n  splash_cta: {\n    ko: '오늘 시작해 볼까요? (약 2분)',\n    en: 'Get started (~2 min survey)'\n  },\n  splash_try: {\n    ko: '먼저 잠시 쉬어가도 좋아요',\n    en: 'Try a single session (no survey)'\n  },\n  splash_usp_1: {\n    ko: '6문항으로 나에게 맞는 루틴 찾기',\n    en: '6 questions for a personalized path'\n  },\n  splash_usp_2: {\n    ko: '4가지 이완 기법',\n    en: '4 evidence-backed relaxation skills'\n  },\n  splash_usp_3: {\n    ko: '8주 함께하는 루틴',\n    en: '8-week phased guidance'\n  },\n  onb_h1_l1: {\n    ko: '나에게 맞는',\n    en: 'Find the relaxation'\n  },\n  onb_h1_l2: {\n    ko: '이완 방식을',\n    en: 'that fits you —'\n  },\n  onb_h1_l3: {\n    ko: '함께 찾아봐요.',\n    en: 'together.'\n  },\n  onb_lead_l1: {\n    ko: '6개 짧은 질문에 답하시면',\n    en: 'Six short questions help us'\n  },\n  onb_lead_l2: {\n    ko: '맞춤 이완 경로를 추천해 드려요.',\n    en: 'recommend the right relaxation path.'\n  },\n  onb_paq_intro: {\n    ko: '이 검사는 Perth Alexithymia Questionnaire (PAQ-S) 기반입니다. 감정 인식 유형에 따라 Track A / B / C로 분기하여 맞춤 이완 경로를 안내합니다.',\n    en: 'Based on the Perth Alexithymia Questionnaire (PAQ-S). You will be branched into Track A / B / C by emotion-recognition style, with a tailored relaxation route.'\n  },\n  onb_start: {\n    ko: '시작하기 (약 2분)',\n    en: 'Begin (~2 min)'\n  },\n  onb_q_caption: {\n    ko: '질문',\n    en: 'Question'\n  },\n  onb_route_caption: {\n    ko: '당신의 이완 경로',\n    en: 'Your relaxation track'\n  },\n  onb_program_start: {\n    ko: '프로그램 시작하기',\n    en: 'Start program'\n  },\n  onb_signal_view: {\n    ko: 'Signal-first 안내 보기',\n    en: 'View Signal-first guide'\n  },\n  onb_paq_score: {\n    ko: '감정 인식 어려움 정도 (PAQ-S)',\n    en: 'Emotion-awareness difficulty (PAQ-S)'\n  },\n  onb_b_track: {\n    ko: 'TRACK B · SIGNAL-FIRST',\n    en: 'TRACK B · SIGNAL-FIRST'\n  },\n  onb_b_h_l1: {\n    ko: '감정 단어가 떠오르지 않아도',\n    en: \"It's OK if emotion words\"\n  },\n  onb_b_h_l2: {\n    ko: '괜찮습니다.',\n    en: \"don't come to mind.\"\n  },\n  onb_b_lead_a: {\n    ko: '앞으로 2주 동안은 ',\n    en: 'For the next 2 weeks, focus on '\n  },\n  onb_b_lead_b: {\n    ko: '몸의 신호',\n    en: 'body signals'\n  },\n  onb_b_lead_c: {\n    ko: '에 먼저 집중합니다. 감정을 말로 옮기는 연습은 3주차부터 점진적으로 시작됩니다.',\n    en: ' first. Putting feelings into words begins gradually from week 3.'\n  },\n  onb_b_w12_h: {\n    ko: '1–2주차 · 신체 신호 감지',\n    en: 'Weeks 1–2 · Body signal detection'\n  },\n  onb_b_w12_b: {\n    ko: '바디스캔 · 그라운딩 마이크로 연습(각 2–3분)으로 부위별 감각을 관찰합니다. \"어깨가 무거운가요?\", \"가슴이 답답한가요?\" 같은 신체 질문이 기본 언어입니다.',\n    en: 'Body-scan and grounding micro-practices (2–3 min each) help you observe sensations by region. Body-centered questions like \"Are your shoulders heavy?\" or \"Is your chest tight?\" become the default vocabulary.'\n  },\n  onb_b_w34_h: {\n    ko: '3–4주차 · 신호 → 단어 브리지',\n    en: 'Weeks 3–4 · Signal → word bridge'\n  },\n  onb_b_w34_b: {\n    ko: '신체 감각 위에 감정 라벨을 얹는 연습이 추가됩니다. 원치 않으면 신체 감각 전용 모드로 계속 진행할 수 있어요.',\n    en: 'You begin layering emotion labels on top of body sensations. If you prefer, you can stay in body-only mode.'\n  },\n  onb_b_w58_h: {\n    ko: '5–8주차 · 통합 이완',\n    en: 'Weeks 5–8 · Integrated relaxation'\n  },\n  onb_b_w58_b: {\n    ko: '표준 이완 프로토콜(PMR · 자율훈련 · 마음챙김)에 접속하지만, 모든 체크인은 여전히 신체 중심입니다.',\n    en: 'You access standard relaxation protocols (PMR, autogenic, mindfulness) — but every check-in remains body-centered.'\n  },\n  onb_evidence_label: {\n    ko: 'EVIDENCE',\n    en: 'EVIDENCE'\n  },\n  onb_evidence_body: {\n    ko: '감정 라벨 먼저 UI는 알렉시티미아(TAS-20 ≥ 61, 인구 10–13%) 사용자의 이탈률을 높입니다. Signal-first 접근은 APA Monitor 2026 · Integrate Network 2026 · Lane et al. 2023 RCT (Sci Rep, N=285)에서 EMA 알렉시티미아·내수용감각 지표 변화를 보였습니다.',\n    en: 'Emotion-label-first UIs increase drop-out for users with alexithymia (TAS-20 ≥ 61, 10–13% prevalence). Signal-first design (APA Monitor 2026; Integrate Network 2026; Lane et al. 2023 RCT, Sci Rep, N=285) improved EMA alexithymia and interoceptive measures.'\n  },\n  onb_b_start: {\n    ko: '몸 신호 체크인부터 시작하기',\n    en: 'Start with body-signal check-in'\n  },\n  track_a_tag: {\n    ko: '표준 경로',\n    en: 'Standard track'\n  },\n  track_a_desc: {\n    ko: '감정 인식이 비교적 명확합니다. 감정 단어를 바로 쓰되, 주 1회 신체 체크인을 보조로 붙이는 표준 8주 프로그램을 시작합니다.',\n    en: 'Your emotional awareness is relatively clear. Begin a standard 8-week program using emotion words directly, with a weekly body check-in as support.'\n  },\n  track_b_tag: {\n    ko: '신체 우선',\n    en: 'Body-first'\n  },\n  track_b_desc: {\n    ko: '알렉시티미아가 높은 사용자를 위한 신체 우선 경로입니다. 높은 등급은 3–4주차부터 신호→단어 브리지를 시작하고, 매우 높은 등급은 4주 동안 감정 단어 요구를 최소화합니다.',\n    en: 'A body-first route for higher alexithymia. High level begins signal-to-word bridging in weeks 3–4; very-high level minimizes emotion-word demands for four weeks.'\n  },\n  track_c_tag: {\n    ko: '통합 경로',\n    en: 'Integrated track'\n  },\n  track_c_desc: {\n    ko: '알렉시티미아가 중간 범위입니다. 표준 이완을 유지하되 매 세션 끝에 짧은 신체→감정 연결을 붙이는 통합 경로입니다.',\n    en: 'Your alexithymia range is moderate. This integrated route keeps standard relaxation while adding a brief body-to-emotion bridge after each session.'\n  },\n  alex_level_low_label: { ko: '낮음', en: 'Low' },\n  alex_level_moderate_label: { ko: '중간', en: 'Moderate' },\n  alex_level_high_label: { ko: '높음', en: 'High' },\n  alex_level_veryHigh_label: { ko: '매우 높음', en: 'Very high' },\n  alex_level_low_protocol: { ko: '감정 단어를 바로 사용하고, 신체 체크인은 보조 지표로만 둡니다.', en: 'Use emotion words directly; body check-ins stay as a support marker.' },\n  alex_level_moderate_protocol: { ko: '이완 후 몸 변화 1개와 가능한 감정 단어 1개를 함께 연결합니다.', en: 'After relaxation, link one body change with one possible emotion word.' },\n  alex_level_high_protocol: { ko: '몸 위치·강도·변화 방향을 먼저 기록한 뒤 감정 단어 후보를 천천히 붙입니다.', en: 'Record body location, intensity, and direction first, then gradually add possible emotion words.' },\n  alex_level_veryHigh_protocol: { ko: '초기 4주는 감정 이름 요구를 줄이고, 신체 신호·강도·완화 반응만으로 루틴을 진행합니다.', en: 'For the first four weeks, reduce emotion-label demands and work with body signals, intensity, and relief response only.' },\n  alex_level_card_title: { ko: '알렉시티미아 맞춤 등급', en: 'Alexithymia personalization level' },\n  alex_level_badge_prefix: { ko: '알렉시티미아', en: 'Alexithymia' },\n  alex_level_score: { ko: 'PAQ-S {score}/30 · {level}', en: 'PAQ-S {score}/30 · {level}' },\n  paq_q1: {\n    ko: '나는 내가 느끼는 감정이 무엇인지 알기 어렵다.',\n    en: 'I am often confused about what emotion I am feeling.'\n  },\n  paq_q2: {\n    ko: '나는 내 감정을 말로 표현하기 어렵다.',\n    en: 'I find it hard to put my feelings into words.'\n  },\n  paq_q3: {\n    ko: '다른 사람들은 내가 감정을 더 잘 표현하길 바란다고 말한다.',\n    en: 'People tell me I should express my feelings more.'\n  },\n  paq_q4: {\n    ko: '나는 내 안에서 일어나는 감정을 구별하기 어렵다.',\n    en: 'I find it hard to identify the emotions inside me.'\n  },\n  paq_q5: {\n    ko: '나는 감정보다 실제 일어난 일에 더 관심이 있다.',\n    en: 'I am more interested in what actually happens than in feelings.'\n  },\n  paq_q6: {\n    ko: '나는 문제를 감정보다 논리로 해결하는 것을 선호한다.',\n    en: 'I prefer to use logic rather than feelings to solve problems.'\n  },\n  likert_paq: {\n    ko: ['전혀 아니다', '아니다', '보통', '그렇다', '매우 그렇다'],\n    en: ['Strongly disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly agree']\n  },\n  likert_weekly: {\n    ko: ['전혀 그렇지 않다', '며칠 동안', '일주일 이상', '거의 매일'],\n    en: ['Not at all', 'Several days', 'More than half the days', 'Nearly every day']\n  },\n  likert_pss: {\n    ko: ['전혀 없음', '거의 없음', '가끔', '자주', '매우 자주'],\n    en: ['Never', 'Almost never', 'Sometimes', 'Fairly often', 'Very often']\n  },\n  bs_chest_label: {\n    ko: '가슴',\n    en: 'Chest'\n  },\n  bs_chest_q: {\n    ko: '답답하거나 조이는 느낌이 있나요?',\n    en: 'Any tightness or constriction?'\n  },\n  bs_shoulder_label: {\n    ko: '어깨·목',\n    en: 'Shoulders / Neck'\n  },\n  bs_shoulder_q: {\n    ko: '무겁거나 굳어 있는 느낌이 있나요?',\n    en: 'Heavy or stiff?'\n  },\n  bs_belly_label: {\n    ko: '배',\n    en: 'Belly'\n  },\n  bs_belly_q: {\n    ko: '메스껍거나 뒤틀리는 느낌이 있나요?',\n    en: 'Nauseous or twisted?'\n  },\n  bs_head_label: {\n    ko: '머리',\n    en: 'Head'\n  },\n  bs_head_q: {\n    ko: '지끈거리거나 멍한 느낌이 있나요?',\n    en: 'Throbbing or foggy?'\n  },\n  bs_limb_label: {\n    ko: '팔·다리',\n    en: 'Arms / Legs'\n  },\n  bs_limb_q: {\n    ko: '떨리거나 힘이 빠지는 느낌이 있나요?',\n    en: 'Trembling or weak?'\n  },\n  cur_w1_t: {\n    ko: '몸 신호 알기',\n    en: 'Body signals'\n  },\n  cur_w1_d: {\n    ko: '몸 전체를 짧게 스캔하고 마지막에 1분 복식호흡\\n증상 이름보다 \"어디가 조이는지\" 먼저 보기',\n    en: 'Brief body scan, then 1-min belly breathing\\nNotice where it tightens before naming symptoms'\n  },\n  cur_w2_t: {\n    ko: '복식호흡',\n    en: 'Diaphragmatic breath'\n  },\n  cur_w2_d: {\n    ko: '이번 주는 복식호흡만 5분 정도 길게 연습\\n방법은 쉽게: 배가 부풀고, 잠깐 멈추고, 더 길게 내쉬기',\n    en: 'This week is breathing-only: practice belly breathing for about 5 min\\nKeep it easy: belly rises, brief hold, longer exhale'\n  },\n  cur_w3_t: {\n    ko: '근이완(PMR)',\n    en: 'PMR'\n  },\n  cur_w3_d: {\n    ko: 'PMR 전후에 1분 복식호흡을 붙여 긴장-이완 대비를 더 쉽게 느끼기\\n호흡은 짧고 반복적으로 확인',\n    en: 'Add 1-min belly breathing around PMR to make tense-release contrast easier\\nKeep breathing short and repeated'\n  },\n  cur_w4_t: {\n    ko: '자율훈련',\n    en: 'Autogenic'\n  },\n  cur_w4_d: {\n    ko: '자율훈련 전에 1분 복식호흡으로 속도를 낮추고 시작\\n잠들기 전에는 호흡→무거움→따뜻함 순서로',\n    en: 'Start autogenic training by slowing down with 1-min belly breathing\\nBefore sleep: breath → heaviness → warmth'\n  },\n  cur_w5_t: {\n    ko: '통합 이완 Ⅰ',\n    en: 'Integrated Ⅰ'\n  },\n  cur_w5_d: {\n    ko: '단축 PMR + 호흡 + 바디스캔을 하나의 15분 흐름으로 연결\\n자기만의 순서를 찾는 주',\n    en: 'Chain short PMR → breath → body scan into one 15-min flow\\nThe week to find your own ordering'\n  },\n  cur_w6_t: {\n    ko: '통합 이완 Ⅱ',\n    en: 'Integrated Ⅱ'\n  },\n  cur_w6_d: {\n    ko: '회의 직전 1분 호흡, 출퇴근 5분 PMR, 자기 전 자율훈련\\n일상의 3개 지점에 이완을 심기',\n    en: '1-min breath before meetings, 5-min PMR on commute, autogenic before bed\\nPlant relaxation into 3 daily moments'\n  },\n  cur_w7_t: {\n    ko: '마음챙김',\n    en: 'Mindfulness'\n  },\n  cur_w7_d: {\n    ko: '이완 후 5분 알아차림 — 떠오르는 생각을 라벨링하고 흘려보내기\\n이완 + 인식의 분리 연습',\n    en: 'After relaxation, 5 min of awareness — label rising thoughts and let them pass\\nPractice separating relaxation from recognition'\n  },\n  cur_w8_t: {\n    ko: '맞춤 루틴',\n    en: 'Personal routine'\n  },\n  cur_w8_d: {\n    ko: '8주 데이터를 바탕으로 본인에게 맞는 10–20분 데일리 루틴 확정\\n졸업 후에도 이어갈 수 있도록',\n    en: 'Based on 8 weeks of data, lock in your own 10–20 min daily routine\\nBuilt to continue past graduation'\n  },\n  cur_goal_w1: {\n    ko: '목표: 몸 신호 1개를 찾고 1분 복식호흡으로 마무리한다',\n    en: 'Goal: notice and log one tight spot in the body, every day'\n  },\n  cur_goal_w2: {\n    ko: '목표: 복식호흡만 5분 해보고, 날숨을 들숨보다 길게 자동화한다',\n    en: 'Goal: automate 4-in/6-out — exhale longer than inhale'\n  },\n  cur_goal_w3: {\n    ko: '목표: PMR 전후 1분 호흡으로 이완 반응을 더 쉽게 만든다',\n    en: 'Goal: complete a full 16-group PMR session, end to end'\n  },\n  cur_goal_w4: {\n    ko: '목표: 호흡→무거움→따뜻함 순서를 잠들기 전 루틴으로 만든다',\n    en: 'Goal: reach the heaviness/warmth state with autogenic before sleep'\n  },\n  cur_goal_w5: {\n    ko: '목표: PMR·호흡·바디스캔을 자기만의 순서로 15분 시퀀스 완성',\n    en: 'Goal: build your own 15-min sequence of PMR + breath + body scan'\n  },\n  cur_goal_w6: {\n    ko: '목표: 일상 3개 지점(전·중·후)에 짧은 이완 심기',\n    en: 'Goal: plant short relaxations into 3 daily moments (before/during/after)'\n  },\n  cur_goal_w7: {\n    ko: '목표: 이완과 알아차림(라벨링)을 분리해서 동시에 다룬다',\n    en: 'Goal: hold relaxation and labeling-awareness as two separate skills'\n  },\n  cur_goal_w8: {\n    ko: '목표: 졸업 후에도 지속할 본인만의 10–20분 루틴을 확정',\n    en: 'Goal: lock in your own 10–20 min routine to continue post-graduation'\n  },\n  cur_b_w1_t: { ko: '신체 신호 탐지', en: 'Body-signal detection' },\n  cur_b_w1_d: { ko: '감정 단어 없이 가슴·어깨·복부·머리·팔다리 감각을 2분 체크인\\n바디스캔을 짧게 반복해 신호 포착률을 높입니다', en: '2-min check-in for chest, shoulders, belly, head, limbs without emotion words\\nUse brief body scans to improve signal detection' },\n  cur_b_goal_w1: { ko: '목표: 감정 이름을 붙이기 전에 몸 신호 1개를 안정적으로 찾는다', en: 'Goal: reliably identify one body signal before naming emotions' },\n  cur_b_w2_t: { ko: '감각 지도 만들기', en: 'Body-sensation map' },\n  cur_b_w2_d: { ko: '이번 주는 복식호흡만 5분 정도 길게 반복\\n감정 단어보다 배가 오르내리는 감각과 날숨 길이를 먼저 봅니다', en: 'This week is breathing-only: repeat belly breathing for about 5 min\\nTrack belly movement and longer exhale before emotion words' },\n  cur_b_goal_w2: { ko: '목표: 신체 위치-강도-변화 방향을 짧게 기록한다', en: 'Goal: record location, intensity, and direction of body change' },\n  cur_b_w3_t: { ko: '신호→단어 브리지', en: 'Signal-to-word bridge' },\n  cur_b_w3_d: { ko: '바디스캔과 호흡 후 감정 단어 후보를 2–3개만 제시\\n정답 맞히기가 아니라 몸 신호와 단어의 연결 실험입니다', en: 'After body scan and breathing, offer only 2–3 candidate emotion words\\nThis is a linking experiment, not a right-answer test' },\n  cur_b_goal_w3: { ko: '목표: 몸 신호에서 가능한 감정 단어 후보로 점진적으로 이동한다', en: 'Goal: move gradually from body signals to possible emotion words' },\n  cur_b_w4_t: { ko: '감정 라벨 전 이완', en: 'Pre-label relaxation' },\n  cur_b_w4_d: { ko: '호흡으로 각성을 낮춘 뒤 짧은 PMR로 긴장/이완 대비를 학습\\n감정 보고 부담을 낮추고 신체 변화를 먼저 확인합니다', en: 'Lower arousal with breathing, then use brief PMR to learn tense-release contrast\\nReduce emotion-report burden and check body change first' },\n  cur_b_goal_w4: { ko: '목표: 불편감이 있을 때 감정 설명보다 먼저 이완 절차를 시작한다', en: 'Goal: start relaxation before explaining the emotion' },\n  cur_b_w5_t: { ko: '신체 우선 통합 Ⅰ', en: 'Body-first integration Ⅰ' },\n  cur_b_w5_d: { ko: 'PMR + 바디스캔 + 자율훈련을 하나의 15분 흐름으로 연결\\n신체 신호에서 자기진정 문장으로 이어갑니다', en: 'Chain PMR + body scan + autogenic training into a 15-min flow\\nMove from body signal to self-soothing phrases' },\n  cur_b_goal_w5: { ko: '목표: 몸 신호 기반 15분 통합 루틴을 완주한다', en: 'Goal: complete a 15-min body-signal-based integrated routine' },\n  cur_b_w6_t: { ko: '일상 신호 개입', en: 'Daily signal intervention' },\n  cur_b_w6_d: { ko: '하루 nic',\n    en: '— DH Mind Clinic'\n  },\n  date_suffix_month: {\n    ko: '월',\n    en: ''\n  },\n  date_suffix_day: {\n    ko: '일',\n    en: ''\n  },\n  mood_sun: {\n    ko: '고요한 아침',\n    en: 'Quiet morning'\n  },\n  mood_mon: {\n    ko: '호숫가의 풀밭',\n    en: 'Lakeside meadow'\n  },\n  mood_tue: {\n    ko: '노을 지는 언덕',\n    en: 'Sunset hill'\n  },\n  mood_wed: {\n    ko: '안개 낀 숲',\n    en: 'Misty forest'\n  },\n  mood_thu: {\n    ko: '잔잔한 바다',\n    en: 'Calm sea'\n  },\n  mood_fri: {\n    ko: '들꽃 핀 들판',\n    en: 'Wildflower field'\n  },\n  mood_sat: {\n    ko: '별이 뜨는 저녁',\n    en: 'Starlit evening'\n  },\n  cn_breath_tag: {\n    ko: '호흡',\n    en: 'Breath'\n  },\n  cn_breath_quote: {\n    ko: '들숨보다 날숨을 길게 — 호기 연장이 부교감신경을 자극해 심박을 안정시킵니다.',\n    en: 'Lengthen the exhale beyond the inhale — extending exhalation activates the parasympathetic system and steadies the heart.'\n  },\n  cn_pmr_tag: {\n    ko: 'PMR',\n    en: 'PMR'\n  },\n  cn_pmr_quote: {\n    ko: '근육은 먼저 긴장해야 이완을 체감할 수 있습니다. 5초 조이고 10초 풀어주세요.',\n    en: 'You feel relaxation only after first creating tension. Tense for 5 s, release for 10 s.'\n  },\n  cn_mind_tag: {\n    ko: '마음챙김',\n    en: 'Mindfulness'\n  },\n  cn_mind_quote: {\n    ko: '\"생각으로 아는 것\"과 \"알아차림으로 아는 것\"은 다릅니다. 오늘은 몸의 신호에 머물러보세요.',\n    en: '\"Knowing by thought\" and \"knowing by awareness\" are different. Stay with the body\\'s signals today.'\n  },\n  cn_ag_tag: {\n    ko: '자율훈련',\n    en: 'Autogenic'\n  },\n  cn_ag_quote: {\n    ko: '\"내 팔이 무겁다\"는 자기암시가 실제 혈류를 변화시킵니다. 조용히 6번 반복해보세요.',\n    en: '\"My arm is heavy\" — that self-suggestion actually changes blood flow. Repeat quietly six times.'\n  },\n  cn_alex_tag: {\n    ko: '감정인식',\n    en: 'Emotion awareness'\n  },\n  cn_alex_quote: {\n    ko: '감정 단어가 떠오르지 않아도 괜찮습니다. 알렉시티미아는 일반인의 10~13%에서 나타납니다.',\n    en: \"It's OK if emotion words don't surface. Alexithymia occurs in roughly 10–13% of the general population.\"\n  },\n  cn_intero_tag: {\n    ko: '내수용감각',\n    en: 'Interoception'\n  },\n  cn_intero_quote: {\n    ko: '심박·호흡·복부 감각 — 이 신호가 감정의 1차 재료입니다. 섬엽이 그 중추예요.',\n    en: 'Heartbeat, breath, gut — these are the raw material of emotion. The insula is their hub.'\n  },\n  cn_hrv_tag: {\n    ko: 'HRV',\n    en: 'HRV'\n  },\n  cn_hrv_quote: {\n    ko: '높은 HRV는 자율신경의 유연성입니다. 매일의 호흡 훈련이 직접 키웁니다.',\n    en: 'High HRV reflects autonomic flexibility. Daily breathing practice directly builds it.'\n  },\n  cn_scale_tag: {\n    ko: '척도',\n    en: 'Scales'\n  },\n  cn_scale_quote: {\n    ko: '이 체크 결과는 임상 평가가 아니라 나의 변화를 보는 거울이에요. 점수보다 방향이 더 중요해요.',\n    en: 'PHQ-9 and GAD-7 are change-tracking tools, not diagnoses. The direction of the score matters most.'\n  },\n  home_cn_prefix: {\n    ko: 'CLINICAL NOTE ·',\n    en: 'CLINICAL NOTE ·'\n  },\n  sl_curriculum: {\n    ko: '8주 커리큘럼',\n    en: '8-week curriculum'\n  },\n  sl_curr_current: {\n    ko: '· 현재 {w}주차',\n    en: '· currently week {w}'\n  },\n  sl_week_unit: {\n    ko: '주',\n    en: 'wk'\n  },\n  sl_all_tech: {\n    ko: '전체 기법',\n    en: 'All techniques'\n  },\n  sd_caption: {\n    ko: '세션 완료',\n    en: 'Session complete'\n  },\n  sd_message: {\n    ko: '잘 하셨습니다.',\n    en: 'Well done.'\n  },\n  sd_home: {\n    ko: '홈으로 돌아가기',\n    en: 'Back to home'\n  },\n  sd_restart: {\n    ko: '다시 하기',\n    en: 'Restart'\n  },\n  br_title: {\n    ko: '복식호흡',\n    en: 'Diaphragmatic Breathing'\n  },\n  br_phase_inhale_label: {\n    ko: '들이쉬세요',\n    en: 'Inhale'\n  },\n  br_phase_inhale_hint: {\n    ko: '코로 천천히',\n    en: 'Slowly through the nose'\n  },\n  br_phase_hold_label: {\n    ko: '멈추세요',\n    en: 'Hold'\n  },\n  br_phase_hold_hint: {\n    ko: '편안하게 유지',\n    en: 'Hold comfortably'\n  },\n  br_phase_exhale_label: {\n    ko: '내쉬세요',\n    en: 'Exhale'\n  },\n  br_phase_exhale_hint: {\n    ko: '입으로 후~',\n    en: 'Through the mouth, soft \"haa\"'\n  },\n  br_ready: {\n    ko: '준비하세요',\n    en: 'Get ready'\n  },\n  br_ready_hint: {\n    ko: '편안한 자세로 앉으세요 · 어지럽거나 불편하면 바로 중단하세요',\n    en: 'Sit comfortably · stop if dizzy or uncomfortable'\n  },\n  br_method: {\n    ko: '4-7-8 호흡법',\n    en: '4-7-8 method'\n  },\n  br_evidence: {\n    ko: '근거: 온라인 호흡 훈련 연구에서 불안 완화에 도움이 될 수 있음이 보고되었습니다. 효과는 개인차가 있으며, 증상이 심하거나 지속되면 전문가 상담이 필요합니다.',\n    en: 'Evidence: an online breathwork study reported it may help reduce anxiety. Effects vary individually; if symptoms are severe or persist, professional consultation is needed.'\n  },\n  br_cycle_unit: {\n    ko: '사이클',\n    en: 'cycle'\n  },\n  br_short_inhale: {\n    ko: '들숨',\n    en: 'Inhale'\n  },\n  br_short_hold: {\n    ko: '멈춤',\n    en: 'Hold'\n  },\n  br_short_exhale: {\n    ko: '날숨',\n    en: 'Exhale'\n  },\n  br_done_cycles: {\n    ko: '완료 사이클',\n    en: 'Cycles completed'\n  },\n  br_done_cnt_unit: {\n    ko: '회',\n    en: ''\n  },\n  ex_total_time: {\n    ko: '총',\n    en: 'Total'\n  },\n  ex_min: {\n    ko: '분',\n    en: 'min'\n  },\n  ex_sec: {\n    ko: '초',\n    en: 's'\n  },\n  ex_session_end: {\n    ko: '중단하고 나가기',\n    en: 'Stop and exit'\n  },\n  ex_session_end_hint: {\n    ko: '완료로 기록되지 않습니다.',\n    en: 'Will not be recorded as completed.'\n  },\n  ex_pause: {\n    ko: '일시정지',\n    en: 'Pause'\n  },\n  ex_resume: {\n    ko: '재개',\n    en: 'Resume'\n  },\n  ex_start: {\n    ko: '시작하기',\n    en: 'Start'\n  },\n  pmr_title: {\n    ko: '점진적 근이완 (PMR)',\n    en: 'Progressive Muscle Relaxation (PMR)'\n  },\n  pmr_short_title: {\n    ko: 'PMR',\n    en: 'PMR'\n  },\n  pmr_evidence: {\n    ko: 'Jacobson 1938 · 2026 메타분석 Level 1',\n    en: 'Jacobson 1938 · 2026 meta-analysis Level 1'\n  },\n  pmr_intro_l1: {\n    ko: '개 근육군을 순서대로',\n    en: 'muscle groups in order — tense'\n  },\n  pmr_intro_l2: {\n    ko: '긴장하고 이완합니다.',\n    en: 'and release.'\n  },\n  pmr_group_caption: {\n    ko: '근육군',\n    en: 'Muscle group'\n  },\n  pmr_tense_label: {\n    ko: '긴장 유지',\n    en: 'Hold tension'\n  },\n  pmr_relax_h: {\n    ko: '이완하세요',\n    en: 'Relax now'\n  },\n  pmr_relax_hint: {\n    ko: '긴장이 녹아내리는 것을 느껴보세요.',\n    en: 'Feel the tension melt away.'\n  },\n  pmr_start_tension: {\n    ko: '긴장 시작',\n    en: 'Start tension'\n  },\n  pmr_holding: {\n    ko: '유지 중...',\n    en: 'Holding...'\n  },\n  pmr_next_group: {\n    ko: '다음 근육군',\n    en: 'Next muscle group'\n  },\n  pmr_done_label: {\n    ko: '완료',\n    en: 'Done'\n  },\n  pmr_done_all: {\n    ko: '개 근육군 순환 완료',\n    en: 'muscle groups completed'\n  },\n  pmr_done_part_a: {\n    ko: '근육군 · 중단',\n    en: 'muscle groups · stopped'\n  },\n  pmr_g_hands_n: {\n    ko: '양손과 팔뚝',\n    en: 'Hands & forearms'\n  },\n  pmr_g_hands_i: {\n    ko: '두 주먹을 꽉 쥐고 5초간 유지한 후 힘을 빼세요.',\n    en: 'Make tight fists, hold for 5 s, then release.'\n  },\n  pmr_g_biceps_n: {\n    ko: '위팔 (이두근)',\n    en: 'Upper arms (biceps)'\n  },\n  pmr_g_biceps_i: {\n    ko: '팔꿈치를 구부려 이두근에 힘을 주고 5초 후 이완하세요.',\n    en: 'Bend your elbows, tense the biceps for 5 s, then release.'\n  },\n  pmr_g_forehead_n: {\n    ko: '이마와 두피',\n    en: 'Forehead & scalp'\n  },\n  pmr_g_forehead_i: {\n    ko: '눈썹을 위로 올려 이마에 주름을 만들고 5초 후 이완하세요.',\n    en: 'Raise your eyebrows to wrinkle the forehead, hold 5 s, then release.'\n  },\n  pmr_g_eyes_n: {\n    ko: '눈과 코',\n    en: 'Eyes & nose'\n  },\n  pmr_g_eyes_i: {\n    ko: '눈을 꽉 감고 코를 찡그려 5초 유지 후 이완하세요.',\n    en: 'Close eyes tightly and scrunch the nose for 5 s, then release.'\n  },\n  pmr_g_jaw_n: {\n    ko: '입과 턱',\n    en: 'Mouth & jaw'\n  },\n  pmr_g_jaw_i: {\n    ko: '이를 지그시 물고 입술을 다물어 5초 후 이완하세요.',\n    en: 'Lightly clench teeth and close lips for 5 s, then release.'\n  },\n  pmr_g_shoulders_n: {\n    ko: '목과 어깨',\n    en: 'Neck & shoulders'\n  },\n  pmr_g_shoulders_i: {\n    ko: '어깨를 귀 쪽으로 올리고 5초 유지 후 이완하세요.',\n    en: 'Raise shoulders toward your ears for 5 s, then release.'\n  },\n  pmr_g_chest_n: {\n    ko: '가슴과 등',\n    en: 'Chest & back'\n  },\n  pmr_g_chest_i: {\n    ko: '숨을 들이마시며 가슴을 내밀고 5초 유지 후 이완하세요.',\n    en: 'Inhale and push the chest forward for 5 s, then release.'\n  },\n  pmr_g_abdomen_n: {\n    ko: '복부',\n    en: 'Abdomen'\n  },\n  pmr_g_abdomen_i: {\n    ko: '배에 힘을 주어 단단하게 만들고 5초 후 이완하세요.',\n    en: 'Tighten your abdomen for 5 s, then release.'\n  },\n  pmr_g_thighs_n: {\n    ko: '허벅지와 엉덩이',\n    en: 'Thighs & glutes'\n  },\n  pmr_g_thighs_i: {\n    ko: '허벅지와 엉덩이 근육에 힘을 주고 5초 후 이완하세요.',\n    en: 'Tense the thigh and glute muscles for 5 s, then release.'\n  },\n  pmr_g_calves_n: {\n    ko: '종아리와 발',\n    en: 'Calves & feet'\n  },\n  pmr_g_calves_i: {\n    ko: '발끝을 무릎 쪽으로 당기며 5초 유지 후 이완하세요.',\n    en: 'Pull your toes toward your knees for 5 s, then release.'\n  },\n  bs_title: {\n    ko: '바디스캔',\n    en: 'Body Scan'\n  },\n  bs_evidence: {\n    ko: 'Track B · 신체 감각 인식 · MBSR 기반',\n    en: 'Track B · body-awareness training · MBSR-based'\n  },\n  bs_intro_l1: {\n    ko: '개 부위를 머리에서',\n    en: 'regions from head'\n  },\n  bs_intro_l2: {\n    ko: '발끝까지 순서대로 관찰합니다.',\n    en: 'to toe, in order.'\n  },\n  bs_region_caption: {\n    ko: '부위',\n    en: 'Region'\n  },\n  bs_b_caption: {\n    ko: '감정 단어가 떠오르지 않아도 괜찮습니다. 이 부위의 신체 감각만 관찰하세요.',\n    en: \"It's OK if emotion words don't come. Just observe the bodily sensation in this region.\"\n  },\n  bs_next_region: {\n    ko: '다음 부위 →',\n    en: 'Next region →'\n  },\n  bs_done_all: {\n    ko: '9개 부위 모두 관찰 완료',\n    en: 'All 9 regions observed'\n  },\n  bs_done_part_a: {\n    ko: '부위 · 중단',\n    en: 'regions · stopped'\n  },\n  bs_r_head_n: {\n    ko: '머리·이마',\n    en: 'Head & forehead'\n  },\n  bs_r_head_g: {\n    ko: '이마와 정수리의 감각에 주의를 기울입니다. 긴장·무거움·따뜻함·저림 — 어떤 느낌이 있나요? 판단하지 말고 그대로 관찰하세요.',\n    en: \"Bring attention to your forehead and crown. Tension, heaviness, warmth, tingling — what's present? Observe without judging.\"\n  },\n  bs_r_face_n: {\n    ko: '눈·얼굴',\n    en: 'Eyes & face'\n  },\n  bs_r_face_g: {\n    ko: '눈 주위와 뺨의 감각을 관찰합니다. 눈꺼풀의 무게, 볼의 온도, 아래턱의 긴장 여부를 느껴보세요.',\n    en: 'Observe the sensations around your eyes and cheeks. Notice eyelid weight, cheek temperature, and any jaw tension.'\n  },\n  bs_r_jawneck_n: {\n    ko: '턱·목',\n    en: 'Jaw & neck'\n  },\n  bs_r_jawneck_g: {\n    ko: '턱과 목 부위를 느낍니다. 이를 악물거나 목이 경직되어 있나요? 그 감각을 있는 그대로 관찰하세요.',\n    en: 'Sense your jaw and neck. Are you clenching, or is your neck stiff? Observe just as it is.'\n  },\n  bs_r_shoulder_n: {\n    ko: '어깨',\n    en: 'Shoulders'\n  },\n  bs_r_shoulder_g: {\n    ko: '어깨의 무게와 긴장을 관찰합니다. 어깨가 귀 쪽으로 올라와 있나요? 의식하지 말고 현재 상태를 느껴보세요.',\n    en: 'Notice the weight and tension in your shoulders. Are they hiked toward your ears? Just feel the current state.'\n  },\n  bs_r_heart_n: {\n    ko: '가슴·심장',\n    en: 'Chest & heart'\n  },\n  bs_r_heart_g: {\n    ko: '가슴 안쪽의 감각과 심장 박동을 느껴봅니다. 숨을 들이쉴 때 가슴이 얼마나 넓어지는지 관찰하세요.',\n    en: 'Sense the inside of your chest and your heartbeat. As you inhale, observe how much your chest expands.'\n  },\n  bs_r_belly_n: {\n    ko: '배·내장',\n    en: 'Belly & viscera'\n  },\n  bs_r_belly_g: {\n    ko: '복부의 감각에 집중합니다. 숨을 쉴 때 배가 오르내리는 것을 느껴보세요. 내장의 따뜻함이나 긴장을 관찰하세요.',\n    en: 'Focus on the sensations in your abdomen. Feel the rise and fall as you breathe. Notice any warmth or tension in your gut.'\n  },\n  bs_r_arms_n: {\n    ko: '팔·손',\n    en: 'Arms & hands'\n  },\n  bs_r_arms_g: {\n    ko: '팔과 손의 감각을 스캔합니다. 손가락 끝의 온도, 맥박, 무거움이나 가벼움을 느껴보세요.',\n    en: 'Scan the sensations in your arms and hands. Notice fingertip temperature, pulse, heaviness or lightness.'\n  },\n  bs_r_hips_n: {\n    ko: '엉덩이·허벅지',\n    en: 'Hips & thighs'\n  },\n  bs_r_hips_g: {\n    ko: '앉아있는 부위와 허벅지의 감각을 느낍니다. 바닥이나 의자와 닿는 압감을 관찰하세요.',\n    en: 'Feel where you are sitting and the sensations in your thighs. Notice the pressure against the floor or chair.'\n  },\n  bs_r_feet_n: {\n    ko: '종아리·발',\n    en: 'Calves & feet'\n  },\n  bs_r_feet_g: {\n    ko: '종아리와 발의 감각을 관찰합니다. 발바닥의 온도, 발가락 끝까지 느껴보세요. 전신을 스캔했습니다.',\n    en: 'Observe the sensations in your calves and feet — soles, toes. The whole body has been scanned.'\n  },\n  ag_title: {\n    ko: '자율훈련법',\n    en: 'Autogenic Training'\n  },\n  ag_evidence: {\n    ko: 'Schultz 1932 · 자율신경 이완 표준 프로토콜',\n    en: 'Schultz 1932 · standard autonomic relaxation protocol'\n  },\n  ag_intro_l1: {\n    ko: '6단계 자기암시를',\n    en: 'Repeat 6 stages of'\n  },\n  ag_intro_l2: {\n    ko: '편안한 자세로',\n    en: 'self-suggestion in a'\n  },\n  ag_intro_l3: {\n    ko: '반복합니다.',\n    en: 'comfortable posture.'\n  },\n  ag_step_caption: {\n    ko: '단계',\n    en: 'Stage'\n  },\n  ag_repeat_hint: {\n    ko: '편안한 자세로, 속으로 5~6회 반복하세요',\n    en: 'In a comfortable posture, repeat silently 5–6 times.'\n  },\n  ag_timer_hint: {\n    ko: '타이머가 끝나기 전에도 다음으로 넘어갈 수 있습니다',\n    en: 'You can move on before the timer ends.'\n  },\n  ag_next_stage: {\n    ko: '다음 단계 →',\n    en: 'Next stage →'\n  },\n  ag_done_all: {\n    ko: '6단계 자기암시 완료',\n    en: 'All 6 self-suggestion stages completed'\n  },\n  ag_done_part_a: {\n    ko: '단계 · 중단',\n    en: 'stages · stopped'\n  },\n  ag_s1_n: {\n    ko: '무거움',\n    en: 'Heaviness'\n  },\n  ag_s1_aff: {\n    ko: '팔과 다리가 무겁다',\n    en: 'My arms and legs feel heavy.'\n  },\n  ag_s2_n: {\n    ko: '따뜻함',\n    en: 'Warmth'\n  },\n  ag_s2_aff: {\n    ko: '팔과 다리가 따뜻하다',\n    en: 'My arms and legs feel warm.'\n  },\n  ag_s3_n: {\n    ko: '심장',\n    en: 'Cardiac'\n  },\n  ag_s3_aff: {\n    ko: '심장이 고요하고 규칙적이다',\n    en: 'My heartbeat is calm and regular.'\n  },\n  ag_s4_n: {\n    ko: '호흡',\n    en: 'Respiration'\n  },\n  ag_s4_aff: {\n    ko: '호흡이 평온하다',\n    en: 'My breathing is peaceful.'\n  },\n  ag_s5_n: {\n    ko: '복부',\n    en: 'Solar plexus'\n  },\n  ag_s5_aff: {\n    ko: '배가 따뜻하다',\n    en: 'My belly feels warm.'\n  },\n  ag_s6_n: {\n    ko: '이마',\n    en: 'Forehead'\n  },\n  ag_s6_aff: {\n    ko: '이마가 시원하다',\n    en: 'My forehead feels cool.'\n  },\n  ag_hint_heavy: {\n    ko: '↓  가라앉는 느낌',\n    en: '↓  Sinking sensation'\n  },\n  ag_hint_warm: {\n    ko: '◌  스며드는 온기',\n    en: '◌  Spreading warmth'\n  },\n  ag_hint_pulse: {\n    ko: '♡  잔잔한 박동',\n    en: '♡  Quiet pulse'\n  },\n  ag_hint_breath: {\n    ko: '∿  부드러운 파도',\n    en: '∿  Gentle wave'\n  },\n  ag_hint_glow: {\n    ko: '☼  명치의 햇살',\n    en: '☼  Sunlit center'\n  },\n  ag_hint_cool: {\n    ko: '❄  시원한 바람',\n    en: '❄  Cool breeze'\n  },\n  phq_q1: {\n    ko: '일을 하는 데 있어 흥미나 재미를 거의 느끼지 못함',\n    en: 'Little interest or pleasure in doing things'\n  },\n  phq_q2: {\n    ko: '가라앉는 느낌, 우울감 혹은 절망감',\n    en: 'Feeling down, depressed, or hopeless'\n  },\n  phq_q3: {\n    ko: '잠이 들거나 계속 잠을 자는 것이 어려움, 또는 잠을 너무 많이 잠',\n    en: 'Trouble falling or staying asleep, or sleeping too much'\n  },\n  phq_q4: {\n    ko: '피곤함, 기력 저하',\n    en: 'Feeling tired or having little energy'\n  },\n  phq_q5: {\n    ko: '식욕 저하 혹은 과식',\n    en: 'Poor appetite or overeating'\n  },\n  phq_q6: {\n    ko: '자신이 실패자라고 느끼거나, 자신과 가족을 실망시켰다고 느낌',\n    en: 'Feeling bad about yourself — or that you are a failure or have let yourself or your family down'\n  },\n  phq_q7: {\n    ko: '신문을 읽거나 TV를 보는 것과 같은 일상적인 일에 집중하기 어려움',\n    en: 'Trouble concentrating on things, such as reading the newspaper or watching television'\n  },\n  phq_q8: {\n    ko: '다른 사람들이 알아챌 정도로 평소보다 말과 행동이 느려짐, 또는 반대로 너무 안절부절못해서 가만히 앉아 있을 수 없음',\n    en: 'Moving or speaking so slowly that other people could have noticed; or the opposite — being so fidgety or restless that you have been moving around a lot more than usual'\n  },\n  phq_q9: {\n    ko: '자신이 죽는 것이 더 낫다고 생각하거나 어떤 식으로든 자신을 해치려 한다고 생각함',\n    en: 'Thoughts that you would be better off dead or of hurting yourself in some way'\n  },\n  gad_q1: {\n    ko: '초조하거나 불안하거나 조마조마하게 느낀다',\n    en: 'Feeling nervous, anxious, or on edge'\n  },\n  gad_q2: {\n    ko: '걱정하는 것을 멈추거나 조절할 수가 없다',\n    en: 'Not being able to stop or control worrying'\n  },\n  gad_q3: {\n    ko: '여러 가지 것들에 대해 걱정을 너무 많이 한다',\n    en: 'Worrying too much about different things'\n  },\n  gad_q4: {\n    ko: '편하게 있기가 어렵다',\n    en: 'Trouble relaxing'\n  },\n  gad_q5: {\n    ko: '너무 안절부절못해서 가만히 있기가 힘들다',\n    en: \"Being so restless that it's hard to sit still\"\n  },\n  gad_q6: {\n    ko: '쉽게 짜증이 나거나 쉽게 성을 낸다',\n    en: 'Becoming easily annoyed or irritable'\n  },\n  gad_q7: {\n    ko: '마치 끔찍한 일이 생길 것처럼 두렵게 느껴진다',\n    en: 'Feeling afraid as if something awful might happen'\n  },\n  pss_q1: {\n    ko: '예상치 못한 일 때문에 당황한 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you been upset because of something that happened unexpectedly?'\n  },\n  pss_q2: {\n    ko: '인생에서 중요한 일을 통제할 수 없다고 느낀 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you felt that you were unable to control the important things in your life?'\n  },\n  pss_q3: {\n    ko: '신경이 곤두서거나 스트레스를 받는다고 느낀 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you felt nervous and stressed?'\n  },\n  pss_q4: {\n    ko: '개인적인 문제를 처리하는 자신의 능력에 대해 자신감을 가진 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you felt confident about your ability to handle your personal problems?'\n  },\n  pss_q5: {\n    ko: '일이 자신의 뜻대로 진행되고 있다고 느낀 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you felt that things were going your way?'\n  },\n  pss_q6: {\n    ko: '자신이 해야 하는 모든 일에 대처할 수 없다고 느낀 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you found that you could not cope with all the things you had to do?'\n  },\n  pss_q7: {\n    ko: '일상생활에서의 짜증을 잘 다스릴 수 있었던 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you been able to control irritations in your life?'\n  },\n  pss_q8: {\n    ko: '자신이 일을 잘 해내고 있다고 느낀 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you felt that you were on top of things?'\n  },\n  pss_q9: {\n    ko: '자신의 통제 밖의 일 때문에 화가 난 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you been angered because of things that were outside of your control?'\n  },\n  pss_q10: {\n    ko: '어려움이 너무 많이 쌓여서 극복할 수 없다고 느낀 적이 얼마나 자주 있었습니까?',\n    en: 'How often have you felt difficulties were piling up so high that you could not overcome them?'\n  },\n  wa_period_2w: {\n    ko: '지난 2주 동안',\n    en: 'Over the past 2 weeks'\n  },\n  wa_period_month: {\n    ko: '지난 한 달 동안',\n    en: 'Over the past month'\n  },\n  wa_intro_caption_2w: {\n    ko: '지난 2주 동안의 상태를 체크합니다 · 소요 1~2분',\n    en: \"Check in on how you've been
