<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef4df">
  <title>Relax Routine v3.7 — DH Mind Clinic</title>
  <style>
    :root{
      --bg:#f6f5ee;--paper:#fffef8;--paper2:#f2eadc;--ink:#17230f;--muted:#5c6954;--line:rgba(71,94,44,.16);
      --brand:#b9e761;--brand2:#88bd35;--accent:#d79b45;--shadow:0 18px 42px rgba(45,64,25,.12);
      --danger:#a44b3c;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:flex;justify-content:center}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .phone{width:min(430px,100vw);min-height:100dvh;background:linear-gradient(180deg,#fbfaf3 0%,#edf4df 100%);box-shadow:0 24px 80px rgba(20,35,18,.13);position:relative;overflow:hidden}.scroll{height:calc(100dvh - 98px - var(--safe-bottom));overflow:auto;padding:calc(20px + var(--safe-top)) 16px 28px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
    .eyebrow{font-size:12px;font-weight:950;letter-spacing:.12em;color:#61734b;text-transform:uppercase}.home-title{font-size:31px;line-height:1.05;letter-spacing:-.065em;margin:8px 0}.sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5;word-break:keep-all}.section-label{display:block;font-size:12px;color:#6b785f;font-weight:950;letter-spacing:.04em;margin:18px 0 8px}.foot{font-size:12px;line-height:1.45;color:#728069;margin:16px 2px 0;word-break:keep-all}
    .reco,.panel,.info-card,.setting-card{border:1px solid var(--line);background:var(--paper);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.reco small{display:block;font-size:12px;color:#6b785f;font-weight:950;letter-spacing:.04em;margin-bottom:8px}.reco h2,.panel h2,.info-card h2,.setting-card h2{margin:0;font-size:22px;letter-spacing:-.04em}.reco p,.panel p,.info-card p,.setting-card p{margin:7px 0 14px;color:#55624d;font-size:14px;line-height:1.5;word-break:keep-all}
    .primary,.main{width:100%;min-height:56px;border:0;border-radius:19px;background:var(--brand);color:#17240f;font-weight:950;font-size:17px;box-shadow:0 10px 22px rgba(90,128,30,.22)}.secondary{width:100%;min-height:50px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.72);color:#31402a;font-weight:900;font-size:15px}.grid{display:grid;gap:10px;margin-top:8px}.card{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:23px;background:rgba(255,255,255,.80);padding:14px 13px;color:var(--ink);min-height:76px;box-shadow:0 8px 20px rgba(45,64,25,.055)}.card .icon{width:44px;height:44px;border-radius:17px;background:#edf5d8;display:grid;place-items:center;font-size:23px}.card b{display:block;font-size:16px;letter-spacing:-.03em}.card span span{display:block;margin-top:3px;color:#68755d;font-size:13px;line-height:1.3}.card.active{outline:2px solid rgba(136,189,53,.35);background:#fffef8}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top button{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.72);padding:9px 12px;font-weight:900;color:#31402a}.hero{display:flex;gap:14px;align-items:center;margin-bottom:18px}.big{font-size:44px;line-height:1}.progress{height:10px;background:#e7ecd8;border-radius:99px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;transition:.25s}.step{border-radius:24px;background:linear-gradient(135deg,#f7f4e8,#eaf2da);padding:20px;margin:14px 0;min-height:132px}.step small{display:block;font-size:12px;font-weight:950;letter-spacing:.08em;color:#7a875f;margin-bottom:9px}.step b{font-size:22px;line-height:1.32;letter-spacing:-.04em;word-break:keep-all}.actions{display:grid;gap:10px}.complete{display:none;margin-top:14px;border-radius:22px;background:#edf6da;border:1px solid rgba(136,189,53,.35);padding:15px}.complete.show{display:block}.complete b{display:block;font-size:18px;margin-bottom:4px}.complete p{margin:0 0 12px}
    .tabbar{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));height:76px;background:#fffef8;border:1px solid rgba(71,94,44,.18);border-radius:27px;box-shadow:0 14px 34px rgba(30,46,20,.14);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;z-index:20}.tabbar button{border:0;border-radius:20px;background:transparent;color:#637057;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tabbar button .tab-ico{font-size:19px}.tabbar button.active{background:#edf5d8;color:#17230f}.tabbar button:focus-visible,.card:focus-visible,.primary:focus-visible,.secondary:focus-visible,.main:focus-visible{outline:3px solid rgba(136,189,53,.45);outline-offset:2px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border-radius:20px;background:rgba(255,255,255,.72);border:1px solid var(--line);padding:12px;text-align:center}.metric b{display:block;font-size:22px}.metric span{font-size:11px;color:#65725d;font-weight:800}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.70);padding:14px;margin-top:10px}.switch{width:54px;height:32px;border-radius:99px;background:#d9dec9;position:relative;flex:0 0 auto}.switch::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;left:3px;top:3px;box-shadow:0 2px 8px rgba(0,0,0,.14)}.switch.on{background:var(--brand2)}.switch.on::after{left:25px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.75);padding:8px 11px;font-size:13px;font-weight:850;color:#44513b}
    .pmr-title{font-size:30px;line-height:1.08;letter-spacing:-.06em;margin:6px 0 8px}.modebar,.durations{display:flex;gap:8px;margin:10px 0}.modebar button,.durations button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.78);border-radius:15px;min-height:42px;font-weight:900;color:#42513a}.modebar button.on,.durations button.on{background:#e6f4c6;border-color:rgba(136,189,53,.45);color:#17230f}.bodymap{position:relative;min-height:360px;border-radius:30px;background:radial-gradient(circle at 50% 36%,#fff 0,#f1f5e5 44%,#e5ecd5 100%);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin:14px 0}.timer{position:absolute;top:16px;left:18px;font-size:26px;font-weight:950;letter-spacing:-.04em}.badge{position:absolute;top:18px;right:18px;border-radius:999px;background:#f5d08b;color:#3e2b0f;padding:8px 12px;font-size:13px;font-weight:950}.badge.relax{background:#cce8f7;color:#153344}.orb-wrap{position:absolute;inset:76px 0 auto;display:grid;place-items:center}.orb{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle,#fff 0,#b9e761 45%,#78a92e 100%);box-shadow:0 0 36px rgba(136,189,53,.42);animation:grow 5s linear infinite}.orb.relax{animation:shrink 10s linear infinite;background:radial-gradient(circle,#fff 0,#b7dff2 45%,#5f9dbb 100%)}.orb-text{position:absolute;top:108px;left:50%;transform:translateX(-50%);text-align:center;font-weight:950;font-size:18px;line-height:1.15;color:#17230f}.figure{position:absolute;left:50%;bottom:78px;width:150px;height:154px;transform:translateX(-50%)}.part{position:absolute;display:block;background:#bec9af;border:2px solid rgba(50,70,35,.18);transition:.2s}.head{width:36px;height:36px;border-radius:50%;left:57px;top:0}.jaw{width:42px;height:22px;border-radius:0 0 24px 24px;left:54px;top:27px}.torso{width:62px;height:74px;border-radius:28px 28px 22px 22px;left:44px;top:45px}.arm{width:26px;height:82px;border-radius:18px;top:48px}.arm.l{left:18px;transform:rotate(14deg)}.arm.r{right:18px;transform:rotate(-14deg)}.leg{width:28px;height:70px;border-radius:20px;top:110px}.leg.l{left:46px}.leg.r{right:46px}.glow{background:#b9e761;box-shadow:0 0 20px rgba(136,189,53,.7)}.phase{position:absolute;left:16px;right:16px;bottom:15px;border-radius:20px;background:rgba(255,254,248,.86);padding:13px 14px}.phase b{display:block;font-size:17px;margin-bottom:3px}.phase span{font-size:13px;line-height:1.4;color:#55624d}.pmr-cta{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--brand);font-size:17px;font-weight:950}.pmr-cta.secondary{margin-top:8px;background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:none}.safe{font-size:12px;line-height:1.45;color:#65725d;margin:10px 2px 0;word-break:keep-all}@keyframes grow{from{transform:scale(.74)}to{transform:scale(1.24)}}@keyframes shrink{from{transform:scale(1.24)}to{transform:scale(.74)}}

    /* v3.7 routine-specific restorations */
    .breath-shell .home-title{font-size:27px;margin:5px 0}.breath-shell .sub{font-size:13px;line-height:1.38;margin-bottom:10px}
    .breath-shell .breath-stage{position:relative;min-height:238px;border-radius:30px;background:radial-gradient(circle at 50% 42%,#ffffff 0,#eef7db 46%,#dfead0 100%);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin:10px 0 10px;padding:14px;text-align:center}
    .breath-sky{position:absolute;inset:0;background:radial-gradient(circle at 24% 18%,rgba(255,255,255,.85),transparent 24%),radial-gradient(circle at 82% 26%,rgba(185,231,97,.26),transparent 28%)}
    .breath-balloon-wrap{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:170px;height:170px;display:grid;place-items:center}
    .breath-balloon{width:86px;height:104px;border-radius:58% 58% 54% 54%;background:radial-gradient(circle at 34% 24%,#fff 0 10%,#dff59a 20%,#9dd342 68%,#75a72d 100%);box-shadow:0 22px 48px rgba(110,150,45,.26);animation:breathBalloon 8s ease-in-out infinite;transform-origin:50% 82%}
    .breath-balloon::after{content:"";position:absolute;width:2px;height:44px;background:rgba(61,77,46,.32);left:50%;top:66%;transform:translateX(-50%)}
    .breath-phase{position:absolute;left:14px;right:14px;bottom:12px;border-radius:22px;background:rgba(255,254,248,.92);border:1px solid var(--line);padding:11px 12px;text-align:left;box-shadow:0 10px 24px rgba(45,64,25,.08)}
    .breath-phase b,.autogenic-card b{display:block;font-size:20px;letter-spacing:-.04em}.breath-phase span,.autogenic-card span{display:block;margin-top:6px;color:#5d6a55;font-size:14px;line-height:1.45;word-break:keep-all}
    .breath-count{position:absolute;top:18px;right:18px;border-radius:999px;background:#fffef8;border:1px solid var(--line);padding:8px 12px;font-weight:950;color:#31402a}.breath-cue{position:absolute;top:18px;left:18px;font-size:12px;font-weight:950;letter-spacing:.10em;color:#61734b}
    @keyframes breathBalloon{0%,100%{transform:scale(.78) translateY(24px)}37.5%{transform:scale(1.18) translateY(-10px)}50%{transform:scale(1.18) translateY(-10px)}87.5%{transform:scale(.78) translateY(24px)}}
    @media (max-height:700px){.breath-shell .breath-stage{min-height:122px}.breath-balloon-wrap{top:46%;width:110px;height:92px}.breath-balloon{width:52px;height:64px}.breath-phase{display:none}.breath-cue{font-size:10px}.breath-count{top:12px;right:12px;padding:6px 9px;font-size:12px}}
    .autogenic-shell .auto-stage{display:grid;gap:12px;margin-top:12px}.autogenic-card{border:1px solid var(--line);border-radius:25px;background:rgba(255,255,255,.76);padding:16px;box-shadow:0 8px 20px rgba(45,64,25,.055)}
    .autogenic-card.active{background:#fffef8;outline:2px solid rgba(136,189,53,.35)}.autogenic-word{font-size:30px;line-height:1.12;letter-spacing:-.06em;margin:12px 0;color:#24341d}.autogenic-meter{height:12px;border-radius:999px;background:#e7ecd8;overflow:hidden}.autogenic-meter span{display:block;height:100%;width:25%;border-radius:999px;background:linear-gradient(90deg,#b9e761,#88bd35);transition:.25s}

  </style>
</head>
<body data-app="relax-routine" data-version="3.7" data-safety-state="advisory">
  <main id="app" class="phone" aria-live="polite"></main>
  <script>
  (()=>{
    const VERSION='v3.7';
    const STORAGE='relax-routine-v37-mobile-state';
    const app=document.getElementById('app');
    const routines=[
      {key:'breath',label:'복식호흡',short:'호흡을 길게 내쉬며 급한 긴장을 낮춥니다',meta:'1분 · 급한 긴장 낮추기',emoji:'🌬️',steps:['자세를 편하게 잡고 한 손을 배 위에 둡니다','코로 들이마시고 입으로 더 길게 내쉽니다','어깨 힘을 빼고 마지막 3회만 반복합니다']},
      {key:'pmr',label:'점진적 근육이완',short:'힘주기 5초, 놓기 10초를 시각 피드백으로 따라갑니다',meta:'7분 · 몸 긴장 풀기',emoji:'🫳'},
      {key:'bodyscan',label:'바디스캔',short:'생각보다 몸 감각을 먼저 훑습니다',meta:'7분 · 감각 알아차리기',emoji:'🧭',steps:['발바닥과 다리의 닿는 느낌을 확인합니다','배와 가슴의 움직임을 평가하지 않고 관찰합니다','턱, 어깨, 손의 긴장을 한 번씩 내려놓습니다']},
      {key:'autogenic',label:'자율훈련',short:'무거움과 따뜻함의 문장을 짧게 반복합니다',meta:'6분 · 조용히 안정하기',emoji:'🌙',steps:['양팔이 무겁다는 문장을 조용히 반복합니다','손과 복부가 따뜻해지는 느낌을 찾습니다','마지막에는 눈을 뜨기 전 손가락을 움직입니다']}
    ];
    const pmrSeq=[
      {target:'jaw',label:'얼굴·턱',tense:'눈썹과 입 주변에 아주 약하게 힘을 줍니다',relax:'이마, 눈가, 턱이 아래로 풀리는 느낌을 봅니다',safety:'이를 악물지 않습니다. 턱관절 통증이 있으면 힘주지 않습니다.'},
      {target:'torso',label:'어깨·목',tense:'어깨를 귀 쪽으로 아주 조금 올립니다',relax:'어깨가 아래로 내려가며 목 주변이 느슨해지는 느낌을 봅니다',safety:'목 통증이나 어지러움이 있으면 감각만 봅니다.'},
      {target:'arm',label:'팔·손',tense:'양손을 가볍게 쥐고 팔의 힘을 느낍니다',relax:'손가락이 펴지고 팔이 무거워지는 느낌을 봅니다',safety:'저림이나 손목 통증이 있으면 주먹을 쥐지 않습니다.'},
      {target:'torso',label:'가슴·복부',tense:'복부를 살짝 단단하게 만들되 숨은 계속 쉽니다',relax:'내쉬면서 배와 가슴 앞쪽이 부드러워지는 느낌을 봅니다',safety:'호흡을 참거나 가슴을 세게 조이지 않습니다.'},
      {target:'leg',label:'다리·발',tense:'발끝을 몸 쪽으로 살짝 당기며 다리 힘을 느낍니다',relax:'종아리와 발바닥의 힘이 바닥으로 빠지는 느낌을 봅니다',safety:'쥐가 잘 나거나 통증이 있으면 움직임 없이 감각만 봅니다.'}
    ];
    let pmr={mode:'day',minutes:7,step:0,phase:'tension',left:5,running:false,elapsed:0,timer:null};
    function read(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(_){return {}}}
    function write(next){localStorage.setItem(STORAGE,JSON.stringify({...read(),...next,updatedAt:new Date().toISOString()}));}
    function route(){return (location.hash||'#home').replace('#','')||'home'}
    function setRoute(r){if(route()!==r) location.hash=r; else render();}
    function recommended(){const hist=read().routineHistory||[];const counts=Object.fromEntries(routines.map(r=>[r.key,0]));hist.forEach(x=>routines.forEach(r=>{if((x.label||'').includes(r.label))counts[r.key]++}));return routines.slice().sort((a,b)=>counts[a.key]-counts[b.key])[0]||routines[0];}
    function stats(){const hist=read().routineHistory||[];const d=new Set(hist.map(x=>(x.at||'').slice(0,10)).filter(Boolean));return {count:hist.length,days:d.size,last:hist[hist.length-1]?.label||'아직 없음'};}
    function isTab(r){return ['home','sessions','info','settings'].includes(r)}
    function tabbar(active=route()){return `<nav class="tabbar" aria-label="주요 화면"><button type="button" data-tab="home" class="${active==='home'?'active':''}"><span class="tab-ico">🏠</span><span>홈</span></button><button type="button" data-tab="sessions" class="${active==='sessions'?'active':''}"><span class="tab-ico">🧘</span><span>세션</span></button><button type="button" data-tab="info" class="${active==='info'?'active':''}"><span class="tab-ico">ℹ️</span><span>정보</span></button><button type="button" data-tab="settings" class="${active==='settings'?'active':''}"><span class="tab-ico">⚙️</span><span>설정</span></button></nav>`}
    function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setRoute(b.dataset.tab));}
    function shell(cls,inner,active){app.className='phone '+(cls||'');app.innerHTML=inner+tabbar(active);document.title='Relax Routine v3.7 — DH Mind Clinic';window.__RELAX_ROADMAP_VERSION__=VERSION;document.body.dataset.version='3.7';bindTabs();}
    function bindStarts(){document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>openRoutine(b.dataset.start));}
    function home(){const rec=recommended();const st=stats();shell('',`<section id="relax-v37-home" class="scroll"><div class="eyebrow">RELAX ROUTINE · v3.7</div><h1 class="home-title">오늘 필요한 이완을<br>하나 고르고 바로 실행</h1><p class="sub">첫 화면은 빠른 실행을 담당하고, 하단 탭에서 홈·세션·정보·설정 화면으로 언제든 이동합니다. 복식호흡은 풍선 피드백, PMR은 단일 업그레이드 화면으로 실행합니다.</p><article class="reco"><small>오늘 추천</small><h2>${rec.emoji} ${rec.label}</h2><p>${rec.short}</p><button class="primary" type="button" data-start="${rec.key}">오늘 추천 시작</button></article><div class="metrics"><div class="metric"><b>${st.count}</b><span>완료 기록</span></div><div class="metric"><b>${st.days}</b><span>수행일</span></div><div class="metric"><b>${st.last}</b><span>최근 세션</span></div></div><span class="section-label">직접 고르기</span><div class="grid">${routines.map(r=>`<button class="card" type="button" data-start="${r.key}"><span class="icon">${r.emoji}</span><span><b>${r.label}</b><span>${r.meta}</span></span></button>`).join('')}</div><p class="foot">완료 전에는 기록하지 않습니다. 통증·어지러움·불편감이 있으면 중단합니다.</p></section>`,'home');bindStarts();}
    function sessions(){const hist=(read().routineHistory||[]).slice(-5).reverse();shell('',`<section id="rr-v37-sessions" class="scroll"><div class="eyebrow">SESSIONS</div><h1 class="home-title">세션 선택과<br>최근 기록</h1><p class="sub">홈 추천과 별개로 모든 루틴을 같은 구조에서 다시 시작할 수 있습니다.</p><div class="grid">${routines.map(r=>`<button class="card" type="button" data-start="${r.key}"><span class="icon">${r.emoji}</span><span><b>${r.label}</b><span>${r.short}</span></span></button>`).join('')}</div><span class="section-label">최근 완료</span><article class="panel">${hist.length?hist.map(x=>`<p><b>${x.label}</b><br><span>${new Date(x.at).toLocaleString('ko-KR')}</span></p>`).join(''):'<p>아직 완료 기록이 없습니다.</p>'}</article></section>`,'sessions');bindStarts();}
    function info(){shell('',`<section id="rr-v37-info" class="scroll"><div class="eyebrow">INFO</div><h1 class="home-title">앱 사용 원칙</h1><article class="info-card"><h2>짧게, 안전하게, 반복 가능하게</h2><p>Relax Routine은 긴 설명보다 바로 실행 가능한 루틴을 우선합니다. 세션은 기록보다 경험을 먼저 만들고, 완료 시에만 저장합니다.</p><div class="chips"><span class="chip">PMR 5초 긴장</span><span class="chip">10초 이완</span><span class="chip">복식호흡 풍선</span></div></article><article class="info-card"><h2>중단 기준</h2><p>통증, 저림, 어지러움, 숨참이 생기면 힘주기를 멈추고 감각 관찰만 하거나 세션을 종료합니다.</p></article></section>`,'info');}
    function settings(){const st=read();shell('',`<section id="rr-v37-settings" class="scroll"><div class="eyebrow">SETTINGS</div><h1 class="home-title">설정</h1><article class="setting-card"><h2>세션 방식</h2><p>현재는 출시 전 프로토타입입니다. 설정은 화면 접근성과 상태 보존 흐름을 검증하기 위한 항목입니다.</p><div class="toggle-row"><div><b>완료 후 하단 탭 유지</b><p>세션 완료 후 홈·세션·정보·설정으로 이동 가능</p></div><span class="switch on"></span></div><div class="toggle-row"><div><b>PMR 통합 화면</b><p>홈, 세션 목록, 직접 해시 진입 모두 동일한 PMR 사용</p></div><span class="switch on"></span></div><button class="secondary" type="button" data-reset>기록 초기화</button></article></section>`,'settings');document.querySelector('[data-reset]').onclick=()=>{localStorage.removeItem(STORAGE);setRoute('home')}}
    function openRoutine(key){const r=routines.find(x=>x.key===key)||recommended();write({lastStarted:new Date().toISOString(),recommendedRoutine:r.label,lastRecommendedKey:r.key,activeSession:true,productFlow:'home-tabs-select-execute-complete'});if(r.key==='pmr'){setRoute('pmr');return;}if(r.key==='breath'){setRoute('breath');return;}if(r.key==='autogenic'){setRoute('autogenic');return;}setRoute('session-'+r.key);}
    function session(key){const r=routines.find(x=>x.key===key)||routines[0];let idx=Number(read()['idx-'+key]||0);const steps=r.steps||[];shell('session',`<section id="rr-v37-session" class="scroll"><div class="top"><button type="button" data-home>← 홈</button><span class="eyebrow">${r.label} · 실행</span></div><article class="panel"><div class="hero"><span class="big">${r.emoji}</span><div><h2>${r.label}</h2><p>${r.short}</p></div></div><div class="progress"><span data-progress></span></div><div class="step"><small data-count></small><b data-text></b></div><div class="actions"><button type="button" class="main" data-next>다음 단계</button><button type="button" class="secondary" data-complete>완료 저장</button><button type="button" class="secondary" data-stop>중단</button></div><div class="complete" data-complete-card><b>오늘 세션 완료</b><p>기록을 저장했습니다. 아래 탭으로 홈·세션·정보·설정 화면에 바로 접근할 수 있습니다.</p><button type="button" class="secondary" data-to-sessions>세션 목록 보기</button></div></article></section>`,'sessions');const update=()=>{document.querySelector('[data-count]').textContent=`STEP ${idx+1} / ${steps.length}`;document.querySelector('[data-text]').textContent=steps[idx];document.querySelector('[data-progress]').style.width=`${Math.round((idx+1)/steps.length*100)}%`;document.querySelector('[data-next]').textContent=idx>=steps.length-1?'완료 저장':'다음 단계';write({['idx-'+key]:idx});};const complete=()=>{document.querySelector('[data-complete-card]').classList.add('show');write({activeSession:false,completedAt:new Date().toISOString(),lastSession:r.label,routineHistory:[...(read().routineHistory||[]),{label:r.label,at:new Date().toISOString(),version:VERSION}].slice(-50)});};document.querySelector('[data-home]').onclick=()=>setRoute('home');document.querySelector('[data-stop]').onclick=()=>{write({activeSession:false,stoppedAt:new Date().toISOString()});setRoute('home')};document.querySelector('[data-complete]').onclick=complete;document.querySelector('[data-to-sessions]').onclick=()=>setRoute('sessions');document.querySelector('[data-next]').onclick=()=>{if(idx<steps.length-1){idx++;update()}else complete()};update();}

    function breathScreen(){shell('session breath-shell',`<section id="rr-v37-breath" class="scroll breath-shell"><div class="top"><button type="button" data-home>← 홈</button><span class="eyebrow">복식호흡 · 풍선 피드백</span></div><h1 class="home-title">풍선이 커지고 작아지는<br>속도에 맞춰 호흡</h1><p class="sub">4초 들이마시고, 6초 길게 내쉽니다. 배 위 손이 풍선처럼 부풀었다가 천천히 내려오는 느낌만 확인합니다.</p><div class="actions breath-actions"><button class="main" id="breathToggle" type="button">호흡 시작</button><button class="secondary" id="breathComplete" type="button">완료 저장</button><button class="secondary" data-stop type="button">중단</button></div><div class="breath-stage" aria-label="복식호흡 풍선 애니메이션"><div class="breath-sky"></div><div class="breath-cue">BELLY BREATHING</div><div class="breath-count" id="breathCount">들이마시기 4</div><div class="breath-balloon-wrap"><div class="breath-balloon" id="breathBalloon"></div></div><div class="breath-phase"><b id="breathTitle">코로 들이마시기</b><span id="breathText">어깨를 올리지 말고 배가 손을 밀어내는 정도만 봅니다.</span></div></div><p class="foot">숨참, 어지러움, 답답함이 있으면 즉시 멈추고 평소 호흡으로 돌아옵니다.</p></section>`,'sessions');let running=false,timer=null,tick=0;const phases=[{name:'들이마시기',left:4,title:'코로 들이마시기',text:'배 위 손이 앞으로 밀려 나오는 느낌을 봅니다.'},{name:'내쉬기',left:6,title:'입으로 길게 내쉬기',text:'풍선이 천천히 작아지듯 배와 어깨의 힘을 내려놓습니다.'}];function paint(){const total=tick%10;const p=total<4?{...phases[0],left:4-total}:{...phases[1],left:10-total};document.getElementById('breathCount').textContent=`${p.name} ${p.left}`;document.getElementById('breathTitle').textContent=p.title;document.getElementById('breathText').textContent=p.text;}function stop(){if(timer)clearInterval(timer);timer=null;running=false;document.getElementById('breathToggle').textContent='호흡 시작'}document.querySelector('[data-home]').onclick=()=>{stop();setRoute('home')};document.querySelector('[data-stop]').onclick=()=>{stop();write({activeSession:false,stoppedAt:new Date().toISOString()});setRoute('home')};document.getElementById('breathToggle').onclick=()=>{running=!running;if(running){document.getElementById('breathToggle').textContent='일시정지';paint();timer=setInterval(()=>{tick++;paint()},1000)}else stop()};document.getElementById('breathComplete').onclick=()=>{stop();write({activeSession:false,lastSession:'복식호흡',routineHistory:[...(read().routineHistory||[]),{label:'복식호흡',at:new Date().toISOString(),version:VERSION}].slice(-50)});document.getElementById('breathTitle').textContent='복식호흡 완료';document.getElementById('breathText').textContent='기록을 저장했습니다. 아래 탭으로 다른 화면에 이동할 수 있습니다.'};paint();}
    function autogenicScreen(){const items=[['무거움','오른팔과 왼팔이 편안하게 무겁다','힘을 주는 문장이 아니라 내려놓는 문장입니다.'],['따뜻함','양손과 복부가 은근히 따뜻하다','실제 온도 변화가 없어도 따뜻함을 떠올리는 정도면 충분합니다.'],['호흡','호흡은 스스로 조용히 이어진다','억지로 조절하지 않고 자동으로 이어지는 리듬을 관찰합니다.'],['이마','이마가 서늘하고 맑다','마지막에 손가락을 움직이고 눈을 천천히 뜹니다.']];let idx=Number(read()['idx-autogenic-v37']||0);shell('session autogenic-shell',`<section id="rr-v37-autogenic" class="scroll autogenic-shell"><div class="top"><button type="button" data-home>← 홈</button><span class="eyebrow">자율훈련 · 표준 문장</span></div><h1 class="home-title">무거움·따뜻함·호흡을<br>짧은 문장으로 반복</h1><p class="sub">심상이나 수면 유도 화면이 아니라, 자율훈련의 기본 공식에 맞춘 짧은 자기암시 루틴입니다.</p><article class="panel"><div class="autogenic-word" id="autoWord"></div><div class="autogenic-meter"><span id="autoMeter"></span></div><div class="auto-stage">${items.map((x,i)=>`<div class="autogenic-card" data-auto-card="${i}"><b>${x[0]}</b><span>${x[1]}<br>${x[2]}</span></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="main" id="autoNext" type="button">다음 문장</button><button class="secondary" id="autoComplete" type="button">완료 저장</button><button class="secondary" data-stop type="button">중단</button></div></article></section>`,'sessions');function paint(){document.getElementById('autoWord').textContent=items[idx][1];document.getElementById('autoMeter').style.width=`${Math.round((idx+1)/items.length*100)}%`;document.querySelectorAll('[data-auto-card]').forEach((c,i)=>c.classList.toggle('active',i===idx));document.getElementById('autoNext').textContent=idx>=items.length-1?'처음으로':'다음 문장';write({['idx-autogenic-v37']:idx});}function complete(){write({activeSession:false,lastSession:'자율훈련',routineHistory:[...(read().routineHistory||[]),{label:'자율훈련',at:new Date().toISOString(),version:VERSION}].slice(-50)});document.getElementById('autoWord').textContent='자율훈련 완료';}document.querySelector('[data-home]').onclick=()=>setRoute('home');document.querySelector('[data-stop]').onclick=()=>{write({activeSession:false,stoppedAt:new Date().toISOString()});setRoute('home')};document.getElementById('autoNext').onclick=()=>{idx=(idx+1)%items.length;paint()};document.getElementById('autoComplete').onclick=complete;paint();}

    function pmrScreen(){clearInterval(pmr.timer);pmr={...pmr,step:0,phase:'tension',left:5,running:false,elapsed:0,timer:null};shell('pmr',`<section id="rr-pmr-v3" class="scroll pmr-shell rr-v37-unified" aria-label="Relax Routine v3.7 PMR unified module"><div class="top"><button type="button" data-home>← 홈</button><span class="eyebrow">RELAX ROUTINE · PMR 통합 실행</span></div><h1 class="pmr-title">몸에 들어간 힘을<br>천천히 풀기</h1><p class="sub">5초 긴장하면 원이 커지고, 10초 이완하면 원이 줄어듭니다. 하단 탭은 유지되어 세션 후 다른 화면으로 바로 이동할 수 있습니다.</p><div class="durations"><button data-min="3">3분</button><button data-min="7" class="on">7분</button><button data-min="12">12분</button></div><div class="bodymap"><div class="timer" id="timer">07:00</div><div class="badge" id="badge">긴장 5초</div><div class="orb-wrap"><div class="orb tension" id="orb"></div></div><div class="orb-text" id="orbText">힘주기<br>5</div><div class="figure"><i class="part head" data-p="head"></i><i class="part jaw glow" data-p="jaw"></i><i class="part torso" data-p="torso"></i><i class="part arm l" data-p="arm"></i><i class="part arm r" data-p="arm"></i><i class="part leg l" data-p="leg"></i><i class="part leg r" data-p="leg"></i></div><div class="phase"><b id="phaseTitle"></b><span id="phaseText"></span></div></div><button class="pmr-cta" id="pmrPrimary" type="button">7분 시작</button><button class="pmr-cta secondary" id="pmrSkip" type="button">이 근육군 건너뛰기</button><p class="safe" id="safe">통증·저림·어지러움이 있으면 힘주기 대신 감각만 알아차립니다.</p></section>`,'sessions');window.openRelaxPmrV3=()=>setRoute('pmr');document.querySelector('[data-home]').onclick=()=>{clearInterval(pmr.timer);setRoute('home')};document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{pmr.minutes=Number(b.dataset.min);document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('on',x===b));renderPmr()});document.getElementById('pmrPrimary').onclick=()=>pmr.running?nextPmr():startPmr();document.getElementById('pmrSkip').onclick=nextPmr;renderPmr();}
    function cur(){return pmrSeq[pmr.step%pmrSeq.length]}function restartOrb(){const o=document.getElementById('orb');if(!o)return;o.className='orb '+(pmr.phase==='tension'?'tension':'relax');void o.offsetWidth;o.className='orb '+(pmr.phase==='tension'?'tension':'relax')}function renderPmr(){if(!document.getElementById('timer'))return;const item=cur(),isT=pmr.phase==='tension';document.getElementById('timer').textContent=String(Math.max(0,Math.floor((pmr.minutes*60-pmr.elapsed)/60))).padStart(2,'0')+':'+String(Math.max(0,(pmr.minutes*60-pmr.elapsed)%60)).padStart(2,'0');const badge=document.getElementById('badge');badge.classList.toggle('relax',!isT);badge.textContent=isT?`긴장 ${pmr.left}초`:`이완 ${pmr.left}초`;document.getElementById('orbText').innerHTML=isT?`힘주기<br>${pmr.left}`:`놓기<br>${pmr.left}`;document.getElementById('phaseTitle').textContent=isT?item.tense:item.relax;document.getElementById('phaseText').textContent=isT?`5초만 유지합니다. ${item.safety}`:'10초 동안 힘을 빼고 차이를 확인합니다.';document.querySelectorAll('.part').forEach(p=>p.classList.toggle('glow',(item.target==='arm'&&p.dataset.p==='arm')||(item.target==='leg'&&p.dataset.p==='leg')||p.dataset.p===item.target));document.getElementById('pmrPrimary').textContent=pmr.running?'다음 근육군으로':`${pmr.minutes}분 시작`;}
    function startPmr(){clearInterval(pmr.timer);pmr.running=true;pmr.phase='tension';pmr.left=5;pmr.elapsed=0;restartOrb();renderPmr();pmr.timer=setInterval(()=>{pmr.elapsed++;pmr.left--;if(pmr.left<=0){if(pmr.phase==='tension'){pmr.phase='relax';pmr.left=10}else{pmr.step++;pmr.phase='tension';pmr.left=5;if(pmr.elapsed>=pmr.minutes*60){completePmr();return}}restartOrb()}renderPmr()},1000)}
    function nextPmr(){pmr.step++;pmr.phase='tension';pmr.left=5;pmr.running=true;restartOrb();renderPmr()}function completePmr(){clearInterval(pmr.timer);pmr.running=false;write({activeSession:false,lastPMRCompletedAt:new Date().toISOString(),routineHistory:[...(read().routineHistory||[]),{label:'점진적 근육이완',at:new Date().toISOString(),version:VERSION}].slice(-50)});document.getElementById('phaseTitle').textContent='PMR 완료';document.getElementById('phaseText').textContent='기록을 저장했습니다. 아래 탭에서 홈·세션·정보·설정으로 이동할 수 있습니다.';document.getElementById('pmrPrimary').textContent='다시 시작'}
    function render(){const r=route();if(r!=='pmr'&&pmr.timer){clearInterval(pmr.timer);pmr.timer=null;pmr.running=false;}if(r==='pmr')pmrScreen();else if(r==='breath')breathScreen();else if(r==='autogenic')autogenicScreen();else if(r.startsWith('session-'))session(r.replace('session-',''));else if(r==='sessions')sessions();else if(r==='info')info();else if(r==='settings')settings();else home();}
    window.__rrV37ForceHome=()=>{location.hash='home';home();return true};window.__RELAX_ROADMAP_VERSION__=VERSION;window.openRelaxPmrV3=()=>setRoute('pmr');window.addEventListener('hashchange',render);document.addEventListener('click',e=>{const pmr=e.target.closest('[data-action="start-pmr"],[data-rr-module="pmr-v3"]');if(pmr){e.preventDefault();setRoute('pmr')}},true);render();
  })();
  </script>
</body>
