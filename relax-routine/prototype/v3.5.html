<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef4df">
  <title>Relax Routine v3.5 — DH Mind Clinic</title>
  <style>
    :root{--bg:#f6f5ee;--paper:#fffef8;--paper2:#f2eadc;--ink:#17230f;--muted:#5c6954;--line:rgba(71,94,44,.16);--brand:#b9e761;--brand2:#88bd35;--accent:#d79b45;--shadow:0 18px 42px rgba(45,64,25,.12);--danger:#a44b3c;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:flex;justify-content:center}.phone{width:min(430px,100vw);min-height:100dvh;background:linear-gradient(180deg,#fbfaf3 0%,#edf4df 100%);box-shadow:0 24px 80px rgba(20,35,18,.13);position:relative;overflow:hidden}.scroll{height:100dvh;overflow:auto;padding:calc(20px + var(--safe-top)) 16px calc(28px + var(--safe-bottom));scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.eyebrow{font-size:12px;font-weight:950;letter-spacing:.12em;color:#61734b;text-transform:uppercase}.home-title{font-size:31px;line-height:1.05;letter-spacing:-.065em;margin:8px 0}.sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5;word-break:keep-all}.reco{border:1px solid var(--line);background:var(--paper);border-radius:28px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.reco small,.section-label{display:block;font-size:12px;color:#6b785f;font-weight:950;letter-spacing:.04em;margin-bottom:8px}.reco h2{margin:0;font-size:22px;letter-spacing:-.04em}.reco p{margin:7px 0 14px;color:#55624d;font-size:14px;line-height:1.5}.primary{width:100%;min-height:56px;border:0;border-radius:19px;background:var(--brand);color:#17240f;font-weight:950;font-size:17px;box-shadow:0 10px 22px rgba(90,128,30,.22)}.grid{display:grid;gap:10px;margin-top:8px}.card{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:23px;background:rgba(255,255,255,.80);padding:14px 13px;color:var(--ink);min-height:76px;box-shadow:0 8px 20px rgba(45,64,25,.055)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.card .icon{width:44px;height:44px;border-radius:17px;background:#edf5d8;display:grid;place-items:center;font-size:23px}.card b{display:block;font-size:16px;letter-spacing:-.03em}.card span span{display:block;color:#5d6956;font-size:13px;line-height:1.35;margin-top:3px}.foot{margin:14px 2px 0;color:#74806e;font-size:12px;line-height:1.45}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.top button,.ghost{border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:999px;padding:10px 13px;font-weight:900;color:#3f5727}.session{background:linear-gradient(180deg,#fbfaf3 0%,#f3eadc 100%)}.panel{border:1px solid var(--line);background:rgba(255,254,248,.88);border-radius:30px;padding:18px;box-shadow:var(--shadow)}.hero{display:grid;grid-template-columns:54px 1fr;gap:13px;align-items:center;margin-bottom:14px}.big{width:54px;height:54px;border-radius:21px;background:#edf5d8;display:grid;place-items:center;font-size:27px}.hero h1{font-size:25px;letter-spacing:-.05em;line-height:1.12;margin:0}.hero p{font-size:13px;color:#5d6956;margin:4px 0 0;line-height:1.45}.step{border:1px solid rgba(71,94,44,.13);border-radius:22px;background:#fffdf7;margin:10px 0;padding:14px}.step small{display:block;color:#71806a;font-weight:900;font-size:11px;letter-spacing:.08em;margin-bottom:5px}.step b{font-size:16px;line-height:1.4}.progress{height:8px;border-radius:99px;background:#e2ead4;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;width:33%;background:var(--brand2);border-radius:99px;transition:width .35s ease}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.actions button{min-height:50px;border:0;border-radius:17px;font-weight:950}.actions .main{grid-column:1/-1;background:var(--brand);color:#17240f;font-size:16px}.actions .secondary{background:#eef2e6;color:#46583d}.complete{display:none;margin-top:13px;border-radius:23px;background:#1f351d;color:white;padding:14px}.complete.show{display:block}.complete b{display:block;margin-bottom:4px}.complete p{margin:0;color:rgba(255,255,255,.78);font-size:13px;line-height:1.45}.pmr{background:linear-gradient(180deg,#fbfaf3 0,#f7f1e7 100%)}.pmr.sleep{background:linear-gradient(180deg,#111827 0,#101820 58%,#080d14 100%);color:#F7F7ED}.modebar,.durations{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.durations{grid-template-columns:1fr 1fr 1fr}.modebar button,.durations button{min-height:42px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.62);font-weight:900;color:#45573a}.sleep .modebar button,.sleep .durations button{background:rgba(255,255,255,.1);color:#eaffbf;border-color:rgba(255,255,255,.14)}.modebar .on,.durations .on{background:var(--brand);color:#17240f}.pmr-title{font-size:30px;line-height:1.08;letter-spacing:-.06em;margin:12px 0 8px}.bodymap{min-height:410px;position:relative;border-radius:34px;overflow:hidden;background:radial-gradient(circle at 50% 44%,rgba(255,244,198,.72),rgba(255,255,255,.30) 38%,rgba(163,213,42,.09) 72%,transparent 100%);border:1px solid rgba(71,94,44,.13);padding:16px}.sleep .bodymap{background:radial-gradient(circle at 50% 44%,rgba(214,255,120,.2),rgba(50,64,92,.28) 42%,rgba(0,0,0,.05) 78%,transparent 100%);border-color:rgba(255,255,255,.1)}.timer{position:absolute;left:16px;top:16px;z-index:5;font-weight:950;font-size:28px}.badge{position:absolute;right:16px;top:18px;z-index:5;border-radius:999px;background:#fff8df;color:#8c5b18;padding:8px 10px;font-weight:950;font-size:12px}.badge.relax{background:#effad8;color:#456b19}.orb-wrap{position:absolute;left:50%;top:46%;width:min(76vw,312px);height:min(76vw,312px);margin-left:calc(min(76vw,312px)/-2);margin-top:calc(min(76vw,312px)/-2);display:grid;place-items:center;z-index:1}.orb{width:min(56vw,230px);height:min(56vw,230px);border-radius:50%;opacity:.34;background:radial-gradient(circle at 35% 28%,rgba(255,255,240,.96),rgba(232,162,74,.88) 44%,rgba(185,111,36,.74) 74%,rgba(185,111,36,.20));box-shadow:0 0 0 26px rgba(232,162,74,.12),0 0 80px rgba(232,162,74,.42),inset -20px -24px 48px rgba(98,52,12,.15)}.orb.tension{animation:grow 5s cubic-bezier(.18,.82,.28,1) forwards}.orb.relax{animation:shrink 10s cubic-bezier(.25,.75,.22,1) forwards;background:radial-gradient(circle at 35% 28%,rgba(252,255,224,.98),rgba(163,213,42,.88) 50%,rgba(94,142,62,.72) 80%,rgba(94,142,62,.20))}@keyframes grow{0%{transform:scale(.70);opacity:.32}100%{transform:scale(1.28);opacity:.50}}@keyframes shrink{0%{transform:scale(1.28);opacity:.50}100%{transform:scale(.70);opacity:.28}}.orb-text{position:absolute;right:16px;top:116px;z-index:5;min-width:66px;text-align:center;border-radius:18px;background:rgba(255,255,255,.7);padding:9px 10px;font-weight:950}.sleep .orb-text{background:rgba(255,255,255,.1)}.figure{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:110px;height:250px;z-index:4;filter:drop-shadow(0 8px 14px rgba(41,58,24,.22))}.part{position:absolute;background:#385030;border-radius:999px;opacity:.62}.part.glow{background:#7ab72d;box-shadow:0 0 0 4px rgba(185,231,97,.24),0 0 18px rgba(126,176,50,.42);opacity:1}.head{left:37px;top:0;width:36px;height:36px}.jaw{left:42px;top:28px;width:26px;height:18px}.torso{left:27px;top:49px;width:56px;height:88px}.arm.l{left:0;top:58px;width:25px;height:105px;transform:rotate(8deg)}.arm.r{right:0;top:58px;width:25px;height:105px;transform:rotate(-8deg)}.leg.l{left:28px;top:132px;width:23px;height:118px}.leg.r{right:28px;top:132px;width:23px;height:118px}.phase{position:absolute;left:16px;right:16px;bottom:16px;z-index:5;border-radius:24px;background:rgba(255,253,248,.86);padding:14px}.sleep .phase{background:rgba(255,255,255,.09)}.phase b{display:block;font-size:16px;line-height:1.35}.phase span{display:block;margin-top:5px;color:#63705a;font-size:13px;line-height:1.45}.sleep .phase span{color:rgba(255,255,255,.72)}.pmr-cta{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--brand);color:#17240f;font-weight:950;font-size:16px;margin-top:12px}.pmr-cta.secondary{background:#eef2e6;color:#46583d}.safe{margin:11px 2px 0;color:#6b7564;font-size:12px;line-height:1.45}.sleep .safe{color:rgba(255,255,255,.62)}.hidden{display:none!important}@media(max-height:720px){.home-title{font-size:27px}.card{min-height:68px}.scroll{padding-top:12px}.panel{padding:15px}.bodymap{min-height:370px}}
  </style>
</head>
<body data-app="relax-routine" data-version="3.5" data-safety-state="advisory">
  <main id="app" class="phone" aria-live="polite"></main>
  <script>
  (()=>{
    const VERSION='v3.5';
    const STORAGE='relax-routine-v35-mobile-state';
    const app=document.getElementById('app');
    const routines=[
      {key:'breath',label:'복식호흡',short:'호흡을 길게 내쉬며 급한 긴장을 낮춥니다',meta:'1분 · 급한 긴장 낮추기',emoji:'🌬️',steps:['자세를 편하게 잡고 한 손을 배 위에 둡니다','코로 들이마시고 입으로 더 길게 내쉽니다','어깨 힘을 빼고 마지막 3회만 반복합니다']},
      {key:'pmr',label:'점진적 근육이완',short:'힘주기 5초, 놓기 10초를 시각 피드백으로 따라갑니다',meta:'7분 · 몸 긴장 풀기',emoji:'🫳'},
      {key:'bodyscan',label:'바디스캔',short:'생각보다 몸 감각을 먼저 훑습니다',meta:'7분 · 감각 알아차리기',emoji:'🧭',steps:['발바닥과 다리의 닿는 느낌을 확인합니다','배와 가슴의 움직임을 평가하지 않고 관찰합니다','턱, 어깨, 손의 긴장을 한 번씩 내려놓습니다']},
      {key:'autogenic',label:'자율훈련',short:'무거움과 따뜻함의 문장을 짧게 반복합니다',meta:'6분 · 조용히 안정하기',emoji:'🌙',steps:['양팔이 무겁다는 문장을 조용히 반복합니다','손과 복부가 따뜻해지는 느낌을 찾습니다','마지막에는 눈을 뜨기 전 손가락을 움직입니다']}
    ];
    const pmrSeq=[
      {target:'jaw',label:'얼굴·턱',tense:'눈썹과 입 주변에 아주 약하게 힘을 줍니다',relax:'이마, 눈가, 턱이 아래로 풀리는 느낌을 봅니다',safety:'이를 악물지 않습니다. 턱관절 통증이 있으면 힘주지 않습니다.'},
      {target:'torso',label:'어깨·목',tense:'어깨를 귀 쪽으로 아주 조금 올립니다',relax:'어깨가 아래로 내려가며 목 주변이 느슨해지는 느낌을 봅니다',safety:'목 통증이나 어지러움이 있으면 감각만 봅니다.'},
      {target:'arm',label:'팔·손',tense:'양손을 가볍게 쥐고 팔의 힘을 느낍니다',relax:'손가락이 펴지고 팔이 무거워지는 느낌을 봅니다',safety:'저림이나 손목 통증이 있으면 주먹을 쥐지 않습니다.'},
      {target:'torso',label:'가슴·복부',tense:'복부를 살짝 단단하게 만들되 숨은 계속 쉽니다',relax:'내쉬면서 배와 가슴 앞쪽이 부드러워지는 느낌을 봅니다',safety:'호흡을 참거나 가슴을 세게 조이지 않습니다.'},
      {target:'leg',label:'다리·발',tense:'발끝을 몸 쪽으로 살짝 당기며 다리 힘을 느낍니다',relax:'종아리와 발바닥의 힘이 바닥으로 빠지는 느낌을 봅니다',safety:'쥐가 잘 나거나 통증이 있으면 움직임 없이 감각만 봅니다.'}
    ];
    let pmr={mode:'day',minutes:7,step:0,phase:'tension',left:5,running:false,elapsed:0,timer:null};
    function read(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(_){return {}}}
    function write(next){localStorage.setItem(STORAGE,JSON.stringify({...read(),...next,updatedAt:new Date().toISOString()}));}
    function route(){return (location.hash||'#home').replace('#','')||'home'}
    function setRoute(r){if(route()!==r) location.hash=r; else render();}
    function recommended(){const hist=read().routineHistory||[];const counts=Object.fromEntries(routines.map(r=>[r.key,0]));hist.forEach(x=>routines.forEach(r=>{if((x.label||'').includes(r.label))counts[r.key]++}));return routines.slice().sort((a,b)=>counts[a.key]-counts[b.key])[0]||routines[0];}
    function shell(cls,inner){app.className='phone '+(cls||'');app.innerHTML=inner;document.title='Relax Routine v3.5 — DH Mind Clinic';window.__RELAX_ROADMAP_VERSION__='v3.5';document.body.dataset.version='3.5'}
    function home(){const rec=recommended();shell('',`<section id="relax-v35-home" class="scroll"><div class="eyebrow">RELAX ROUTINE · v3.5</div><h1 class="home-title">오늘 필요한 이완을<br>하나 고르고 바로 실행</h1><p class="sub">홈은 선택까지만 담당합니다. 세션을 누르면 별도 실행 화면으로 들어가고, PMR은 앱 안 모든 진입점에서 같은 업그레이드 화면으로 열립니다.</p><article class="reco"><small>오늘 추천</small><h2>${rec.emoji} ${rec.label}</h2><p>${rec.short}</p><button class="primary" type="button" data-start="${rec.key}">오늘 추천 시작</button></article><span class="section-label">직접 고르기</span><div class="grid">${routines.map(r=>`<button class="card" type="button" data-start="${r.key}"><span class="icon">${r.emoji}</span><span><b>${r.label}</b><span>${r.meta}</span></span></button>`).join('')}</div><p class="foot">완료 전에는 기록하지 않습니다. 통증·어지러움·불편감이 있으면 중단합니다.</p></section>`);document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>openRoutine(b.dataset.start));}
    function openRoutine(key){const r=routines.find(x=>x.key===key)||recommended();write({lastStarted:new Date().toISOString(),recommendedRoutine:r.label,lastRecommendedKey:r.key,activeSession:true,productFlow:'home-select-execute-complete'});if(r.key==='pmr'){setRoute('pmr');return;}setRoute('session-'+r.key);}
    function session(key){const r=routines.find(x=>x.key===key)||routines[0];let idx=Number(read()['idx-'+key]||0);const steps=r.steps||[];shell('session',`<section id="rr-v35-session" class="scroll"><div class="top"><button type="button" data-home>← 홈</button><span class="eyebrow">${r.label} · 실행</span></div><article class="panel"><div class="hero"><span class="big">${r.emoji}</span><div><h1>${r.label}</h1><p>${r.short}</p></div></div><div class="progress"><span data-progress></span></div><div class="step"><small data-count></small><b data-text></b></div><div class="actions"><button type="button" class="main" data-next>다음 단계</button><button type="button" class="secondary" data-complete>완료 저장</button><button type="button" class="secondary" data-stop>중단</button></div><div class="complete" data-complete-card><b>오늘 세션 완료</b><p>기록을 저장했습니다. 같은 루틴을 반복하지 않아도 됩니다.</p></div></article></section>`);const update=()=>{document.querySelector('[data-count]').textContent=`STEP ${idx+1} / ${steps.length}`;document.querySelector('[data-text]').textContent=steps[idx];document.querySelector('[data-progress]').style.width=`${Math.round((idx+1)/steps.length*100)}%`;document.querySelector('[data-next]').textContent=idx>=steps.length-1?'완료 저장':'다음 단계';write({['idx-'+key]:idx});};const complete=()=>{document.querySelector('[data-complete-card]').classList.add('show');write({activeSession:false,completedAt:new Date().toISOString(),lastSession:r.label,routineHistory:[...(read().routineHistory||[]),{label:r.label,at:new Date().toISOString(),version:VERSION}].slice(-50)});};document.querySelector('[data-home]').onclick=()=>setRoute('home');document.querySelector('[data-stop]').onclick=()=>{write({activeSession:false,stoppedAt:new Date().toISOString()});setRoute('home')};document.querySelector('[data-complete]').onclick=complete;document.querySelector('[data-next]').onclick=()=>{if(idx<steps.length-1){idx++;update()}else complete()};update();}
    function pmrScreen(){clearInterval(pmr.timer);pmr={...pmr,step:0,phase:'tension',left:5,running:false,elapsed:0,timer:null};shell('pmr',`<section id="rr-pmr-v3" class="scroll pmr-shell rr-v35-unified" aria-label="Relax Routine v3.5 PMR unified module"><div class="top"><button type="button" data-home>← 홈</button><span class="eyebrow">RELAX ROUTINE · PMR 통합 실행</span></div><h1 class="pmr-title">몸에 들어간 힘을<br>천천히 풀기</h1><p class="sub">5초 긴장하면 원이 커지고, 10초 이완하면 원이 줄어듭니다.</p><div class="modebar"><button data-mode="day" class="on">낮 PMR</button><button data-mode="sleep">수면 PMR</button></div><div class="durations"><button data-min="3">3분</button><button data-min="7" class="on">7분</button><button data-min="12">12분</button></div><div class="bodymap"><div class="timer" id="timer">07:00</div><div class="badge" id="badge">긴장 5초</div><div class="orb-wrap"><div class="orb tension" id="orb"></div></div><div class="orb-text" id="orbText">힘주기<br>5</div><div class="figure"><i class="part head" data-p="head"></i><i class="part jaw glow" data-p="jaw"></i><i class="part torso" data-p="torso"></i><i class="part arm l" data-p="arm"></i><i class="part arm r" data-p="arm"></i><i class="part leg l" data-p="leg"></i><i class="part leg r" data-p="leg"></i></div><div class="phase"><b id="phaseTitle"></b><span id="phaseText"></span></div></div><button class="pmr-cta" id="pmrPrimary" type="button">7분 시작</button><button class="pmr-cta secondary" id="pmrSkip" type="button">이 근육군 건너뛰기</button><p class="safe" id="safe">통증·저림·어지러움이 있으면 힘주기 대신 감각만 알아차립니다.</p></section>`);window.openRelaxPmrV3=()=>setRoute('pmr');document.querySelector('[data-home]').onclick=()=>{clearInterval(pmr.timer);setRoute('home')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{pmr.mode=b.dataset.mode;document.querySelector('.pmr-shell').classList.toggle('sleep',pmr.mode==='sleep');document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('safe').textContent=pmr.mode==='sleep'?'졸림을 유도하는 모드입니다. 운전 중이거나 이동 중에는 사용하지 않습니다.':'통증·저림·어지러움이 있으면 힘주기 대신 감각만 알아차립니다.'});document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{pmr.minutes=Number(b.dataset.min);document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('on',x===b));renderPmr();});document.getElementById('pmrPrimary').onclick=()=>pmr.running?nextPmr():startPmr();document.getElementById('pmrSkip').onclick=nextPmr;renderPmr();setTimeout(startPmr,80);}
    function cur(){return pmrSeq[pmr.step%pmrSeq.length]}function restartOrb(){const o=document.getElementById('orb');if(!o)return;o.className='orb '+(pmr.phase==='tension'?'tension':'relax');void o.offsetWidth;o.className='orb '+(pmr.phase==='tension'?'tension':'relax')}function renderPmr(){if(!document.getElementById('timer'))return;const item=cur(),isT=pmr.phase==='tension';document.getElementById('timer').textContent=String(Math.max(0,Math.floor((pmr.minutes*60-pmr.elapsed)/60))).padStart(2,'0')+':'+String(Math.max(0,(pmr.minutes*60-pmr.elapsed)%60)).padStart(2,'0');const badge=document.getElementById('badge');badge.classList.toggle('relax',!isT);badge.textContent=isT?`긴장 ${pmr.left}초`:`이완 ${pmr.left}초`;document.getElementById('orbText').innerHTML=isT?`힘주기<br>${pmr.left}`:`놓기<br>${pmr.left}`;document.getElementById('phaseTitle').textContent=isT?item.tense:item.relax;document.getElementById('phaseText').textContent=isT?`5초만 유지합니다. ${item.safety}`:'10초 동안 힘을 빼고 차이를 확인합니다.';document.querySelectorAll('.part').forEach(p=>p.classList.toggle('glow',(item.target==='arm'&&p.dataset.p==='arm')||(item.target==='leg'&&p.dataset.p==='leg')||p.dataset.p===item.target));document.getElementById('pmrPrimary').textContent=pmr.running?'다음 근육군으로':`${pmr.minutes}분 시작`;}
    function startPmr(){clearInterval(pmr.timer);pmr.running=true;pmr.phase='tension';pmr.left=5;pmr.elapsed=0;restartOrb();renderPmr();pmr.timer=setInterval(()=>{pmr.elapsed++;pmr.left--;if(pmr.left<=0){if(pmr.phase==='tension'){pmr.phase='relax';pmr.left=10}else{pmr.step++;pmr.phase='tension';pmr.left=5;if(pmr.elapsed>=pmr.minutes*60){completePmr();return}}restartOrb()}renderPmr()},1000)}
    function nextPmr(){pmr.step++;pmr.phase='tension';pmr.left=5;pmr.running=true;restartOrb();renderPmr()}function completePmr(){clearInterval(pmr.timer);pmr.running=false;write({activeSession:false,lastPMRCompletedAt:new Date().toISOString(),routineHistory:[...(read().routineHistory||[]),{label:'점진적 근육이완',at:new Date().toISOString(),version:VERSION}].slice(-50)});document.getElementById('phaseTitle').textContent='PMR 완료';document.getElementById('phaseText').textContent='기록을 저장했습니다. 수면 모드였다면 그대로 화면을 내려놓아도 됩니다.';document.getElementById('pmrPrimary').textContent='다시 시작'}
    function render(){const r=route();if(r!=='pmr'&&pmr.timer){clearInterval(pmr.timer);pmr.timer=null;pmr.running=false;}if(r==='pmr')pmrScreen();else if(r.startsWith('session-'))session(r.replace('session-',''));else home()}window.__rrV35ForceHome=()=>{location.hash='home';home();return true};window.__RELAX_ROADMAP_VERSION__='v3.5';window.openRelaxPmrV3=()=>setRoute('pmr');window.addEventListener('hashchange',render);document.addEventListener('click',e=>{const pmr=e.target.closest('[data-action="start-pmr"],[data-rr-module="pmr-v3"]');if(pmr){e.preventDefault();setRoute('pmr')}},true);render();
  })();
  </script>
