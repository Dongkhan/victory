appId: clinic.dongheng.dhtalk
productName: DH Talk
copyright: Dongheng Psychiatric Clinic

directories:
  output: dist/win
  buildResources: build

# renderer 는 vite build 결과(dist/renderer)를 패키징. main/shared 는 소스 그대로.
files:
  - src/main/**/*
  - src/shared/**/*
  - dist/renderer/**/*
  - package.json

# 네이티브 모듈(better-sqlite3 .node)은 asar 밖으로 풀어야 로드된다.
asarUnpack:
  - "**/*.node"

# config/ 는 사용자가 메모장으로 편집하므로 asar 밖 resources/config 로 복사.
extraResources:
  - from: config
    to: config

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: DH Talk
