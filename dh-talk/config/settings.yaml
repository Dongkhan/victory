# DH Talk 설정 — 메모장으로 편집 가능.

# 이 PC 의 사용자 id. users.yaml 의 id 중 하나로, 설치 PC 마다 수정한다.
me: desk1

server:
  host: "192.168.0.10"   # 데스크1 PC 의 LAN IP (실제 값으로 수정)
  ws_port: 8123
  # 실사용 전 모든 PC에서 같은 값으로 바꾼다. 20자 이상 무작위 문자열 권장.
  # Windows PowerShell 예: -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 32 | % {[char]$_})
  shared_key: "CHANGE_ME_BEFORE_USE"

alert:
  pulse_window: true
  sound_after_sec: 30    # 미확인 시 사운드
  escalate_after_sec: 60 # 미확인 시 다른 데스크로 에스컬레이션

hermes:
  enabled: false
  # enabled=true일 때만 사용. 실사용은 https:// URL 필수. http는 개발/로컬 테스트에서만 allow_insecure_http=true와 함께 허용.
  url: ""
  allow_insecure_http: false

retention_days: 30
