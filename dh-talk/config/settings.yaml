# DH Talk 설정 — 메모장으로 편집 가능.

# 이 PC 의 사용자 id. users.yaml 의 id 중 하나로, 설치 PC 마다 수정한다.
me: desk1

# WebSocket 인증 키 — 4대 PC 모두 동일한 값이어야 한다.
# 비워두면 모든 연결이 거부된다.
# `node scripts/generate-shared-key.js` 로 키를 만들어 4대 PC 에 동일 입력.
auth:
  shared_key: ""

server:
  host: "192.168.0.10"   # 데스크1 PC 의 LAN IP (실제 값으로 수정)
  ws_port: 8123

alert:
  pulse_window: true
  sound_after_sec: 30    # 미확인 시 사운드
  escalate_after_sec: 60 # 미확인 시 다른 데스크로 에스컬레이션

hermes:
  enabled: false
  url: "http://76.13.179.163:8090"

retention_days: 30
