<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>창 — 2D 인터랙티브 방탈출 내러티브</title>
  <style>
    :root{
      --ink:#e9e3d6; --muted:#b9ad9b; --dark:#111015; --line:rgba(255,255,255,.12);
      --warm:#f0c98c; --accent:#c98d67; --blue:#7988a0; --shadow:rgba(0,0,0,.45);
      --ui:rgba(18,17,22,.72); --ui2:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;height:100%;overflow:hidden;background:#09090d;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
    button{font:inherit;color:inherit} .game{position:relative;width:100vw;height:100svh;min-height:560px;background:radial-gradient(circle at 50% 30%,#242028 0%,#14131a 52%,#08080c 100%);transition:filter 1s,background 1.8s;overflow:hidden}
    .game.warm1{background:radial-gradient(circle at 48% 28%,#312a29 0%,#19171b 54%,#09090d 100%)}
    .game.warm2{background:radial-gradient(circle at 54% 20%,#413329 0%,#1e1a1b 56%,#0a090b 100%)}
    .game.warm3{background:radial-gradient(circle at 60% 18%,#4b3828 0%,#231c1b 58%,#0b090a 100%)}
    .game.open{background:linear-gradient(110deg,#f7d9a5 0%,#f6c06e 20%,#5c4a3f 21%,#241f1e 46%,#141114 100%)}
    .room{position:absolute;left:50%;top:50%;width:min(1120px,100vw);height:min(720px,100svh);transform:translate(-50%,-50%);}
    .wall{position:absolute;left:7%;right:7%;top:5%;height:70%;background:linear-gradient(#282631,#17171d);border:1px solid var(--line);box-shadow:0 30px 80px var(--shadow) inset;border-radius:12px 12px 2px 2px;transition:background 1.5s}
    .warm1 .wall{background:linear-gradient(#302b2d,#1b191b)} .warm2 .wall{background:linear-gradient(#3a302a,#201b1a)} .warm3 .wall{background:linear-gradient(#45372b,#241d1a)} .open .wall{background:linear-gradient(90deg,#7b5b3d 0 22%,#3b2e2a 22% 100%)}
    .floor{position:absolute;left:0;right:0;bottom:0;height:32%;background:linear-gradient(#1a1716,#0d0c0d);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);border-top:1px solid rgba(255,255,255,.08)}
    .window{position:absolute;left:50%;top:13%;width:min(300px,30vw);height:310px;transform:translateX(-50%);border:10px solid #0e0d10;background:linear-gradient(#111014,#08080b);box-shadow:0 18px 40px rgba(0,0,0,.5);cursor:pointer;transition:.9s}
    .window:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,rgba(255,255,255,.07) 49% 51%,transparent 52%),linear-gradient(transparent 48%,rgba(255,255,255,.07) 49% 51%,transparent 52%)}
    .curtain{position:absolute;inset:-8px;background:linear-gradient(90deg,#151822,#20202b 10%,#12141b 18%,#24242f 28%,#11131a 39%,#20212b 50%,#13151c 61%,#252530 72%,#12141b 84%,#1a1c25);transform-origin:top;transition:transform 1.4s cubic-bezier(.2,.8,.1,1),opacity 1s;z-index:3}.open .curtain{transform:translateX(-105%) scaleX(.25);opacity:.6}.light-slit{position:absolute;right:-5px;top:0;width:8px;height:100%;background:linear-gradient(#ffe1a4,#bd854a);opacity:0;filter:blur(2px);transition:opacity 1s}.warm2 .light-slit,.warm3 .light-slit{opacity:.45}.open .light-slit{opacity:0}
    .bed{position:absolute;left:11%;bottom:19%;width:250px;height:92px;background:#211e22;border:1px solid var(--line);border-radius:18px 18px 8px 8px;box-shadow:0 22px 30px rgba(0,0,0,.35)}.bed:before{content:"";position:absolute;left:18px;top:-22px;width:84px;height:35px;border-radius:13px;background:#2c2a30}.blanket{position:absolute;right:0;bottom:0;width:160px;height:80px;border-radius:18px 18px 8px 5px;background:linear-gradient(135deg,#30313b,#17181f)}
    .desk{position:absolute;right:12%;bottom:20%;width:250px;height:92px;background:#231a16;border-radius:6px;border:1px solid rgba(255,255,255,.1)}.desk:before,.desk:after{content:"";position:absolute;bottom:-78px;width:16px;height:78px;background:#130f0d}.desk:before{left:22px}.desk:after{right:22px}.sink{position:absolute;left:31%;bottom:20%;width:92px;height:72px;border:2px solid rgba(255,255,255,.12);border-radius:8px 8px 22px 22px;background:#19191b}.drawer{position:absolute;right:17%;bottom:34%;width:110px;height:64px;border:1px solid rgba(255,255,255,.12);background:#1b1513;border-radius:4px}.drawer:after{content:"";position:absolute;left:44%;top:22px;width:15px;height:5px;background:#8b705e;border-radius:9px}
    .hotspot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;outline:none}.hotspot:focus-visible{filter:drop-shadow(0 0 10px #f0c98c)}.hint-ring{position:absolute;inset:-12px;border:1px solid rgba(240,201,140,.0);border-radius:50%;animation:pulse 2.2s infinite;pointer-events:none}.available .hint-ring{border-color:rgba(240,201,140,.45)}
    .trace{opacity:0;transform:translateY(12px) scale(.95);transition:opacity 1s,transform 1s;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}.trace.show{opacity:1;transform:none}.bag{left:39%;bottom:22%;width:78px;height:78px;background:#8b715b;border-radius:18px 18px 26px 26px}.bag:before{content:"";position:absolute;left:21px;top:-15px;width:34px;height:24px;border:5px solid #8b715b;border-bottom:0;border-radius:22px 22px 0 0}.bowl{left:37%;bottom:24%;width:92px;height:36px;background:#c8bda4;border-radius:50%;box-shadow:0 10px 0 #6f6658}.phone{right:20%;bottom:35%;width:58px;height:100px;background:#0b0b0d;border:3px solid #34333a;border-radius:14px}.phone:after{content:"";position:absolute;left:10px;right:10px;top:15px;bottom:15px;background:linear-gradient(#151821,#0c0d10);border-radius:6px}.photo{left:23%;bottom:35%;width:92px;height:70px;background:#d8cdb8;border:7px solid #eee3d0;transform:rotate(-7deg);box-shadow:0 14px 24px rgba(0,0,0,.45)}.photo:after{content:"";position:absolute;inset:9px;background:linear-gradient(140deg,#776c64,#2a2525);opacity:.85}
    .voiceLayer{position:absolute;inset:0;pointer-events:none;z-index:5}.voice{position:absolute;max-width:320px;color:rgba(233,227,214,.45);font-size:clamp(13px,1.8vw,18px);letter-spacing:-.02em;text-shadow:0 0 12px rgba(0,0,0,.8);animation:float 7s ease-in-out infinite;transition:opacity .8s,transform .8s}.voice.big{font-size:clamp(22px,4vw,42px);color:rgba(235,225,216,.68);font-weight:700}.voice.boxed{padding:12px 16px;border:1px solid rgba(255,255,255,.12);background:rgba(20,18,22,.55);border-radius:14px;transform:scale(.78);color:rgba(233,227,214,.38)}
    .hud{position:absolute;left:18px;right:18px;top:calc(env(safe-area-inset-top) + 14px);display:flex;justify-content:space-between;gap:12px;z-index:20;pointer-events:none}.chapter{padding:10px 14px;background:var(--ui);border:1px solid var(--line);border-radius:999px;font-size:14px;color:#d7cdbc;backdrop-filter:blur(12px)}.progress{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}.dot.on{background:#f0c98c;box-shadow:0 0 14px #f0c98c}
    .panel{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);width:min(780px,calc(100vw - 28px));z-index:30;background:var(--ui);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px;backdrop-filter:blur(18px);box-shadow:0 18px 50px rgba(0,0,0,.38)}.line{font-size:clamp(17px,2.6vw,22px);line-height:1.52;letter-spacing:-.035em;white-space:pre-line}.sub{margin-top:9px;color:var(--muted);font-size:14px;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.18s}.btn:hover,.btn:focus-visible{background:rgba(240,201,140,.16);border-color:rgba(240,201,140,.45);transform:translateY(-1px)}.btn.primary{background:rgba(201,141,103,.25);border-color:rgba(240,201,140,.45)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.small{font-size:13px;color:#a99f91}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:35;padding:12px 16px;border-radius:999px;background:rgba(8,8,10,.76);border:1px solid var(--line);color:#d7cdbc;opacity:0;transition:opacity .3s,transform .3s}.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
    .modal{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}.modal.show{display:flex}.card{width:min(720px,100%);max-height:88svh;overflow:auto;background:#17151a;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px;box-shadow:0 26px 80px rgba(0,0,0,.55)}.card h2{margin:0 0 12px;font-size:22px}.note{position:relative;background:#d7c6a6;color:#332922;border-radius:8px;padding:22px;font-size:21px;line-height:1.55;box-shadow:0 16px 30px rgba(0,0,0,.3);font-family:serif}.overlayWords{margin-top:12px;display:grid;gap:10px}.word{padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:.25s}.word.moved{transform:translateX(18px);opacity:.55;background:rgba(80,90,105,.18)}.phoneScreen{background:#090a0d;border-radius:22px;padding:18px;border:1px solid rgba(255,255,255,.12)}.msg{max-width:80%;padding:12px 14px;border-radius:18px;background:#202631;margin:8px 0;color:#e1dccf}.replyBox{margin-top:16px;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:14px;color:#a9a198;min-height:54px}.timerbar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}.timerbar>i{display:block;height:100%;width:0;background:#c98d67;transition:width .2s}.quiet{position:absolute;inset:0;display:none;z-index:60;background:#050506;align-items:center;justify-content:center;color:rgba(235,225,216,.64);font-size:18px;line-height:1.7;text-align:center;padding:30px}.quiet.show{display:flex;animation:fadeIn 1s both}.endingText{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;width:min(680px,calc(100vw - 38px));text-align:center;font-size:clamp(24px,5vw,48px);line-height:1.35;letter-spacing:-.05em;opacity:0;transition:opacity 2s;text-shadow:0 8px 28px #000}.endingText.show{opacity:1}
    @keyframes pulse{0%,100%{transform:scale(.96);opacity:.45}50%{transform:scale(1.08);opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @media(max-width:760px){.room{height:680px}.window{top:11%;width:210px;height:260px}.bed{left:5%;width:190px}.desk{right:4%;width:190px}.sink{left:34%}.panel{padding:15px}.hud{left:10px;right:10px}.voice{max-width:220px}.drawer{right:13%}}
  </style>
</head>
<body>
  <main id="game" class="game" aria-label="창: 2D 인터랙티브 방탈출 게임">
    <section class="room" aria-hidden="true">
      <div class="wall"></div><div class="floor"></div>
      <button id="curtainBtn" class="hotspot window available" aria-label="커튼"><span class="curtain"></span><span class="light-slit"></span><span class="hint-ring"></span></button>
      <div class="bed"><span class="blanket"></span></div><div class="sink"></div><div class="desk"></div><div class="drawer"></div>
      <button id="motherObj" class="hotspot trace bag" aria-label="문 앞 봉지"><span class="hint-ring"></span></button>
      <button id="bowlObj" class="hotspot trace bowl" aria-label="죽 그릇"><span class="hint-ring"></span></button>
      <button id="phoneObj" class="hotspot trace phone" aria-label="휴대폰"><span class="hint-ring"></span></button>
      <button id="photoObj" class="hotspot trace photo" aria-label="사진"><span class="hint-ring"></span></button>
    </section>
    <div id="voiceLayer" class="voiceLayer"></div>
    <div class="hud"><div id="chapter" class="chapter">제1장 — 닫힘</div><div id="progress" class="chapter progress"></div></div>
    <div id="toast" class="toast"></div>
    <section id="panel" class="panel"><div id="line" class="line"></div><div id="sub" class="sub"></div><div id="actions" class="actions"></div></section>
    <div id="modal" class="modal" role="dialog" aria-modal="true"><div id="modalCard" class="card"></div></div>
    <div id="quiet" class="quiet"></div><div id="ending" class="endingText"></div>
  </main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const game=$('#game'), line=$('#line'), sub=$('#sub'), actions=$('#actions'), chapterEl=$('#chapter'), progress=$('#progress');
  const modal=$('#modal'), modalCard=$('#modalCard'), quiet=$('#quiet'), ending=$('#ending'), voiceLayer=$('#voiceLayer');
  const objs={curtain:$('#curtainBtn'),mother:$('#motherObj'),bowl:$('#bowlObj'),phone:$('#phoneObj'),photo:$('#photoObj')};
  const state={chapter:1, curtainTries:0, motherRead:false, bowlMoved:false, phoneReady:false, expelTries:0, boxed:false, ended:false};
  const chapters=['닫힘','연민','우정','사랑','창'];
  function save(){try{localStorage.setItem('window-game-state', JSON.stringify(state));}catch(e){}}
  function load(){try{Object.assign(state, JSON.parse(localStorage.getItem('window-game-state')||'{}'));}catch(e){}}
  function reset(){localStorage.removeItem('window-game-state'); location.reload();}
  function setText(t,s='',buttons=[]){line.textContent=t; sub.textContent=s; actions.innerHTML=''; buttons.forEach(b=>{const btn=document.createElement('button');btn.className='btn '+(b.primary?'primary':'');btn.textContent=b.label;btn.disabled=!!b.disabled;btn.onclick=b.onClick;actions.appendChild(btn);});}
  function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
  function showModal(html){modalCard.innerHTML=html;modal.classList.add('show')} function closeModal(){modal.classList.remove('show');modalCard.innerHTML=''}
  function updateProgress(){progress.innerHTML=''; for(let i=1;i<=5;i++){let d=document.createElement('span');d.className='dot '+(i<=state.chapter?'on':'');progress.appendChild(d)}}
  function setChapter(n){state.chapter=n; chapterEl.textContent=`제${n}장 — ${chapters[n-1]}`; game.className='game '+(n===2?'warm1':n===3?'warm2':n===4?'warm3':n===5?'warm3':''); updateProgress(); save();}
  function voices(list){voiceLayer.innerHTML=''; list.forEach(v=>{let e=document.createElement('div');e.className='voice '+(v.big?'big ':'')+(v.boxed?'boxed':''); e.textContent=v.text; e.style.left=v.left; e.style.top=v.top; e.style.animationDelay=(v.delay||0)+'s'; voiceLayer.appendChild(e);});}
  function showObj(name){objs[name].classList.add('show','available')} function hideObj(name){objs[name].classList.remove('show','available')}
  function intro(){setChapter(1); voices([{text:'어차피 밖에 볼 것도 없잖아.',left:'6%',top:'22%'},{text:'조금만 더 누워 있어도 돼.',left:'66%',top:'16%',delay:1.2}]); setText('방은 어둡다.\n초침 소리만 벽에 붙어 있다.','할 일은 하나뿐인 것 같다. 커튼을 누르세요.',[{label:'처음부터 다시',onClick:reset}]);}
  function onCurtain(){ if(state.chapter===5) return openCurtain(); if(state.chapter<5){state.curtainTries++; if(state.curtainTries<3){setText('손이 천에 닿는다.\n움직이지 않는다.','지금은 아니다.'); voices([{text:'지금 열면 더 망가질 거야.',left:'60%',top:'28%'},{text:'그냥 두자.',left:'10%',top:'60%',delay:1}]);} else {showObj('mother'); setText('세 번째로 놓친 손끝 아래,\n문가에 놓인 봉지가 눈에 들어온다.','못 여는 동안 보이기 시작한 것이 있다. 봉지를 누르세요.'); voices([{text:'보지 마. 부담이야.',left:'6%',top:'24%'},{text:'또 실망시켰어.',left:'70%',top:'58%',delay:1}]);} save(); }}
  function mother(){ if(state.chapter!==1) return; showModal(`<h2>문 앞 봉지</h2><div class="note">안 먹어도 되니까 그냥 둘게.</div><div class="overlayWords"><div class="word">부담 주는 거잖아.</div><div class="word">또 실망시켰어.</div><div class="word">괜찮은 척하라는 뜻이야.</div></div><p class="small">덧씌워진 말들을 눌러 옆으로 비켜놓으세요. 지우는 것이 아닙니다.</p>`); let moved=0; modalCard.querySelectorAll('.word').forEach(w=>w.onclick=()=>{if(w.classList.contains('moved'))return; w.classList.add('moved'); moved++; if(moved===3){setTimeout(()=>{closeModal(); state.motherRead=true; setChapter(2); showObj('bowl'); setText('글자는 그대로 남아 있다.\n무언가를 요구하는 말이 아니라, 그냥 놓고 가는 말이었다.','먹지 않아도 된다. 죽 그릇을 싱크대로 옮기면 충분하다.'); voices([{text:'그래도 부담이야.',left:'4%',top:'18%'},{text:'하지만… 원문은 저기 있어.',left:'61%',top:'64%',delay:1.2}]); save();},550)}})}
  function bowl(){ if(state.chapter!==2) return; hideObj('bowl'); state.bowlMoved=true; setChapter(3); showObj('phone'); setText('그릇이 싱크대에 놓인다.\n방의 온도가 아주 조금 바뀐다.','책상 위 휴대폰이 켜진다.'); voices([{text:'답 못 한 게 너무 많아.',left:'8%',top:'30%'},{text:'완벽하게 써야 해.',left:'67%',top:'18%',delay:.7}]); save();}
  function phone(){ if(state.chapter!==3) return; showModal(`<h2>휴대폰</h2><div class="phoneScreen"><div class="msg">답 안 해도 돼.</div><div class="msg">그냥 가끔 생각나서.</div><div id="reply" class="replyBox">답장을 쓰려 하면 글자가 흩어진다.</div><div class="timerbar"><i id="bar"></i></div></div><div class="actions"><button id="tryReply" class="btn">완벽한 답장을 쓴다</button><button id="sendDot" class="btn primary" disabled>점 하나만 보낸다 ·</button></div><p class="small">억지로 보내려 하면 실패합니다. 메시지 곁에 잠시 머무르세요.</p>`); const bar=modalCard.querySelector('#bar'), reply=modalCard.querySelector('#reply'), send=modalCard.querySelector('#sendDot'); let t=0; const int=setInterval(()=>{t+=1; bar.style.width=Math.min(100,t*14)+'%'; if(t===4) reply.textContent='지금 완벽하지 않아도, 말은 완전히 끊기지 않는다.'; if(t>=7){clearInterval(int); send.disabled=false; reply.textContent='·';}},700); modalCard.querySelector('#tryReply').onclick=()=>{reply.textContent='고맙고 미안하고 사실은 —'; setTimeout(()=>reply.textContent='글자가 다시 사라진다.',350); toast('힘으로 밀면 더 멀어진다.')}; send.onclick=()=>{clearInterval(int); closeModal(); setChapter(4); showObj('photo'); setText('점 하나가 전송된다.\n창가 아래로 아주 얇은 빛이 들어온다.','바닥의 사진이 보인다.'); voices([{text:'그게 답장이야?',left:'7%',top:'19%'},{text:'그래도 방향은 맞았어.',left:'62%',top:'62%',delay:1.1}]); save();};}
  function photo(){ if(state.chapter!==4) return; showModal(`<h2>사진</h2><div class="note" style="background:#2a2522;color:#e7dac7">한 번도 제대로 놓아둔 적 없는 얼굴.\n버리기엔 아직 이름이 남아 있다.</div><div id="heavyVoice" class="voice big" style="position:relative;left:0;top:0;margin:18px 0;animation:none">네 잘못이야. 네가 그랬잖아.</div><div class="actions"><button id="expel" class="btn">목소리를 방 밖으로 내쫓는다</button><button id="box" class="btn primary" disabled>상자에 담아 곁에 둔다</button></div><p class="small">이번에는 비켜 세우는 것만으로는 충분하지 않습니다.</p>`); const hv=modalCard.querySelector('#heavyVoice'), expel=modalCard.querySelector('#expel'), box=modalCard.querySelector('#box'); expel.onclick=()=>{state.expelTries++; hv.textContent= state.expelTries===1?'문턱에서 다시 돌아온다. 네 잘못이야.': '밀어낼수록 더 크게 들린다.'; hv.style.transform='scale(1.05)'; setTimeout(()=>hv.style.transform='',250); if(state.expelTries>=2){box.disabled=false; expel.textContent='다시 내쫓아 본다';} save();}; box.onclick=()=>{state.boxed=true; closeModal(); voices([{text:'네 잘못이야.',left:'72%',top:'60%',boxed:true}]); quiet.innerHTML='소리는 사라지지 않는다.<br>그래도 방 전체가 그 소리만은 아니다.'; quiet.classList.add('show'); setTimeout(()=>{quiet.classList.remove('show'); setText('한참 뒤, 손이 다시 움직인다.','사진을 버리지 않고 서랍에 넣으세요.',[{label:'사진을 서랍에 넣는다',primary:true,onClick:drawerPhoto}]);},3600); save();};}
  function drawerPhoto(){ hideObj('photo'); setChapter(5); setText('서랍이 닫힌다.\n방은 완전히 밝지 않지만, 처음과 같지는 않다.','커튼까지 한 걸음.'); voices([{text:'또 닫힐 거야.',left:'70%',top:'18%'},{text:'그래도 오늘은 손이 닿는다.',left:'7%',top:'66%',delay:1.2}]);}
  function openCurtain(){ if(state.ended) return; state.ended=true; game.className='game open'; voices([{text:'또 닫힐 거야.',left:'72%',top:'62%',boxed:true}]); setText('손잡이는 그대로다.\n잠긴 적은 없었다.','바뀐 건 창이 아니라, 그것을 여는 사람 쪽이었다.'); setTimeout(()=>{ending.innerHTML='기분이 나아졌다, 는 말은 없다.<br><br>그럼에도,<br>오늘은 한 번 열었다.'; ending.classList.add('show');},1600); save();}
  function restoreVisible(){ if(state.chapter>=1 && state.curtainTries>=3) showObj('mother'); if(state.chapter>=2) showObj('bowl'); if(state.chapter>=3) showObj('phone'); if(state.chapter>=4) showObj('photo'); if(state.bowlMoved) hideObj('bowl'); if(state.chapter>=5) hideObj('photo'); }
  objs.curtain.onclick=onCurtain; objs.mother.onclick=mother; objs.bowl.onclick=bowl; objs.phone.onclick=phone; objs.photo.onclick=photo; modal.onclick=e=>{if(e.target===modal) closeModal()};
  load(); if(state.ended){state.ended=false; state.chapter=5;} intro(); if(state.chapter>1){setChapter(state.chapter); restoreVisible(); if(state.chapter===2) setText('글자는 그대로 남아 있다.','죽 그릇을 싱크대로 옮기면 충분하다.'); if(state.chapter===3) setText('방의 온도가 아주 조금 바뀐다.','책상 위 휴대폰이 켜진다.'); if(state.chapter===4) setText('창가 아래로 아주 얇은 빛이 들어온다.','바닥의 사진이 보인다.'); if(state.chapter===5) setText('방은 완전히 밝지 않지만, 처음과 같지는 않다.','커튼을 누르세요.');}
  updateProgress();
})();
</script>
